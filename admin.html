<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fateh27 Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#07152d;color:white;font-family:Arial;padding:20px}
input,textarea{width:100%;padding:12px;margin:10px 0;background:#0f2348;color:white;border:none;border-radius:10px}
button{width:100%;padding:14px;background:#229ED9;color:white;border:none;border-radius:12px;font-size:16px}
</style>
</head>
<body>

<h1>🔐 Fateh27 Admin</h1>

<input id="title" placeholder="Current Affairs Title">
<textarea id="summary" rows="6" placeholder="Summary"></textarea>

<button onclick="save()">💾 Save Current Affairs</button>

<script type="module">
24  import { db } from "./firebaseConfig.js";
25  import { collection, addDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
26  Telegram.WebApp.ready();
27  Telegram.WebApp.expand();
28  const ADMIN_ID = 5496422260;
Telegram.WebApp.ready();
Telegram.WebApp.expand();
const ADMIN_ID = 5496422260;

const user = Telegram.WebApp.initDataUnsafe?.user;

if (!user || user.id !== ADMIN_ID) {
  document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:80px'>❌ Access Denied</h2>";
  throw new Error("Not Admin");
}
window.save = async function(){

 const title = document.getElementById("title").value;
 const summary = document.getElementById("summary").value;

 await addDoc(collection(db,"currentAffairs"),{
   title,
   summary,
   date:new Date().toLocaleDateString("en-GB"),
   source:"Admin"
 });

 Telegram.WebApp.showAlert("Current Affairs Saved!");
}

 const title=document.getElementById("title").value;
 const summary=document.getElementById("summary").value;

 const res=await fetch("/api/saveCurrent",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({title,summary})
 });

 const data=await res.json();

 Telegram.WebApp.showAlert(data.message);
}
</script>

</body>
</html>
