<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FATEH27</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="./progress.js"></script>

<style>

/* =========================================================
   FATEH27 PREMIUM THEME
   ========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#F4F4F4;
  color:#111;
  overflow-x:hidden;
}

/* BACKGROUND */

.bg{
  position:fixed;
  inset:0;
  z-index:-3;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(0,0,0,.045),
      transparent 32%
    ),
    radial-gradient(
      circle at 85% 35%,
      rgba(0,0,0,.035),
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #F7F7F7 0%,
      #F1F1F1 50%,
      #ECECEC 100%
    );
}

.grid{
  position:fixed;
  inset:0;
  z-index:-2;

  background-image:
    linear-gradient(
      rgba(0,0,0,.018) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(0,0,0,.018) 1px,
      transparent 1px
    );

  background-size:40px 40px;

  pointer-events:none;
}

.scan{
  display:none;
}


/* =========================================================
   MAIN WRAPPER
   ========================================================= */

.wrap{
  width:100%;
  max-width:620px;
  margin:auto;

  padding:18px;
  padding-bottom:115px;
}


/* =========================================================
   GLASS PANELS
   ========================================================= */

.panel,
.card,
.subject,
.secretary{

  background:rgba(255,255,255,.72);

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  border:1px solid rgba(0,0,0,.055);

  border-radius:26px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.055),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.panel{
  padding:20px;
}


/* =========================================================
   TOP
   ========================================================= */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1px;
}

.badge{

  padding:7px 11px;

  border-radius:999px;

  background:#111;
  color:#fff;

  font-size:10px;
  font-weight:800;

  letter-spacing:.5px;

  box-shadow:
    0 6px 16px rgba(0,0,0,.14);
}


/* =========================================================
   PROFILE
   ========================================================= */

.profile{
  display:flex;
  gap:14px;
  align-items:center;
  margin-top:20px;
}

.avatar{

  width:62px;
  height:62px;

  flex-shrink:0;

  border-radius:50%;

  background:#111;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:25px;
  font-weight:800;

  overflow:hidden;

  box-shadow:
    0 8px 20px rgba(0,0,0,.15);
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}


/* =========================================================
   ID CARD
   ========================================================= */

.idcard{

  margin-top:18px;

  padding:18px;

  position:relative;
  overflow:hidden;

  border-radius:23px;

  background:
    linear-gradient(
      145deg,
      #171717,
      #090909
    );

  color:#fff;

  box-shadow:
    0 14px 30px rgba(0,0,0,.18);
}

.idcard:after{

  content:"";

  position:absolute;

  top:-80%;
  left:-100%;

  width:70%;
  height:220%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.12),
      transparent
    );

  transform:rotate(20deg);

  animation:holo 6s linear infinite;
}

@keyframes holo{

  0%{
    left:-100%;
  }

  100%{
    left:160%;
  }

}


/* =========================================================
   GLOBE / COMMAND CORE
   ========================================================= */

.globe{

  width:230px;
  height:230px;

  margin:28px auto;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;
}

.earth{

  position:absolute;

  width:175px;
  height:175px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #ffffff,
      #d8d8d8 45%,
      #999 100%
    );

  box-shadow:
    0 0 35px rgba(0,0,0,.12),
    inset -20px -20px 35px rgba(0,0,0,.12);

  animation:earthRotate 12s linear infinite;
}

@keyframes earthRotate{

  to{
    transform:rotate(360deg);
  }

}

.orbit{

  position:absolute;

  border:1px solid rgba(0,0,0,.13);

  border-radius:50%;
}

.orbit1{
  width:210px;
  height:210px;

  animation:spin1 8s linear infinite;
}

.orbit2{
  width:180px;
  height:180px;

  transform:rotateX(75deg);

  animation:spin2 6s linear infinite;
}

.orbit3{
  width:150px;
  height:150px;

  transform:rotateY(70deg);

  animation:spin3 12s linear infinite reverse;
}

@keyframes spin1{

  to{
    transform:rotate(360deg);
  }

}

@keyframes spin2{

  to{
    transform:rotate(-360deg);
  }

}

@keyframes spin3{

  to{
    transform:rotate(360deg);
  }

}

.radarSweep{

  position:absolute;

  width:210px;
  height:210px;

  border-radius:50%;

  background:
    conic-gradient(
      from 0deg,
      rgba(0,0,0,.10),
      transparent 45%
    );

  animation:radar 4s linear infinite;
}

@keyframes radar{

  to{
    transform:rotate(360deg);
  }

}

.indiaPulse{

  position:absolute;

  width:12px;
  height:12px;

  background:#111;

  border-radius:50%;

  top:82px;
  right:92px;

  box-shadow:
    0 0 14px rgba(0,0,0,.35);

  animation:pulse 1.5s infinite;
}

@keyframes pulse{

  50%{
    transform:scale(1.7);
  }

}

.center{

  position:absolute;

  inset:0;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;
}

#xp{

  font-size:32px;
  font-weight:900;

  color:#111;

  letter-spacing:-1px;
}

#rank{

  color:#666;

  font-size:13px;
  font-weight:600;
}


/* =========================================================
   STATS
   ========================================================= */

.stats{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;

  margin-top:18px;
}

.card{

  padding:18px;
}

.stat{

  font-size:28px;

  font-weight:900;

  color:#111;

  margin-bottom:3px;
}


/* =========================================================
   SECTIONS
   ========================================================= */

.section{

  font-size:19px;

  font-weight:900;

  margin:25px 0 12px;

  letter-spacing:-.3px;
}


/* =========================================================
   SUBJECTS
   ========================================================= */

.subjects{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;
}

.subject{

  padding:16px;

  min-height:105px;
}

.subject b{

  font-size:14px;

  display:block;

  margin-bottom:8px;
}

.bar{

  height:7px;

  background:#dedede;

  border-radius:999px;

  overflow:hidden;

  margin-top:9px;
}

.fill{

  height:100%;

  background:#111;

  border-radius:999px;

  transition:
    width .5s ease;
}


/* =========================================================
   AI SECRETARY
   ========================================================= */

.secretary{

  padding:17px;
}

.secretary h3{

  font-size:15px;

  margin-bottom:8px;
}

.mission{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  padding:12px 0;

  border-bottom:
    1px solid rgba(0,0,0,.06);

  font-size:13px;
}

.mission span:last-child{

  font-weight:700;

  text-align:right;
}

#aiTip{

  margin-top:14px;

  padding:13px;

  border-radius:16px;

  background:#111;

  color:#fff;

  font-size:13px;

  line-height:1.45;

}


/* =========================================================
   APPLE MUSIC STYLE QUICK LAUNCH
   ========================================================= */

.quickLaunch{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  overflow:visible;
  background:transparent;
  border:0;
}
.quickBtn{
  width:100%;
  min-height:112px;
  margin:0;
  padding:16px;

  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;

  border:1px solid rgba(0,0,0,.055);
  border-radius:22px;

  background:rgba(255,255,255,.76);
  color:#111;

  box-shadow:
    0 8px 24px rgba(0,0,0,.055),
    inset 0 1px 0 rgba(255,255,255,.9);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  cursor:pointer;
  font-family:inherit;
  position:relative;
  text-align:left;
  -webkit-tap-highlight-color:transparent;

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease;
}
.quickBtn:last-child{border-bottom:0}
.quickBtn:hover{background:rgba(235,235,235,.82);transform:none}
.quickBtn:active{background:#e3e3e3;transform:scale(.992)}
.quickLeft{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  width:100%;
}
.quickIcon{width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#111;color:#fff;font-size:21px;box-shadow:0 3px 9px rgba(0,0,0,.12)}
.quickText{display:flex;flex-direction:column;gap:3px;min-width:0}
.quickTitle{font-size:15px;line-height:19px;font-weight:700;color:#111}
.quickSub{font-size:11px;line-height:15px;font-weight:400;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quickArrow{
  position:absolute;
  right:13px;
  bottom:13px;

  width:27px;
  height:27px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#ededed;
  color:#777;

  font-size:21px;
  font-weight:300;

  transition:
    background .18s ease,
    color .18s ease,
    transform .18s ease;
}
.quickBtn:hover .quickArrow{background:transparent;color:#666;transform:translateX(1px)}
@media(max-width:420px){.quickLaunch{border-radius:17px}.quickBtn{min-height:68px;padding:9px 5px 9px 7px}.quickIcon{width:45px;height:45px;border-radius:11px;font-size:20px}.quickLeft{gap:12px}.quickTitle{font-size:14px}.quickSub{font-size:10px}.quickArrow{font-size:23px}}

/* =========================================================
   LEVEL UP
   ========================================================= */

#level{

  position:fixed;

  inset:0;

  background:
    rgba(244,244,244,.96);

  backdrop-filter:blur(20px);

  display:none;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  z-index:500;
}

#level h1{

  font-size:45px;

  color:#111;

  letter-spacing:-2px;
}

#levelRank{

  margin-top:8px;

  color:#666;

  font-weight:700;
}


/* =========================================================
   TOAST
   ========================================================= */

#toast{

  position:fixed;

  left:50%;

  bottom:110px;

  transform:
    translateX(-50%)
    translateY(10px);

  background:#111;

  color:#fff;

  padding:11px 22px;

  border-radius:999px;

  font-size:13px;

  font-weight:800;

  opacity:0;

  transition:.35s;

  z-index:400;

  box-shadow:
    0 10px 25px rgba(0,0,0,.18);
}


/* =========================================================
   BOTTOM NAVIGATION
   ========================================================= */

.bottomNav{

  position:fixed;

  left:50%;

  bottom:17px;

  transform:translateX(-50%);

  width:calc(100% - 34px);

  max-width:480px;

  height:70px;

  padding:7px 9px;

  display:flex;

  align-items:center;

  justify-content:space-around;

  z-index:200;

  background:
    rgba(255,255,255,.86);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  border:
    1px solid rgba(0,0,0,.07);

  border-radius:999px;

  box-shadow:
    0 14px 42px rgba(0,0,0,.10),
    inset 0 1px 0 rgba(255,255,255,.95);
}

.navBtn{

  flex:1;

  height:56px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:2px;

  border-radius:999px;

  color:#777;

  text-decoration:none;

  font-size:10px;

  font-weight:600;

  transition:
    transform .16s ease,
    background .16s ease,
    color .16s ease;
}

.navBtn span{

  font-size:21px;

  line-height:22px;

  filter:grayscale(1);
}

.navBtn.active{

  color:#111;

  background:#e8e8e8;

  font-weight:800;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8);
}

.navBtn:active{

  transform:scale(.91);
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:420px){

  .wrap{
    padding:14px;
    padding-bottom:110px;
  }

  .panel{
    padding:16px;
    border-radius:23px;
  }

  .logo{
    font-size:25px;
  }

  .badge{
    font-size:9px;
    padding:6px 9px;
  }

  .quickBtn{
    min-height:66px;
  }

  .quickIcon{
    width:43px;
    height:43px;
  }

  .quickTitle{
    font-size:13px;
  }

  .quickSub{
    font-size:9px;
  }

}

@supports(padding:max(0px)){

  .bottomNav{

    bottom:max(
      17px,
      env(safe-area-inset-bottom)
    );

  }

}


/* =========================================================
   FATEH27 RESPONSIVE SAFETY LAYER
   Layout-only: preserves existing content, links and logic.
   ========================================================= */

html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

.wrap,
.panel,
.quickLaunch,
.quickBtn,
.quickLeft,
.quickText,
.subject,
.card {
  min-width: 0;
  max-width: 100%;
}

.quickLaunch {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.quickBtn {
  overflow: hidden;
}

.quickText {
  width: 0;
  flex: 1 1 auto;
}

.quickTitle,
.quickSub {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

.quickArrow {
  right: 10px;
  bottom: 10px;
}

/* Tablets / narrow Telegram WebViews */
@media (max-width: 600px) {
  .wrap {
    width: 100%;
    padding-left: 12px;
    padding-right: 12px;
    padding-bottom: 112px;
  }

  .panel {
    width: 100%;
    padding: 16px;
  }

  .quickLaunch {
    grid-template-columns: 1fr;
    gap: 9px;
  }

  .quickBtn {
    width: 100%;
    min-height: 70px;
    height: auto;
    padding: 10px 42px 10px 10px;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
  }

  .quickLeft {
    width: 100%;
    min-width: 0;
    align-items: center;
  }

  .quickIcon {
    width: 44px;
    height: 44px;
    flex: 0 0 44px;
    font-size: 19px;
  }

  .quickText {
    min-width: 0;
  }

  .quickTitle {
    font-size: 14px;
    line-height: 18px;
    white-space: nowrap;
  }

  .quickSub {
    font-size: 10px;
    line-height: 14px;
    white-space: nowrap;
  }

  .quickArrow {
    top: 50%;
    right: 9px;
    bottom: auto;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
  }

  .quickBtn:hover .quickArrow {
    transform: translateY(-50%);
  }

  .bottomNav {
    width: calc(100% - 20px);
    max-width: none;
    height: 66px;
    bottom: max(10px, env(safe-area-inset-bottom));
  }

  .navBtn {
    min-width: 0;
  }

  .navBtn span {
    font-size: 19px;
  }
}

/* Very small phones */
@media (max-width: 380px) {
  .wrap {
    padding-left: 8px;
    padding-right: 8px;
  }

  .panel {
    padding: 13px;
    border-radius: 20px;
  }

  .top {
    gap: 7px;
  }

  .logo {
    font-size: 23px;
  }

  .badge {
    font-size: 8px;
    padding: 6px 8px;
  }

  .profile {
    gap: 10px;
  }

  .avatar {
    width: 54px;
    height: 54px;
  }

  .quickBtn {
    min-height: 64px;
    padding-left: 8px;
    padding-right: 39px;
  }

  .quickIcon {
    width: 40px;
    height: 40px;
    flex-basis: 40px;
    font-size: 18px;
  }

  .quickTitle {
    font-size: 13px;
  }

  .quickSub {
    font-size: 9px;
  }

  .bottomNav {
    width: calc(100% - 14px);
  }
}

/* Desktop / large tablets retain the original two-column Quick Launch. */
@media (min-width: 601px) {
  .quickLaunch {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

   TRUE VIEWPORT-FIT APP LAYOUT
   Phone / iOS / Android / Tablet / Laptop

/* Tablet: compact centred app, but uses available width */

<script>

/* =========================================================
   TELEGRAM OFFICER PROFILE
   ========================================================= */

const tg =
  window.Telegram?.WebApp || null;

if(tg){

  try{
    tg.ready();
    tg.expand();
  }catch(error){
    console.warn("Telegram WebApp init:", error);
  }

}

async function showOwnerAdminButton(){
  const adminButton = document.getElementById("ownerAdminButton");
  if(!adminButton) return;
  adminButton.style.display = "none";

  const user = tg?.initDataUnsafe?.user || null;

  // Fast local check so the owner sees the button immediately.
  if(user && String(user.id) === "5496422260"){
    adminButton.style.display = "block";
  }

  // Server-side verification is the source of truth.
  // This also handles Telegram WebApp data becoming available slightly later.
  const initData = tg?.initData || "";
  if(!initData) return;

  try{
    const response = await fetch("/api/access?admin=1",{
      headers:{"x-telegram-init-data":initData}
    });

    if(response.ok){
      adminButton.style.display = "block";
    }
  }catch(error){
    console.warn("FATEH27 owner admin check:", error);
  }
}

function applyOfficerProfile(){

  const user =
    tg?.initDataUnsafe?.user || null;

  const nameEl =
    document.getElementById("username");

  const cardNameEl =
    document.getElementById("cardName");

  const avatarEl =
    document.getElementById("avatar");

  const officerIdEl =
    document.getElementById("officerId");

  if(!nameEl || !cardNameEl || !avatarEl || !officerIdEl){
    return false;
  }

  if(user){

    const fullName =
      [user.first_name, user.last_name]
        .filter(Boolean)
        .join(" ")
        .trim();

    const displayName =
      fullName || user.username || "Officer";

    nameEl.textContent =
      displayName;

    cardNameEl.textContent =
      displayName;

    avatarEl.textContent =
      (user.first_name || displayName || "F")[0]
        .toUpperCase();

    if(user.photo_url){

      avatarEl.innerHTML =
        '<img src="' +
        String(user.photo_url).replace(/"/g, "&quot;") +
        '" alt="Profile">';

    }

    /* Keep the old F27-XXXX style, but make the ID stable per Telegram user. */
    const storageKey =
      "f27OfficerId_" + String(user.id);

    if(!localStorage.getItem(storageKey)){

      localStorage.setItem(
        storageKey,
        "F27-" +
        Math.floor(
          1000 +
          Math.random() * 9000
        )
      );

    }

    officerIdEl.textContent =
      localStorage.getItem(storageKey);

    return true;

  }

  /* Outside Telegram, keep the old fallback behaviour. */
  if(!localStorage.officerId){

    localStorage.officerId =
      "F27-" +
      Math.floor(
        1000 +
        Math.random() * 9000
      );

  }

  nameEl.textContent =
    "Officer";

  cardNameEl.textContent =
    "Officer";

  avatarEl.textContent =
    "F";

  officerIdEl.textContent =
    localStorage.officerId;

  return false;

}

/* Telegram can populate initDataUnsafe immediately or a moment later. */
applyOfficerProfile();
showOwnerAdminButton();
setTimeout(showOwnerAdminButton, 500);
setTimeout(showOwnerAdminButton, 1500);

setTimeout(
  applyOfficerProfile,
  300
);

setTimeout(
  applyOfficerProfile,
  1000
);


/* RANK */

function rankName(x){

  if(x >= 1500)
    return "🏆 Officer";

  if(x >= 800)
    return "⚔ Warrior";

  if(x >= 300)
    return "🥈 Aspirant";

  return "🟢 Recruit";

}


/* PERCENTAGE */

function pct(v){

  return Math.min(
    100,
    Math.round(
      (v / 25) * 100
    )
  );

}


/* CLOCK */

function tick(){

  clock.textContent =
    new Date().toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}

setInterval(
  tick,
  1000
);

tick();


/* LOAD PROGRESS */

function load(){

  const d =
    (
      window.Progress &&
      Progress.get
    )
    ?
    Progress.get()
    :
    {
      xp:0,
      streak:0,
      solved:0,
      gs1:0,
      gs2:0,
      gs3:0,
      gs4:0,
      lastActivity:"None"
    };


  /* XP */

  xp.textContent =
    d.xp + " XP";

  rank.textContent =
    rankName(d.xp);


  /* STATS */

  streak.textContent =
    d.streak || 0;

  solved.textContent =
    d.solved || 0;


  /* GS */

  gs1.textContent =
    d.gs1 || 0;

  gs2.textContent =
    d.gs2 || 0;

  gs3.textContent =
    d.gs3 || 0;

  gs4.textContent =
    d.gs4 || 0;


  /* BARS */

  f1.style.width =
    pct(d.gs1) + "%";

  f2.style.width =
    pct(d.gs2) + "%";

  f3.style.width =
    pct(d.gs3) + "%";

  f4.style.width =
    pct(d.gs4) + "%";


  /* WEAK SUBJECT */

  const arr = [

    {
      n:"GS1",
      v:d.gs1
    },

    {
      n:"GS2",
      v:d.gs2
    },

    {
      n:"GS3",
      v:d.gs3
    },

    {
      n:"GS4",
      v:d.gs4
    }

  ].sort(
    (a,b) =>
      a.v - b.v
  );


  weakSubject.textContent =
    arr[0].n;


  /* AI STATUS */

  if(d.streak === 0){

    statusMsg.textContent =
      "Alert";

    aiTip.textContent =
      "Aaj kam se kam 1 question solve karo.";

  }

  else if(d.solved < 4){

    statusMsg.textContent =
      "Mission Pending";

    aiTip.textContent =
      `${arr[0].n} par focus karo. ${
        4 - d.solved
      } answers aur likhne hain.`;

  }

  else{

    statusMsg.textContent =
      "Excellent";

    aiTip.textContent =
      "Aaj ka mission complete. Revision mode activate karo.";

  }


  /* RECENT */

  recent.textContent =
    d.lastActivity || "None";


  /* XP TOAST */

  const oldXP =
    Number(
      localStorage.lastXP || 0
    );

  const oldRank =
    localStorage.lastRank ||
    rankName(oldXP);

  const newRank =
    rankName(d.xp);


  if(d.xp > oldXP){

    toast.textContent =
      "+" +
      (d.xp - oldXP) +
      " XP";

    toast.style.opacity = 1;

    toast.style.transform =
      "translateX(-50%) translateY(0)";

    setTimeout(
      () => {

        toast.style.opacity = 0;

        toast.style.transform =
          "translateX(-50%) translateY(10px)";

      },
      1500
    );

  }


  /* LEVEL UP */

  if(oldRank !== newRank){

    level.style.display =
      "flex";

    levelRank.textContent =
      newRank;

    setTimeout(
      () => {

        level.style.display =
          "none";

      },
      2200
    );

  }


  localStorage.lastXP =
    d.xp;

  localStorage.lastRank =
    newRank;

}


load();

</script>
