<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FATEH27 • WAR ROOM</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="./progress.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#020817,#07152d,#0b1f3f);
color:#fff;
padding:18px;
padding-bottom:90px;
}
.hero{
background:linear-gradient(135deg,#0f2348,#102c5c);
border:1px solid rgba(34,158,217,.3);
border-radius:24px;
padding:22px;
box-shadow:0 0 25px rgba(34,158,217,.15);
margin-bottom:18px;
}
.title{font-size:30px;font-weight:900;letter-spacing:2px}
.sub{color:#9fb3d9;font-size:13px;margin-top:6px}
.badge{
display:inline-block;
padding:6px 14px;
background:#163a72;
border:1px solid #2aa8ff;
border-radius:999px;
margin-top:12px;
font-size:13px;
}
.ring{
width:170px;
height:170px;
margin:20px auto;
position:relative;
}
.ring svg{transform:rotate(-90deg)}
.center{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}
#xp{font-size:30px;font-weight:900}
#rank{color:#8fd3ff;font-size:15px}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:18px;
}
.card{
background:#0f2348;
border:1px solid rgba(255,255,255,.05);
border-radius:18px;
padding:16px;
box-shadow:0 0 12px rgba(0,0,0,.25);
}
.stat{
font-size:28px;
font-weight:bold;
color:#4fd1ff;
}
.label{
font-size:13px;
color:#a6c0e6;
margin-top:6px;
}
.section{
font-size:20px;
font-weight:bold;
margin:18px 0 10px;
}
.subjects{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}
.subject{
background:#10254d;
border:1px solid rgba(79,209,255,.15);
border-radius:18px;
padding:18px;
text-align:center;
}
.subject b{display:block;font-size:20px;margin-bottom:6px}
.subject span{color:#7dd3fc;font-size:13px}
.mission{
display:flex;
align-items:center;
gap:10px;
margin:12px 0;
}
.mission input{
width:22px;
height:22px;
accent-color:#22c55e;
}
.activity{
padding:12px;
background:#132c59;
border-radius:14px;
margin-top:10px;
font-size:14px;
}
button{
width:100%;
padding:16px;
margin-top:12px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#229ED9,#2563eb);
color:white;
font-size:16px;
font-weight:bold;
box-shadow:0 6px 18px rgba(34,158,217,.35);
cursor:pointer;
}
</style>
</head>

<body>

<div class="hero">

<div class="title">⚔ FATEH27</div>
<div class="sub">UPSC WAR ROOM • Mission IAS</div>
<div class="badge" id="time">00:00</div>

<div class="ring">

<svg width="170" height="170">

<circle cx="85" cy="85" r="68"
stroke="#16345f"
stroke-width="10"
fill="none"/>

<circle id="ring"
cx="85"
cy="85"
r="68"
stroke="#36d1ff"
stroke-width="10"
fill="none"
stroke-linecap="round"
stroke-dasharray="427"
stroke-dashoffset="427"/>

</svg>

<div class="center">
<div id="xp">0 XP</div>
<div id="rank">Recruit</div>
</div>

</div>

</div>

<div class="grid">

<div class="card">
<div class="stat" id="streak">0</div>
<div class="label">🔥 Day Streak</div>
</div>

<div class="card">
<div class="stat" id="solved">0</div>
<div class="label">✅ Questions Solved</div>
</div>

</div>

<div class="section">📊 Subject Progress</div>

<div class="subjects">

<div class="subject">
<b>📘 GS1</b>
<span id="gs1">0</span>
</div>

<div class="subject">
<b>📗 GS2</b>
<span id="gs2">0</span>
</div>

<div class="subject">
<b>📙 GS3</b>
<span id="gs3">0</span>
</div>

<div class="subject">
<b>📕 GS4</b>
<span id="gs4">0</span>
</div>

</div>

<div class="section">🎯 Today's Mission</div>

<div class="card">

<label class="mission">
<input type="checkbox">
<span>4 Answer Writing</span>
</label>

<label class="mission">
<input type="checkbox">
<span>The Hindu + PIB</span>
</label>

<label class="mission">
<input type="checkbox">
<span>1 Hour Revision</span>
</label>

</div>

<div class="section">📜 Recent Activity</div>

<div class="card">

<div class="activity" id="recent">
No activity yet.
</div>

</div>

<div class="section">⚡ Quick Launch</div>

<button onclick="location.href='gs1.html'">📘 GS1</button>
<button onclick="location.href='gs2.html'">📗 GS2</button>
<button onclick="location.href='gs3.html'">📙 GS3</button>
<button onclick="location.href='gs4.html'">📕 GS4</button>

<script>
Telegram.WebApp.ready();
Telegram.WebApp.expand();

function getRank(x){
if(x>=1500)return"🏆 Officer";
if(x>=800)return"⚔ Warrior";
if(x>=300)return"🥈 Aspirant";
return"🟢 Recruit";
}

function load(){

const d=Progress.get();

xp.textContent=d.xp+" XP";
rank.textContent=getRank(d.xp);

streak.textContent=d.streak||0;
solved.textContent=d.solved||0;

gs1.textContent=d.gs1||0;
gs2.textContent=d.gs2||0;
gs3.textContent=d.gs3||0;
gs4.textContent=d.gs4||0;

recent.textContent=d.lastActivity||"No activity yet.";

const goal=1500;
const p=Math.min(d.xp/goal,1);
const c=427;
ring.style.strokeDashoffset=c-(c*p);

}

function clock(){
const n=new Date();
time.textContent=n.toLocaleTimeString([],{
hour:'2-digit',
minute:'2-digit'
});
}

setInterval(clock,1000);
clock();
load();
</script>

</body>
</html>
