<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FATEH27 • War Room</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="./progress.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#07152d;
 color:white;
 font-family:Arial,sans-serif;
 padding:20px;
}
.card{
 background:#0f2348;
 border-radius:18px;
 padding:18px;
 margin:14px 0;
}
button{
 width:100%;
 padding:14px;
 border:none;
 border-radius:14px;
 margin:8px 0;
 background:#229ED9;
 color:white;
 font-size:16px;
 font-weight:bold;
}
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}
.small{
 background:#132c59;
 padding:16px;
 border-radius:14px;
 text-align:center;
}
.ring{
 width:130px;
 height:130px;
 margin:auto;
 position:relative;
}
.ring svg{
 transform:rotate(-90deg);
}
.center{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
}
label{
 display:flex;
 align-items:center;
 gap:10px;
 margin:10px 0;
}
</style>
</head>
<body>

<h1>⚔️ FATEH27</h1>

<div class="card">

<div class="ring">

<svg width="130" height="130">
<circle cx="65" cy="65" r="52" stroke="#1d3d70" stroke-width="10" fill="none"/>
<circle id="progressRing"
cx="65" cy="65" r="52"
stroke="#22c55e"
stroke-width="10"
fill="none"
stroke-linecap="round"
stroke-dasharray="327"
stroke-dashoffset="327"/>
</svg>

<div class="center">
<h2 id="xp">0 XP</h2>
<p id="rank">Recruit</p>
</div>

</div>

</div>

<div class="grid">

<div class="small">
<h2 id="streak">0</h2>
<p>🔥 Streak</p>
</div>

<div class="small">
<h2 id="solved">0</h2>
<p>✅ Solved</p>
</div>

</div>

<div class="card">

<h2>📊 Subject Progress</h2>

<div class="grid">

<div class="small"><b>GS1</b><br><span id="gs1">0</span></div>
<div class="small"><b>GS2</b><br><span id="gs2">0</span></div>
<div class="small"><b>GS3</b><br><span id="gs3">0</span></div>
<div class="small"><b>GS4</b><br><span id="gs4">0</span></div>

</div>

</div>

<div class="card">

<h2>🎯 Today's Mission</h2>

<label><input type="checkbox"> 4 Answer Writing</label>
<label><input type="checkbox"> GS Revision</label>
<label><input type="checkbox"> Current Affairs</label>

</div>

<div class="card">

<h2>📜 Recent Activity</h2>
<p id="recent">No activity yet.</p>

</div>

<button onclick="location.href='gs1.html'">📘 GS1</button>
<button onclick="location.href='gs2.html'">📗 GS2</button>
<button onclick="location.href='gs3.html'">📙 GS3</button>
<button onclick="location.href='gs4.html'">📕 GS4</button>

<script>
Telegram.WebApp.ready();
Telegram.WebApp.expand();

function rank(x){
 if(x>=1500)return"🏆 Officer";
 if(x>=800)return"⚔️ Warrior";
 if(x>=300)return"🥈 Aspirant";
 return"🟢 Recruit";
}

function load(){

 const d=Progress.get();

 document.getElementById("xp").textContent=d.xp+" XP";
 document.getElementById("rank").textContent=rank(d.xp);

 document.getElementById("streak").textContent=d.streak;
 document.getElementById("solved").textContent=d.solved;

 document.getElementById("gs1").textContent=d.gs1||0;
 document.getElementById("gs2").textContent=d.gs2||0;
 document.getElementById("gs3").textContent=d.gs3||0;
 document.getElementById("gs4").textContent=d.gs4||0;

 document.getElementById("recent").textContent=
 d.lastActivity||"No activity yet.";

 const goal=1500;
 const p=Math.min(d.xp/goal,1);
 const c=327;
 document.getElementById("progressRing").style.strokeDashoffset=c-(c*p);

}

load();
</script>

</body>
</html>
