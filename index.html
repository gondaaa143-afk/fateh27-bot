/* =========================================================
   FATEH27 — PREMIUM GREY UI
   ========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  background:#F4F4F4;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  background:#F4F4F4;
  color:#111111;
  overflow-x:hidden;
  min-height:100vh;
}

/* ---------- BACKGROUND ---------- */

.bg{
  position:fixed;
  inset:0;
  z-index:-5;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(255,255,255,.95),
      transparent 48%
    ),
    linear-gradient(
      180deg,
      #F7F7F7 0%,
      #F1F1F1 45%,
      #E9E9E9 100%
    );
}

.grid,
.scan{
  display:none;
}

/* ---------- PAGE ---------- */

.wrap{
  width:100%;
  max-width:520px;
  margin:0 auto;

  padding:18px 18px 120px;
}

/* ---------- MAIN PANEL ---------- */

.panel{
  position:relative;

  background:rgba(255,255,255,.68);

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  border:1px solid rgba(0,0,0,.07);

  border-radius:34px;

  padding:22px;

  box-shadow:
    0 12px 40px rgba(0,0,0,.07),
    inset 0 1px 0 rgba(255,255,255,.9);
}

/* ---------- TOP ---------- */

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  font-size:28px;
  line-height:1;
  font-weight:900;
  letter-spacing:-1.5px;
  color:#111;
}

.badge{
  padding:8px 12px;

  border-radius:999px;

  background:#111;
  color:#fff;

  font-size:10px;
  font-weight:700;
  letter-spacing:.3px;

  white-space:nowrap;
}

/* ---------- PROFILE ---------- */

.profile{
  display:flex;
  align-items:center;
  gap:14px;
  margin-top:24px;
}

.avatar{
  width:64px;
  height:64px;

  flex-shrink:0;

  border-radius:50%;

  background:#111;

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:25px;
  font-weight:800;

  overflow:hidden;

  box-shadow:
    0 8px 20px rgba(0,0,0,.15);
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

#username{
  color:#111 !important;
}

#officerId{
  margin-top:3px;
  color:#777;
  font-size:13px;
}

#clock{
  margin-top:4px;
  color:#999;
  font-size:12px;
}

/* ---------- OFFICER CARD ---------- */

.idcard{
  position:relative;
  overflow:hidden;

  margin-top:20px;

  padding:20px;

  min-height:110px;

  border-radius:28px;

  background:#111;

  color:#fff;

  border:none;

  box-shadow:
    0 16px 32px rgba(0,0,0,.16);
}

.idcard:after{
  content:"";

  position:absolute;

  width:150%;
  height:100%;

  top:0;
  left:-160%;

  background:
    linear-gradient(
      100deg,
      transparent,
      rgba(255,255,255,.14),
      transparent
    );

  transform:skewX(-18deg);

  animation:idshine 5s infinite;
}

@keyframes idshine{
  0%{
    left:-160%;
  }

  45%,
  100%{
    left:160%;
  }
}

.idcard > *{
  position:relative;
  z-index:2;
}

.idcard div:first-child{
  color:#aaa !important;
}

#cardName{
  color:#fff !important;
}

.idcard div:last-child{
  color:#aaa !important;
}

/* ---------- GLOBE ---------- */

.globe{
  width:230px;
  height:230px;

  margin:28px auto 18px;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;
}

.earth{
  position:absolute;

  width:168px;
  height:168px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 32% 28%,
      #777 0%,
      #333 38%,
      #111 72%
    );

  box-shadow:
    inset -18px -18px 35px rgba(0,0,0,.45),
    inset 12px 10px 22px rgba(255,255,255,.08),
    0 18px 40px rgba(0,0,0,.18);

  animation:earthRotate 18s linear infinite;
}

@keyframes earthRotate{
  to{
    transform:rotate(360deg);
  }
}

.orbit{
  position:absolute;

  border:1px solid rgba(0,0,0,.11);

  border-radius:50%;
}

.orbit1{
  width:210px;
  height:210px;

  animation:orbit1 12s linear infinite;
}

.orbit2{
  width:182px;
  height:182px;

  transform:rotateX(70deg);

  animation:orbit2 9s linear infinite;
}

.orbit3{
  width:150px;
  height:150px;

  transform:rotateY(70deg);

  animation:orbit3 15s linear infinite reverse;
}

@keyframes orbit1{
  to{
    transform:rotate(360deg);
  }
}

@keyframes orbit2{
  to{
    transform:rotate(-360deg);
  }
}

@keyframes orbit3{
  to{
    transform:rotate(360deg);
  }
}

.radarSweep{
  display:none;
}

.indiaPulse{
  position:absolute;

  width:11px;
  height:11px;

  top:82px;
  right:92px;

  border-radius:50%;

  background:#111;

  box-shadow:
    0 0 0 5px rgba(17,17,17,.08),
    0 0 14px rgba(0,0,0,.3);

  animation:locationPulse 1.8s infinite;
}

@keyframes locationPulse{
  50%{
    transform:scale(1.5);
  }
}

.center{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;
}

#xp{
  font-size:31px;
  font-weight:900;
  letter-spacing:-1px;
  color:#111;
}

#rank{
  margin-top:2px;
  color:#666;
  font-size:13px;
  font-weight:600;
}

/* ---------- STATS ---------- */

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:12px;

  margin-top:16px;
}

.card{
  padding:18px;

  min-height:90px;

  background:rgba(255,255,255,.74);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border:1px solid rgba(0,0,0,.07);

  border-radius:26px;

  box-shadow:
    0 8px 24px rgba(0,0,0,.055),
    inset 0 1px 0 rgba(255,255,255,.8);
}

.stat{
  font-size:29px;
  line-height:1;
  font-weight:900;
  color:#111;
  margin-bottom:7px;
}

/* ---------- SECTION ---------- */

.section{
  margin:28px 2px 13px;

  font-size:20px;
  font-weight:800;

  letter-spacing:-.5px;

  color:#111;
}

/* ---------- SUBJECTS ---------- */

.subjects{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:12px;
}

.subject{
  padding:17px;

  min-height:105px;

  background:rgba(255,255,255,.70);

  backdrop-filter:blur(18px);

  border:1px solid rgba(0,0,0,.07);

  border-radius:25px;

  box-shadow:
    0 7px 22px rgba(0,0,0,.05);
}

.subject b{

}

.subject > div:nth-child(2){
  margin-top:8px;

  font-size:23px;
  font-weight:800;
}

/* ---------- PROGRESS BAR ---------- */

.bar{
  height:7px;

  margin-top:9px;

  overflow:hidden;

  border-radius:999px;

  background:#E1E1E1;
}

.fill{
  width:0;

  border-radius:999px;

  background:#111;

  transition:
    width .7s ease;
}

/* ---------- SECRETARY ---------- */

.secretary{

.secretary h3{

  text-align:right;

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


/* ---------- TELEGRAM USER ---------- */

const user =
  tg.initDataUnsafe?.user;


if(user){

  username.textContent =
    user.first_name || "Officer";

  cardName.textContent =
    user.first_name || "Officer";

  avatar.textContent =
    (user.first_name || "F")[0];

  if(user.photo_url){

    avatar.innerHTML =
      '<img src="' +
      user.photo_url +
      '">';

  }

}


/* ---------- OFFICER ID ---------- */

if(!localStorage.officerId){

  localStorage.officerId =
    "F27-" +
    Math.floor(
      1000 +
      Math.random() * 9000
    );

}

officerId.textContent =
  localStorage.officerId;


/* ---------- RANK ---------- */

function rankName(x){

  if(x >= 1500)
    return "🏆 Officer";

  if(x >= 800)
    return "⚔ Warrior";

  if(x >= 300)
    return "🥈 Aspirant";

  return "🟢 Recruit";

}


/* ---------- PROGRESS ---------- */

function pct(v){

  return Math.min(
    100,
    Math.round((v / 25) * 100)
  );

}


/* ---------- CLOCK ---------- */

function tick(){

  clock.textContent =
    new Date().toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}

setInterval(
  tick,
  1000
);

tick();


/* ---------- LOAD DATA ---------- */

function load(){

  const d =
    (
      window.Progress &&
      Progress.get
    )
    ?
    Progress.get()
    :
    {
      xp:0,
      streak:0,
      solved:0,
      gs1:0,
      gs2:0,
      gs3:0,
      gs4:0,
      lastActivity:"None"
    };


  /* XP */

  xp.textContent =
    (d.xp || 0) +
    " XP";


  rank.textContent =
    rankName(
      d.xp || 0
    );


  /* STATS */

  streak.textContent =
    d.streak || 0;

  solved.textContent =
    d.solved || 0;


  /* SUBJECTS */

  gs1.textContent =
    d.gs1 || 0;

  gs2.textContent =
    d.gs2 || 0;

  gs3.textContent =
    d.gs3 || 0;

  gs4.textContent =
    d.gs4 || 0;


  /* BARS */

  f1.style.width =
    pct(d.gs1 || 0) + "%";

  f2.style.width =
    pct(d.gs2 || 0) + "%";

  f3.style.width =
    pct(d.gs3 || 0) + "%";

  f4.style.width =
    pct(d.gs4 || 0) + "%";


  /* WEAK SUBJECT */

  const arr = [

    {
      n:"GS1",
      v:d.gs1 || 0
    },

    {
      n:"GS2",
      v:d.gs2 || 0
    },

    {
      n:"GS3",
      v:d.gs3 || 0
    },

    {
      n:"GS4",
      v:d.gs4 || 0
    }

  ].sort(
    (a,b) => a.v - b.v
  );


  weakSubject.textContent =
    arr[0].n;


  /* AI STATUS */

  if((d.streak || 0) === 0){

    statusMsg.textContent =
      "Alert";

    aiTip.textContent =
      "Aaj kam se kam 1 question solve karo.";

  }

  else if((d.solved || 0) < 4){

    statusMsg.textContent =
      "Mission Pending";

    aiTip.textContent =
      arr[0].n +
      " par focus karo. " +
      (4 - d.solved) +
      " answers aur likhne hain.";

  }

  else{

    statusMsg.textContent =
      "Excellent";

    aiTip.textContent =
      "Aaj ka mission complete. Revision mode activate karo.";

  }


  recent.textContent =
    d.lastActivity ||
    "None";


  /* ---------- XP CHANGE ---------- */

  const oldXP =
    Number(
      localStorage.lastXP || 0
    );


  const oldRank =
    localStorage.lastRank ||
    rankName(oldXP);


  const newRank =
    rankName(
      d.xp || 0
    );


  if((d.xp || 0) > oldXP){

    toast.textContent =
      "+" +
      ((d.xp || 0) - oldXP) +
      " XP";

    toast.style.opacity =
      1;

    setTimeout(
      () => {
        toast.style.opacity = 0;
      },
      1500
    );

  }


  /* ---------- LEVEL UP ---------- */

  if(oldRank !== newRank){

    level.style.display =
      "flex";

    levelRank.textContent =
      newRank;

    setTimeout(
      () => {
        level.style.display =
          "none";
      },
      2200
    );

  }


  localStorage.lastXP =
    d.xp || 0;

  localStorage.lastRank =
    newRank;

}


/* ---------- START ---------- */

load();

</script>
