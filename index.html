<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FATEH27 • WAR ROOM</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="./progress.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#020817,#07152d,#0b1f3f);
color:#fff;
padding:18px;
padding-bottom:90px;
overflow-x:hidden;
}
.scan{
position:fixed;
top:-100%;
left:0;
width:100%;
height:200px;
background:linear-gradient(180deg,transparent,rgba(54,209,255,.12),transparent);
animation:scan 5s linear infinite;
pointer-events:none;
}
@keyframes scan{
0%{top:-30%}
100%{top:120%}
}
.hero{
background:linear-gradient(135deg,#0f2348,#102c5c);
border:1px solid rgba(54,209,255,.25);
border-radius:24px;
padding:22px;
box-shadow:0 0 30px rgba(34,158,217,.18);
}
.profile{
display:flex;
align-items:center;
gap:14px;
}
.avatar{
width:64px;
height:64px;
border-radius:50%;
background:#16345f;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
overflow:hidden;
border:2px solid #36d1ff;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{font-size:24px;font-weight:800}
.id{color:#8fd3ff;font-size:13px}
.clock{
margin-top:8px;
display:inline-block;
padding:6px 12px;
border-radius:999px;
background:#16345f;
color:#8fd3ff;
}
.ring{width:170px;height:170px;margin:20px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.glow{filter:drop-shadow(0 0 8px #36d1ff)}
.center{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}
#xp{font-size:30px;font-weight:900}
#rank{color:#8fd3ff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.card{
background:#0f2348;
border-radius:18px;
padding:16px;
border:1px solid rgba(255,255,255,.05);
}
.stat{font-size:26px;font-weight:bold;color:#4fd1ff}
.label{font-size:13px;color:#a6c0e6}
.section{font-size:20px;font-weight:bold;margin:18px 0 10px}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subject{
background:#10254d;
border-radius:18px;
padding:18px;
text-align:center;
}
.subject b{display:block;font-size:20px}
.subject span{color:#7dd3fc}
button{
width:100%;
padding:16px;
margin-top:12px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#229ED9,#2563eb);
color:#fff;
font-size:16px;
font-weight:bold;
box-shadow:0 6px 18px rgba(34,158,217,.35);
}
#xpToast{
position:fixed;
left:50%;
bottom:120px;
transform:translateX(-50%);
padding:12px 22px;
border-radius:30px;
background:#16a34a;
font-weight:bold;
display:none;
animation:float 1.6s ease;
}
@keyframes float{
0%{opacity:0;transform:translate(-50%,20px)}
20%{opacity:1}
100%{opacity:0;transform:translate(-50%,-70px)}
}
</style>
</head>

<body>

<div class="scan"></div>

<div class="hero">

<div class="profile">

<div class="avatar" id="avatar">A</div>

<div>
<div class="name" id="username">Aspirant</div>
<div class="id" id="officerId">Officer ID: F27-0001</div>
<div class="clock" id="clock">00:00</div>
</div>

</div>

<div class="ring">

<svg width="170" height="170">

<circle cx="85" cy="85" r="68" stroke="#16345f" stroke-width="10" fill="none"/>

<circle id="ring"
cx="85"
cy="85"
r="68"
stroke="#36d1ff"
stroke-width="10"
fill="none"
stroke-linecap="round"
stroke-dasharray="427"
stroke-dashoffset="427"
class="glow"/>

</svg>

<div class="center">
<div id="xp">0 XP</div>
<div id="rank">Recruit</div>
</div>

</div>

</div>

<div class="grid">

<div class="card">
<div class="stat" id="streak">0</div>
<div class="label">🔥 Day Streak</div>
</div>

<div class="card">
<div class="stat" id="solved">0</div>
<div class="label">✅ Solved</div>
</div>

</div>

<div class="section">📊 Subject Progress</div>

<div class="subjects">

<div class="subject"><b>📘 GS1</b><span id="gs1">0</span></div>
<div class="subject"><b>📗 GS2</b><span id="gs2">0</span></div>
<div class="subject"><b>📙 GS3</b><span id="gs3">0</span></div>
<div class="subject"><b>📕 GS4</b><span id="gs4">0</span></div>

</div>

<div class="section">⚡ Quick Launch</div>

<button onclick="location.href='gs1.html'">📘 GS1</button>
<button onclick="location.href='gs2.html'">📗 GS2</button>
<button onclick="location.href='gs3.html'">📙 GS3</button>
<button onclick="location.href='gs4.html'">📕 GS4</button>

<div id="xpToast">+5 XP</div>

<script>
const tg=Telegram.WebApp;
tg.ready();
tg.expand();

const user=tg.initDataUnsafe?.user;

if(user){
document.getElementById("username").textContent=user.first_name;
document.getElementById("avatar").textContent=user.first_name[0];
if(user.photo_url){
document.getElementById("avatar").innerHTML='<img src="'+user.photo_url+'">';
}
}

if(!localStorage.officerId){
localStorage.officerId="F27-"+Math.floor(1000+Math.random()*9000);
}
officerId.textContent="Officer ID: "+localStorage.officerId;

function rank(x){
if(x>=1500)return"🏆 Officer";
if(x>=800)return"⚔ Warrior";
if(x>=300)return"🥈 Aspirant";
return"🟢 Recruit";
}

function load(){

const d=Progress.get();

xp.textContent=d.xp+" XP";
document.getElementById("rank").textContent=rank(d.xp);

streak.textContent=d.streak||0;
solved.textContent=d.solved||0;

gs1.textContent=d.gs1||0;
gs2.textContent=d.gs2||0;
gs3.textContent=d.gs3||0;
gs4.textContent=d.gs4||0;

const goal=1500;
const p=Math.min(d.xp/goal,1);
ring.style.strokeDashoffset=427-(427*p);

}

function clockTick(){
clock.textContent=new Date().toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});
}

setInterval(clockTick,1000);
clockTick();
load();

const prev=Number(localStorage.lastXp||0);
const now=Progress.get().xp;

if(now>prev){
xpToast.textContent="+"+(now-prev)+" XP";
xpToast.style.display="block";
setTimeout(()=>xpToast.style.display="none",1500);
}

localStorage.lastXp=now;
</script>

</body>
</html>
