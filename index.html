<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fateh27</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{
  margin:0;
  background:#07152d;
  color:white;
  font-family:Arial;
}
.header{
  padding:25px;
}
.name{
  color:#7dd3fc;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  padding:20px;
}
.card{
  background:#0f2348;
  border-radius:18px;
  padding:20px;
  text-align:center;
  font-size:18px;
}
</style>
</head>
<body>

<div class="header">
<h2>FATEH27</h2>
<p>Welcome, <span class="name" id="user">Aspirant</span></p>
</div>

<div class="grid">
<div class="card">📚 Current Affairs</div>
<div class="card">📝 PYQs</div>
<div class="card">⏱ Answer Writing</div>
<div class="card">🧠 Quiz</div>
<div class="card">📖 Notes</div>
<div class="card">📈 Progress</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

if(tg.initDataUnsafe?.user){
 document.getElementById("user").innerText=tg.initDataUnsafe.user.first_name;
}
</script>

</body>
</html>
