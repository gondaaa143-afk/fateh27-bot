<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Current Affairs</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#07152d;color:white;font-family:Arial;padding:20px}
.card{background:#0f2348;padding:18px;border-radius:16px;margin-top:15px}
h1{font-size:24px}
small{color:#7dd3fc}
</style>
</head>
<body>

<h1>📚 Current Affairs</h1>

<div class="card">
<h2 id="title">Loading...</h2>
<small id="date"></small>
<p id="summary"></p>
</div>

<script>
Telegram.WebApp.ready();
Telegram.WebApp.expand();

fetch("./data/current.md")
  .then(r => r.text())
  .then(md => {
    const lines = md.split("\n");
    document.getElementById("title").innerText =
      lines[0].replace("# ","");
    document.getElementById("date").innerText =
      lines[2].replace("Updated: ","");

    document.getElementById("summary").innerHTML =
      md.replace(lines[0],"").replace(lines[2],"")
        .replace(/\n/g,"<br>");
  })
  .catch(() => {
    document.getElementById("title").innerText = "Current Affairs";
    document.getElementById("summary").innerText = "Data load nahi hua.";
  });
</script>
</script>

</body>
</html>
