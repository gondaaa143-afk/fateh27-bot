<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Current Affairs</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#07152d;color:white;font-family:Arial;padding:20px}
.card{background:#0f2348;padding:18px;border-radius:16px;margin-top:15px}
h1{font-size:24px}
small{color:#7dd3fc}
</style>
</head>
<body>

<h1>📚 Current Affairs</h1>

<div class="card">
<h2 id="title">Loading...</h2>
<small id="date"></small>
<p id="summary"></p>
</div>

<script type="module">
import { db } from "./firebaseConfig.js";
import { collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

Telegram.WebApp.ready();
Telegram.WebApp.expand();

const snap = await getDocs(
  query(collection(db,"currentAffairs"), orderBy("createdAt","desc"), limit(1))
);

const d = snap.docs[0].data();

document.getElementById("title").innerText = d.title;
document.getElementById("date").innerText = d.date + " • " + d.source;
document.getElementById("summary").innerText = d.summary;
</script>

</body>
</html>
