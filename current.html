<!DOCTYPE html>
<html lang="hi">
<head>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/access-gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FATEH27 Current Affairs</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#07152d;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}
h1{
  font-size:30px;
  margin-bottom:18px;
}
.card{
  background:#0f2348;
  border-radius:18px;
  padding:18px;
  margin-top:15px;
}
h2{
  font-size:22px;
  margin-bottom:8px;
}
small{
  color:#9fb3d9;
}
pre{
  white-space:pre-wrap;
  word-wrap:break-word;
  font-family:inherit;
  font-size:16px;
  line-height:1.7;
  margin-top:14px;
}
</style>
<link rel="stylesheet" href="/fateh27-ui.css?v=20261004">
<script src="/fateh27-theme.js?v=20261007" defer></script>
</head>

<body>

<h1>📚 Current Affairs</h1>

<div class="card">
  <h2 id="title">Loading...</h2>
  <small id="date"></small>
  <pre id="summary"></pre>
</div>
<div class="card">
  <h2>The Hindu · Uploaded PDFs</h2>
  <small>PDFs shared by the FATEH27 owner through the Telegram bot</small>
  <div id="hinduPdfs" style="margin-top:14px;line-height:1.8">Loading uploads...</div>
</div>

<script>
Telegram.WebApp.ready();
Telegram.WebApp.expand();

async function loadCurrent(){
  try{
    const res = await fetch("/data/current.md?" + Date.now());
    if(!res.ok) throw new Error("Server");

    const text=await res.text();

    document.getElementById("title").innerText="Daily Current Affairs";
    document.getElementById("date").innerText="Auto Updated from GitHub Actions";
    document.getElementById("summary").innerText=text;

  }catch(e){
    document.getElementById("title").innerText="Server se connect nahi hua";
    document.getElementById("summary").innerText="";
  }
}

loadCurrent();
async function loadHinduPdfs(){
 const root=document.getElementById("hinduPdfs");
 try{
  const res=await fetch("/api/study-materials?category=current-affairs");
  const data=await res.json();
  if(!res.ok)throw new Error("Library unavailable");
  const items=data.items||[];
  if(!items.length){root.textContent="No The Hindu/editorial PDFs uploaded yet.";return;}
  root.innerHTML="";
  items.forEach(function(item){
   const row=document.createElement("div");
   row.style.cssText="padding:10px 0;border-bottom:1px solid #284064";
   const title=document.createElement("div");title.style.fontWeight="700";title.textContent=item.title||item.fileName;
   const meta=document.createElement("small");meta.textContent=item.uploadedAt?new Date(item.uploadedAt).toLocaleDateString():"Bot upload";
   const link=document.createElement("a");link.href="/api/study-materials/file/"+encodeURIComponent(item.id);link.target="_blank";link.rel="noopener";link.textContent="Open PDF ↗";link.style.cssText="display:inline-block;margin-top:6px;color:#9fb3d9";
   row.appendChild(title);row.appendChild(meta);row.appendChild(document.createElement("br"));row.appendChild(link);root.appendChild(row);
  });
 }catch(e){root.textContent="Could not load uploaded PDFs right now.";}
}
loadHinduPdfs();
</script>

</body>
</html>
