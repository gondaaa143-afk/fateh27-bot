<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Current Affairs</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#07152d;color:white;font-family:Arial;padding:20px}
.card{background:#0f2348;padding:18px;border-radius:16px;margin-top:15px}
h1{font-size:24px}
small{color:#7dd3fc}
</style>
</head>
<body>

<h1>📚 Current Affairs</h1>

<div class="card">
<h2 id="title">Loading...</h2>
<small id="date"></small>
<p id="summary"></p>
</div>


<script>
async function loadCurrent() {
  try {
    const res = await fetch("https://fateh27-bot.onrender.com/current");
    const d = await res.json();

    document.getElementById("title").innerText = d.title;
    document.getElementById("date").innerText = d.date + " • " + d.source;
    document.getElementById("summary").innerText = d.summary;
  } catch (e) {
    document.getElementById("title").innerText = "Server se connect nahi hua";
  }
}

loadCurrent();
</script>
</script>

</body>
</html>
