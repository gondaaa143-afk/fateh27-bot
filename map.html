<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FATEH27 Command Map</title>

<style>

body{
margin:0;
padding:18px;
background:#02140b;
color:white;
font-family:Arial,sans-serif;
}

h1{
font-size:42px;
margin:0 0 14px;
}

.search{
width:100%;
padding:14px;
border-radius:18px;
border:1px solid #14553a;
background:#072317;
color:white;
margin-bottom:14px;
box-sizing:border-box;
}

.filters{
display:flex;
gap:8px;
overflow:auto;
margin-bottom:16px;
}

.chip{
padding:10px 16px;
border-radius:999px;
background:#0b2c1d;
border:1px solid #14553a;
white-space:nowrap;
cursor:pointer;
}

.chip.active{
background:#2be07a;
color:black;
}

#mapWrap{
position:relative;
max-width:650px;
margin:auto;
border-radius:26px;
overflow:hidden;
border:1px solid #14553a;
box-shadow:0 0 30px rgba(43,224,122,.12);
}

#mapWrap img{
width:100%;
display:block;
}

.hotspot{
position:absolute;
width:18px;
height:18px;
border-radius:50%;
background:#2be07a;
border:2px solid white;
transform:translate(-50%,-50%);
cursor:pointer;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(43,224,122,.7)}
70%{box-shadow:0 0 0 12px rgba(43,224,122,0)}
100%{box-shadow:0 0 0 0 rgba(43,224,122,0)}
}

.sheet{
position:fixed;
left:0;
right:0;
bottom:-100%;
background:#062114;
border-top-left-radius:26px;
border-top-right-radius:26px;
padding:22px;
transition:.35s;
max-height:82vh;
overflow:auto;
z-index:999;
border-top:1px solid #14553a;
}

.sheet.open{
bottom:0;
}

.handle{
width:60px;
height:6px;
background:#2be07a;
border-radius:99px;
margin:0 auto 18px;
}

.close{
float:right;
font-size:26px;
cursor:pointer;
}

.badge{
display:inline-block;
padding:8px 14px;
background:#103a24;
border-radius:999px;
margin:8px 6px 0 0;
}

.card{
background:#082518;
border:1px solid #14553a;
padding:16px;
border-radius:18px;
margin-top:16px;
}

.back{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:#2be07a;
font-weight:bold;
margin-top:22px;
}

</style>
</head>
<body>

</div>

<button class="back" onclick="location.href='index.html'">← Back to War Room</button>

<div id="sheet" class="sheet">
<div class="handle"></div>
<div class="close" onclick="closeSheet()">✕</div>
<div id="sheetContent"></div>
</div>

<script>
let states = {};
let layers = {};
let currentLayer = "GS1";

// ---------- Load Data ----------
async function loadData() {
  try {
    const [statesRes, layersRes] = await Promise.all([
      fetch("./data/states.json?v=" + Date.now()),
      fetch("./data/layers.json?v=" + Date.now())
    ]);

    states = await statesRes.json();
    layers = await layersRes.json();
  } catch (e) {
    console.error(e);
  }
}

// ---------- Bottom Sheet ----------
function closeSheet() {
  document.getElementById("sheet").classList.remove("open");
}

// ---------- GS Filter ----------
function setFilter(layer, el) {
  currentLayer = layer;

  document.querySelectorAll(".chip")
    .forEach(x => x.classList.remove("active"));

  el.classList.add("active");

  renderLayer();
}

// ---------- Render Layer ----------
function renderLayer() {

  const data = layers[currentLayer];

  if (!data) return;

  let html = `<h2>${currentLayer} Intelligence Layer</h2>`;

  Object.keys(data).forEach(cat => {

    html += `
      <div class="card">
        <h3>${cat}</h3>
        <ul>
          ${data[cat].map(x =>
            `<li onclick="showState('${x.state}')"><b>${x.name}</b> — ${x.state}</li>`
          ).join("")}
        </ul>
      </div>
    `;

  });

  document.getElementById("sheetContent").innerHTML = html;
  document.getElementById("sheet").classList.add("open");
}

// ---------- State Dashboard ----------
function showState(name) {

  const s = states[name];

  if (!s) {

    document.getElementById("sheetContent").innerHTML = `
      <h2>${name}</h2>
      <p>Data unavailable.</p>
    `;

    document.getElementById("sheet").classList.add("open");
    return;
  }

  document.getElementById("sheetContent").innerHTML = `
    <h2>${name}</h2>

    <div class="badge">🏛 Capital: ${s.capital}</div>

    <div class="card">
      <h3>🔥 Hot Topics</h3>
      <p>${s.topics.join(" • ")}</p>
    </div>

    <div class="card">
      <h3>📘 Related PYQ</h3>
      <p>${s.pyq}</p>
    </div>

    <div class="card">
      <h3>📰 Current Focus</h3>
      <p>${s.current}</p>
    </div>

    <div class="card">
      <h3>⚡ Quick Revision</h3>
      ${s.topics.map(t => `<span class="badge">${t}</span>`).join("")}
    </div>
  `;

  document.getElementById("sheet").classList.add("open");
}

// ---------- Search ----------
document.addEventListener("DOMContentLoaded", async () => {

  await loadData();

  const search = document.getElementById("search");

  search.addEventListener("input", () => {

    const q = search.value.toLowerCase();

    const found = Object.keys(states)
      .find(x => x.toLowerCase().includes(q));

    if (found) showState(found);

  });

});
</script>

<script src="./map-pro.js"></script>

<button id="officerBtn" type="button" onclick="officerCommand()" style="position:fixed;right:20px;bottom:20px;width:72px;height:72px;border:none;border-radius:50%;background:#2be07a;color:#fff;font-size:30px;box-shadow:0 0 25px rgba(43,224,122,.7);z-index:999999;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;">
