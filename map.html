<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FATEH27 Command Map</title>

<style>

body{
margin:0;
background:#001b12;
color:white;
font-family:Arial,sans-serif;
padding:18px;
}

h1{
font-size:38px;
margin-bottom:18px;
}

input{
width:100%;
padding:15px;
border-radius:20px;
border:1px solid #12462d;
background:#032418;
color:white;
font-size:16px;
box-sizing:border-box;
}

.filters{
display:flex;
gap:10px;
margin:18px 0;
}

.filters button{
padding:12px 18px;
border:none;
border-radius:999px;
background:#062d1d;
color:white;
}

#mapWrap{
position:relative;
width:100%;
max-width:420px;
margin:auto;
border-radius:22px;
overflow:hidden;
border:1px solid #0d4d30;
z-index:1;
}

#mapWrap img{
width:100%;
display:block;
}

.hotspot{
position:absolute;
width:18px;
height:18px;
border-radius:50%;
background:#2be07a;
border:3px solid white;
box-shadow:0 0 18px rgba(43,224,122,.6);
transform:translate(-50%,-50%);
cursor:pointer;
z-index:5;
}

.card{
background:#062d1d;
border:1px solid #12462d;
border-radius:20px;
padding:18px;
margin-top:18px;
}

.badge{
display:inline-block;
padding:6px 12px;
border-radius:999px;
background:#103925;
margin:3px;
font-size:13px;
}

.back{
width:100%;
padding:16px;
margin-top:18px;
border:none;
border-radius:18px;
background:#2be07a;
font-weight:bold;
font-size:17px;
}

/* ===== Floating Officer Button ===== */

#officerBtn{
position:fixed;
right:18px;
bottom:22px;
width:72px;
height:72px;
border:none;
border-radius:50%;
background:linear-gradient(135deg,#2be07a,#00c853);
color:white;
font-size:30px;
box-shadow:0 8px 28px rgba(43,224,122,.55);
z-index:999999;
cursor:pointer;
pointer-events:auto;
touch-action:manipulation;
-webkit-tap-highlight-color:transparent;
}

#officerBtn:active{
transform:scale(.94);
}

</style>

</head>

<body>

<h1>🗺 COMMAND MAP</h1>

<input id="search" placeholder="Search State...">

<div class="filters">
<button>All</button>
<button>GS1</button>
<button>GS2</button>
<button>GS3</button>
</div>

<div id="mapWrap">

<img src="./India-map-en.png?v=3" alt="India Map">

<!-- Demo hotspots (baaki existing hotspots rehne do) -->

<div class="hotspot" style="left:66%;top:29%" onclick="showState('Assam')"></div>

<div class="hotspot" style="left:54%;top:34%" onclick="showState('Uttar Pradesh')"></div>

<div class="hotspot" style="left:24%;top:38%" onclick="showState('Rajasthan')"></div>

<div class="hotspot" style="left:18%;top:50%" onclick="showState('Gujarat')"></div>

<div class="hotspot" style="left:44%;top:82%" onclick="showState('Tamil Nadu')"></div>

<div class="hotspot" style="left:39%;top:43%" onclick="showState('Madhya Pradesh')"></div>

<div class="hotspot" style="left:46%;top:15%" onclick="showState('Uttarakhand')"></div>

</div>

<div id="info" class="card">

Tap any state.

</div>

<button class="back" onclick="location.href='index.html'">

← Back to War Room

</button>

<!-- Floating Voice Button -->

<button id="officerBtn" onclick="officerCommand()">

🎙️

</button>

<script src="./map-pro.js"></script>

<script src="./voice.js"></script>

</body>
</html>
