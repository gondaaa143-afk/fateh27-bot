<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FATEH27 Command Map</title>

<style>
body{
background:#02140b;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:20px;
}
h1{
font-size:42px;
margin-bottom:20px;
}
#mapWrap{
background:#072317;
border:1px solid #12462d;
border-radius:20px;
padding:12px;
margin-bottom:22px;
}
#mapWrap img{
width:100%;
max-width:420px;
display:block;
margin:auto;
border-radius:18px;
}
.card{
background:#072317;
border:1px solid #12462d;
border-radius:20px;
padding:18px;
margin-top:18px;
}
.badge{
display:inline-block;
background:#11321f;
padding:6px 12px;
border-radius:999px;
margin-bottom:10px;
}
button{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:#2be07a;
font-weight:bold;
margin-top:22px;
}
</style>
</head>

<body>

<h1>🗺 COMMAND MAP</h1>

<div id="mapWrap">
<img src="./India-map-en.png?v=1"
alt="India Political Map">
</div>

<div id="info" class="card">
Tap any highlighted state.
</div>

<script>
const data={

"Uttar Pradesh":{
gs:"GS1+GS2",
topics:["Ganga","Sugar Industry","Prayagraj"],
pyq:"River interlinking and federalism.",
current:"River conservation projects."
},

"Assam":{
gs:"GS1+GS3",
topics:["Kaziranga","Bodo Accord","Floods"],
pyq:"Northeast insurgency.",
current:"Flood management."
},

"Tamil Nadu":{
gs:"GS1+GS2",
topics:["Kaveri","Ports","Dravidian Movement"],
pyq:"Inter-state river disputes.",
current:"Blue Economy."
},

"Rajasthan":{
gs:"GS1+GS3",
topics:["Thar Desert","Solar Energy","Indira Gandhi Canal"],
pyq:"Desertification.",
current:"Renewable energy."
}

};

document.getElementById("mapWrap").onclick=()=>{

document.getElementById("info").innerHTML=`
<h2>Demo State</h2>

<div class="badge">GS1+GS2</div>

<h3>🔥 Hot Topics</h3>
<ul>
<li>Ganga</li>
<li>Sugar Industry</li>
<li>Prayagraj</li>
</ul>

<h3>📜 Related PYQ</h3>
<p>River interlinking and federalism.</p>

<h3>📰 Current Focus</h3>
<p>River conservation projects.</p>
`;

};
</script>

<button onclick="location.href='index.html'">← Back to War Room</button>

</body>
</html>
