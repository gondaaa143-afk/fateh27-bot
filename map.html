<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FATEH27 Command Map</title>

<style>
body{
background:#02140b;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:20px;
}
h1{font-size:42px;margin-bottom:20px}
svg{width:100%;max-width:420px;display:block;margin:auto}
.state{
fill:#0b2c1d;
stroke:#2be07a;
stroke-width:2;
cursor:pointer;
transition:.2s;
}
.state:hover,.active{fill:#2be07a}
.card{
background:#072317;
border:1px solid #12462d;
border-radius:20px;
padding:18px;
margin-top:24px;
}
.badge{
display:inline-block;
background:#11321f;
padding:6px 12px;
border-radius:999px;
margin-bottom:10px;
}
text{pointer-events:none;font-size:9px;fill:white}
</style>
</head>
<body>

<h1>🗺 COMMAND MAP</h1>

<svg viewBox="0 0 300 420">
<div id="mapWrap">
  <img
    src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/32/India_states_and_union_territories_map.svg/800px-India_states_and_union_territories_map.svg.png"
    alt="India Political Map"
    style="width:100%;max-width:420px;display:block;margin:auto;border-radius:18px;border:1px solid #12462d;">
</div>

<script>

const data={

"Uttar Pradesh":{
gs:"GS1+GS2",
topics:["Ganga","Sugar Industry","Prayagraj"],
pyq:"River interlinking and federalism.",
current:"River conservation projects."
},

"Assam":{
gs:"GS1+GS3",
topics:["Kaziranga","Bodo Accord","Floods"],
pyq:"Northeast insurgency.",
current:"Flood management."
},

"Tamil Nadu":{
gs:"GS1+GS2",
topics:["Kaveri","Ports","Dravidian Movement"],
pyq:"Inter-state river disputes.",
current:"Blue Economy."
},

"Rajasthan":{
gs:"GS1+GS3",
topics:["Thar Desert","Solar Energy","Indira Gandhi Canal"],
pyq:"Desertification.",
current:"Renewable energy."
}

};

document.querySelectorAll(".state").forEach(s=>{

s.onclick=()=>{

document.querySelectorAll(".state").forEach(x=>x.classList.remove("active"));
s.classList.add("active");

const d=data[s.id];

document.getElementById("info").innerHTML=`
<h2>${s.id}</h2>
<div class="badge">${d.gs}</div>

<h3>🔥 Hot Topics</h3>
<ul>${d.topics.map(t=>`<li>${t}</li>`).join("")}</ul>

<h3>📜 Related PYQ</h3>
<p>${d.pyq}</p>

<h3>📰 Current Focus</h3>
<p>${d.current}</p>
`;

};

});

</script>

</body>
</html>
