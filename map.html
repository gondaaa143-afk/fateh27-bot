<html lang="en">
<head>
<meta charset="UTF-8">

<title>FATEH27 Command Map</title>

<style>
body{
background:#02140b;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:20px;
}
h1{font-size:42px;margin-bottom:20px}

max-width:420px;
margin:auto;
border-radius:20px;
overflow:hidden;
border:1px solid #12462d;
}

.hotspot{
position:absolute;
border-radius:50%;
width:18px;
height:18px;
background:#2be07acc;
border:2px solid white;
cursor:pointer;
transform:translate(-50%,-50%);
}
.hotspot:hover{background:#5dff9b}
.card{
background:#072317;
border:1px solid #12462d;
border-radius:20px;
padding:18px;

}
.badge{
display:inline-block;
padding:6px 12px;
background:#11321f;
border-radius:999px;
margin-bottom:10px;
}
.back{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:#2be07a;
font-weight:bold;
margin-top:20px;
}
</style>
</head>

<body>

<div id="info" class="card">
Tap any state.
</div>

<button class="back" onclick="location.href='index.html'">← Back to War Room</button>

<script>
let states = {};

async function loadStates() {
  try {
    const res = await fetch("./data/states.json?v=3");
    states = await res.json();
  } catch (e) {
    document.getElementById("info").innerHTML =
      "<h2>Data load failed</h2><p>states.json check karo.</p>";
  }
}

function showState(name) {
  const s = states[name];

  if (!s) {
    document.getElementById("info").innerHTML = `
      <h2>${name}</h2>
      <p>Is state ka data abhi add nahi hua.</p>`;
    return;
  }

  document.getElementById("info").innerHTML = `
    <h2>${name}</h2>

    <div class="badge">UPSC State Dashboard</div>

    <div class="card">
      <h3>🔥 Hot Topics</h3>
      <p>${s.topics.join(" • ")}</p>
    </div>

    <div class="card">
      <h3>📘 Related PYQ</h3>
      <p>${s.pyq}</p>
    </div>

    <div class="card">
      <h3>📰 Current Affairs</h3>
      <p>${s.current}</p>
    </div>
  `;
}

loadStates();
</script>
