on of the mall was given the green signal despite encroaching on areas earmarked for a green belt and a slip road in the Zonal Master Plan of the city. The permission to construct the mall was accorded by the previous Municipal Commissioner who is not only your senior and well known to you professionally, but also a good friend. Prima facie, the case appears to be of a widespread nexus between officials of the Municipal Corporation and the builders. Your colleagues are putting pressure on you to go slow in the enquiry. The builder, who is rich and influential, happens to be a close relative of a powerful minister in the state cabinet. The builder is persuading you to hush up the matter, promising you a fortune to do so. He also hinted that if this matter is not resolved at the earliest in his favour there is somebody in his office who is waiting to file a case against you under the POSH act. Discuss the ethical issues involved in the case. What are the options available to you in this situation? Explain your selected course of action.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"25","year":"2020","question":"The Chairman of Bharat Missiles Ltd (BML) was watching a program on TV wherein the Prime Minister was addressing the nation on the necessity of developing a self-reliant India. He subconsciously nodded in agreement and smiled to himself as he mentally reviewed BML’s journey in the past two decades. BML had admirably progressed from producing first-generation anti-tank guided missiles (ATGMs) to designing and producing state of the art ATGM weapon systems that would be the envy of any army. He sighed in reconciliation with his assumptions that the government would probably not alter the status quo of a ban on the export of military weaponry. To his surprise, the very next day he got a telephone call from the Director-General, Ministry of Defence, asking him to discuss the modalities of increasing BML production of ATGMs as there is a probability of exporting the same to a friendly country. The Director-General wanted the Chairman to discuss the details with his staff in Delhi next week. Two days later, at a press conference, the Defence Minister stated that he aims to double the current weapons export levels within five years. This would give an impetus to financing the development and manufacturing of indigenous weapons in the country. He also stated that all indigenous arms manufacturing nations have a very good record of the international arms trade. As the Chairman of BML, what are your views on the following points? 1) As an arms exporter of a responsible nation like India, what are the ethical issues involved in arms trade? 2) List five ethical factors that would influence the decision to sell arms to foreign governments.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"26","year":"2021","question":"Sunil is a young civil servant and has a reputation for his competence, integrity, dedication and relentless pursuit of difficult and onerous jobs. Considering his profile, he was picked up by his bosses to handle a very challenging and sensitive assignment. He was posted in a tribal-dominated district notorious for illegal sand mining. Excavating sand from river belt and transporting it through trucks and selling them in black market was rampant. This illegal sand mining mafia was operating with the support of local functionaries and tribal musclemen who in turn were bribing selected poor tribals and had kept the tribals under fear and intimidation. Sunil being a sharp and energetic officer immediately grasped the ground realities and the modus operandi followed by the mafia through their devious and dubious mechanism. On making inquiries, he gathered that some of their own office employees are in hand and glove with them and have developed close unholy nexus. Sunil initiated stringent action against them and started conducting raids on their illegal operations of movement of trucks filled with sand. The mafia got rattled as not many officers in the past had taken such steps against the mafia. Some of the office employees who were allegedly close to mafia informed them that the officer is determined to clean up the mafia’s illegal sand mining operations in that district and may cause them irreparable damage. The mafia turned hostile and launched a counter-offensive. The tribal musclemen and mafia started threatening him with dire consequences. His family (wife and old mother) were stalked and were under virtual surveillance and thus causing mental torture, agony and stress to all of them. The matter assumed serious proportions when a muscleman came to his office and threatened him to stop raids, etc., otherwise, his fate will not be different than some of his predecessors (ten years back one officer was killed by the mafia). 1) Identify the different options available to Sunil in attending to this situation. 2) Critically evaluate each of the options listed by you. 3) Which of the above, do you think, would be the most appropriate for Sunil to adopt and why?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"27","year":"2021","question":"Pawan is working as an officer in the State Government for the last ten years. As a part of routine transfer, he was posted to another department. He joined in a new office along with five other colleagues. The head of the office was a senior officer conversant with the functioning of the office. As a part of general inquiry, Pawan gathered that his senior officer carries the reputation of being difficult and insensitive person having his own disturbed family life. Initially, all seem to go well. However, after some time Pawan felt that the senior officer was belittling him and at times unreasonable. Whatever suggestions given or views expressed by Pawan in the meetings were summarily rejected and the senior officer would express displeasure in the presence of others. It became a pattern of boss’s style of functioning to show him in bad light highlighting his shortcomings and humiliating him publically. It became apparent that though there are no serious work-related problems/shortcomings, the senior officer was always on one pretext or the other and would scold and shout at him. The continuous harassment and public criticism of Pawan resulted in loss of confidence, self-esteem and equanimity. Pawan realized that his relations with his senior officer are becoming more toxic and due to this, he felt perpetually tensed, anxious and stressed. His mind was occupied with negativity and caused him mental torture, anguish and agony. Eventually, it badly affected his personal and family life. He was no longer joyous, happy and contented even t home. Rather without any reason he would loose his temper with his wife and other family members. The family environment was no longer pleasant and congenial. His wife who was always supportive to him also became a victim of his negativity and hostile behaviour. Due to harassment and humiliation suffering by him in the office, comfort and happiness virtually vanished from his life. Thus it damaged his physical and mental health. 1) What are the options available with Pawan to cope with the situation? 2) What approach Pawan should adopt for bringing peace, tranquillity and a congenial environment in the office and home? 3) As an outsider, what are your Suggestions for both boss and subordinate to overcome this situation and for improving the work performance, mental and emotional hygiene? 4) In the above scenario, what type of training would you suggest for at various levels in the government offices?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"28","year":"2022","question":"Ramesh is State Civil Services Officer who got the opportunity of getting posted to the capital of a border State after rendering 20 years of service. Ramesh’s mother has recently been detected cancer and has been admitted in the leading cancer hospital of the city. His two adolescent children have also got admission in one of the best public schools of the town. After settling down in his appointment as Director in the Home Department of the State, Ramesh got confidential report through intelligence sources that illegal migrants are infiltrating in the State from the neighbouring country. He decided to personally carry out surprise check of the border posts along with his Home Department team. To his surprise, he caught red-handed two families of 12 members infiltrated with the connivance of the security personnel at the border posts. On further inquiry and investigation, it was found that after the migrants from neighbouring country infiltrate, their documentation like Aadhaar Card, Ration Card and Voter Card are also forged and they are made to settle down in a particular area of the State. Ramesh prepared the detailed and comprehensive report and submitted to the Additional Secretary of the State. However, he has summoned by the Additional Home Secretary after a week and was instructed to withdraw the report. The Additional Home Secretary informed Ramesh that the report submitted by him has not been appreciated by the higher authorities. He further cautioned him that if he fails to withdraw the confidential ort, he will not only be posted out from the prestigious appointment from the State capital but his further promotion which is due in near future will also get in jeopardy. 1) What are the options available to Ramesh as the Director of the Home Department of the bordering State? 2) What option should Ramesh adopt and why? 3) Critically evaluate each of the options. 4) What are the ethical dilemmas being faced by Ramesh? 5) What policy measures would you suggest to combat the menace of infiltration of illegal migrants from the neighboring country?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"29","year":"2022","question":"Rakesh was working as a Joint Commissioner in Transport department of a city. As a part of his job profile, among others, he was entrusted with the task of overseeing the control and functioning of City Transport Department. A case strike by drivers’ union of City Transport Department over the issue of compensation to a driver who died on duty while driving the bus came up before him for decision in the matter. He gathered that the driver (deceased) was plying Bus No. 528 which passed through busy and congested roads of the city. It so happened that near an intersection on the way, there was an accident involving the a middle-aged man. It was found that there was altercation between the driver and the car driver. Heated arguments between them led to fight and the driver gave him a a blow. Lot of passerbys had gathered and tried to intervene but without success. Eventually, both of them were badly injured and profusely bleeding and were taken to the nearby hospital. The driver succumbed to the injuries and could not be saved. The middle-aged driver’s condition was also critical but after a day, he recovered and was discharged. Police had immediately come to the spot and FIR was registered. Police investigation revealed that the quarrel in was started by the bus driver and he had resorted to physical violence. There exchange of blows between them. The City Transport Department management is considering of not giving any extra compensation to the driver’s (deceased) family. The family is very aggrieved. depressed and agitated against the discriminatory and non- sympathetic approach of the City Transport Department management. The bus driver (deceased) was 52 years of age, was survived by his wife and two school-college going daughters. He was the sole earner of the family. The City Transport Department workers’ union took up this case and when found no favourable response from the management, decided to go on strike. The union’s demand was two fold. First was full extra compensation as given to other drivers who died on duty and secondly employment to one family member. The strike has continued for 10 days and the deadlock remains. 1) What are the options available to Rakesh to meet the above situation? 2) Critically examine each of the options identified by Rakesh 3) What are the ethical dilemmas being faced by Rakesh? 4) What course of action would Rakesh adopt to diffuse the above situation?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"30","year":"2022","question":"You are appointed as an officer heading the section in Environment Pollution Control Board to ensure compliance and its follow-up. In that region, there were large number of small and medium industries which had been granted clearance. You learnt that these industries provide employment to many migrant worker. Most of the industrial units have got environmental clearance certificate in their possession. The environmental clearance seeks to curb industries and projects that supposedly hamper environment and living species in the region, But in practice. most of these units remain to be polluting units in several ways like air, water and soil pollution. As such, local people encountered persistent health problems. It was confirmed that majority of the industries were violating environmental compliance. You issued notice to all the industrial units to apply for fresh environmental clearance certificate from the competent authority. However, your action met with hostile response from a section of the industrial units, other vested interest persons and a section of the local politicians. The workers also became hostile to you as they felt that your action would lead to the closure of these industrial units, and the resultant unemployment will lead to insecurity uncertainty in their livelihood. Many owners of the industries approached you with the plea that you should not initiate harsh action as it would compel them their units, and cause huge financial loss, shortage of their products in the market. These would obviously add to the sufferings of the labourers and the consumers alike. The labour union also sent you representation requesting against the closure of the units. You simultaneously started receiving threats from unknown corners. You however received supports from some of your colleagues, who advised you to act freely to ensure environmental compliance. Local NGOs also came to your support and they demanded the closure of the polluting units immediately. 1) What are the options available to you under the given situation? 2) Critically examine the options listed by you. 3) What type of mechanism would you suggest to ensure environmental compliance? 4) What are the ethical dilemmas you faced in exercising your option?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"31","year":"2023","question":"At 9 pm on Saturday evening, Rashika, a Joint Secretary, was still engrossed in her work in her office. Her husband, Vikram, is an executive in an MNC and frequently out of town in connection with his work. Their two children aged 5 and 3 are looked after by their domestic helper. At 9:30 pm her superior, Mr. Suresh calls her and asks her to prepare a detailed note on an important matter to be discussed in a meeting in the Ministry. She realises that she will have to work on Sunday to finish the additional task given by her superior. She reflects on how she had asked forward to the posting and had worked long hours for months to achieve it, he had kept the welfare of people uppermost in discharging her duties. She feels that she has not done enough Justice to her family and she has not fulfilled her duties in discharging ential social obligations. Even as recently as last month she had to leave her sick child in the nanny’s care as she had to work in the office. No, she feels that she must draw a line, beyond which her personal life should take precedence over her professional responsibilities. She thinks that there should be reasonable limits to the work ethics such as punctuality, hard work, dedication to duty and selfless service. (a) Discuss the ethical issue involved in this case. (b) Briefly describe at least four laws that have been enacted by the Government with respect to providing a healthy, safe and equitable working environment for women. (c) Imagine you are in a similar situation. What suggestions would you make to mitigate such working conditions?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"32","year":"2023","question":"Vinod is an honest and sincere IAS officer. Recently, he has taken over as Managing Director of the State Road Transport Corporation, his sixth transfer in the past three years. His peers acknowledge his vast knowledge affability and uprightness. The Chairman of the State Road Transport Corporation is a powerful politician and is very close to the Chief Minister. Vinod comes to know about many alleged irregularities of the Corporation and the high-handedness of the Chairman in financial matters. A Board Member of the Corporation belonging to the Opposition Party meets Vinod and hands over a few documents along with a video recording in which the Chairman appears to be demanding bribe for placing a huge order for the supply of QMR tyres. Vinod recollects the Chairman expediting the clearing of pending bills of QMR tyres. Vinod confronts the Board Member as to why he is shying away from exposing the Chairman with the so-called solid proof he has with him. The members inform him that the Chairman refuses to yield to his threats. He adds that Vinod may earn recognition and public support if he himself exposes the Chairman. Further, he tells Vined that once his party comes to power, Vinod’s professional growth would be assured. Vinod is aware that he may be penalised if he exposes the Chairman and may further be transferred to a distant place. He knows that Opposition Party stands a better chance of coming to power in the forthcoming elections. However, he also realises that the Board Member is trying to use him for his own political gains. (a): As a conscientious civil servant, evaluate the options available to Vinod. (b): In the light of the above case, comment upon the ethical issues that may arise due to the politicization of bureaucracy.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"33","year":"2023","question":"You have just been appointed as Additional Director General of Central Public Works Department. The Chief Architect of your division, who is to retire in six months, in passionately working on a very important project, the successful completion of which would earn him a lasting reputation for the rest of his life. A new lady architect. Seema, trained at Manchester School of Architecture, UK joined as Senior Architect in your division. During the briefing about the project, Seema made some suggestions which would not only add value to the project, but would also reduce completion time. This has made the Chief Architect insecure and he is constantly worried that all the credit will go to her. Subsequently, he adopted a passive and aggressive behaviour towards her and has become disrespectful to her. Seems felt it embarrassing as the Chief Architect left no chance of humiliating her. He would very often correct her in front of other colleagues and raise his voice while speaking to her. This continuous harassment has resulted in her losing confidence and self-esteem. She felt perpetually tensed, anxious and stressed. She appeared to be in awe of him since he has had a long tenure in the office and has vast experience in the area of her work. You are aware of her outstanding academic credentials and careeer in her previous organizations. However, you fear that this harassment may result in compromising her much needed contribution in this important project and may adversely impact her emotional well-being. You have also come to know from her peers that she is contemplating tendering her resignation. (a) What are the ethical issues involved in the above case? (b) What are the option available to you in order to complete the project a wall as to retain Seema in the organization? (c) What would be your response to Seema’s predicament? What measures would you institute to prevent each occurrence from happening in your organization?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"1","year":"2013","question":"You are heading a leading technical institute of the country. The institute is planning to convene an interview panel shortly under your chairmanship for selection of the post of professors. A few days before the interview, you get a call from the Personal Secretary (PS) of a senior government functionary seeking your intervention in favour of the selection of a close relative of the functionary for this post. The PS also informs you that he is aware of the long pending and urgent proposals of your institute for grant of funds for modernization, which are awaiting the functionary’s approval. He assures you that he would get these proposals cleared. 1) What are the options available to you? 2) Evaluate each of these options and choose the option which you would adopt, giving reasons.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"2","year":"2013","question":"You are the Executive Director of an upcoming InfoTech Company which is making a name for itself in the market. Mr. A, who is a star performer, is heading the marketing team. In a short period of one year, he has helped in doubling the revenues as well as creating a high brand equity for the Company so much so that you are thinking of promoting him. However, you have been receiving information from many corners about his attitude towards the female colleagues; particularly his habit of making loose comments on women. In addition, he regularly sends indecent SMS’s to all the team members including his female colleagues. One day, late in the evening, Mrs. X, who is one of Mr. A’s team members, comes to you visibly disturbed. She complains against the continued misconduct of Mr. A, who has been making undesirable advances towards her and has even tried to touch her inappropriately in his cabin. She tenders her resignation and leaves your office. 1) What are the options available to you? 2) Evaluate each of these options and choose the option you would adopt, giving reasons.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"3","year":"2014","question":"Suppose you are the CEO of a company that manufactures specialized electronic equipment used by a government department. You have submitted your bid for the supply of this equipment to the department. Both the quality and cost of your offer are better than those of the competitors. Yet the concerned officer is demanding a hefty bribe for approving the tender. Getting the order is important both for you and for your company. Not getting the order would mean closing a production line. It may also affect your own career. However, as a value-conscious person, you do not want to give bribe. Valid arguments can be advanced both for giving the bribe and getting the order, and for refusing to pay the bribe and risking the loss of the order. What those arguments could be? Could there be any better way to get out of this dilemma? If so outline the main elements of this third way, pointing out its merits.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"4","year":"2015","question":"A private company is known for its efficiency, transparency and employee welfare. The company though owned by a private individual has a cooperative character where employees feel a sense of ownership. The company employs nearly 700 personnel and they have voluntarily decided not to form a union. One day suddenly in the morning, about 40 men belonging to a political party gatecrashed into the factory demanding jobs in the factory. They threatened the management and employees, and also used foul language. The employees feel demoralized. It was clear that those people who gate-crashed wanted to be on the payroll of the company as well as continue as the volunteers/members of the party. The company maintains high standards in integrity and does not extend favours to civil administration that also includes law enforcement agency. Such incidents occur in public sector also. Assume you are the CEO of the company. What would you do to diffuse the volatile situation on the date of gate- crashing with the violent mob sitting inside the company premises? What could be the long-term solution to the issue discussed in the case? Every solution/action that you suggest will have a positive and a negative impact on you (as CEO), the employees and the performance of the employees. Analyze the consequences of each of your suggested actions.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"5","year":"2015","question":"One of the scientists working in the R & D laboratory of a major pharmaceutical company discovers that one of the company’s best selling veterinary drugs, B has the potential to cure a currently incurable liver disease that is prevalent in tribal areas. However, developing a variant of the drug suitable for human beings entailed a lot of research and development having a huge expenditure to the extent of 50 crores rupees. It was unlikely that the company would recover the costs as the disease was rampant only in poverty-stricken area having very little market otherwise. If you were the CEO, then— (a) Identify the various actions that you could take; (b) Evaluate the pros and cons of each of your actions.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"6","year":"2016","question":"A fresh  engineering graduate gets a job in a prestigious chemical industry. She likes the work. The salary is also good. However, after a few months accidentally discovers that a highly toxic waste is being secretly discharged into a river nearby. This is causing health problems to the villagers downstream who depend on the river for their water needs. She is perturbed and mentions her concern to her colleagues who have been with the company for longer periods. They advise her to keep quite as anyone who mentions the topic is summarily dismissed. She cannot risk losing her job as she is the sole bread-winner for her family and has to support her ailing parents and siblings. At first, she thinks that if her seniors are keeping quiet, why should she stick out her neck. But her conscience pricks her to do something to save the river and the people who depend upon it. At heart she feels that the advice of silence given by her friends is not correct though she cannot give reasons for it. She thinks you are a wise person and seeks your advice. 1) What arguments can you advance to show her that keeping quiet is not morally right? 2) What course of action would you advise her to adopt and why?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"7","year":"2016","question":"ABC Ltd. is a large transnational company having diversified business activities with a huge shareholder base. The company is continuously expanding and generating employment. The company, in its expansion and diversification programme, decides to establish a new plant at Vikaspuri, an area which is underdeveloped. The new plant is designed to use energy efficient technology that will help the company to save production cost by 20%. The company’s decision goes well with the Government policy of attracting investment to develop such underdeveloped regions. The Government has also announced tax holiday for five years for the companies that invest in underdeveloped areas. However, the new plant may bring chaos for the inhabitants of Vikaspuri region which is otherwise tranquil. The new plant may result in increased cost of living, aliens migrating to the region, disturbing the social and economic order. The company sensing the possible protest tried to educate the people of Vikaspuri region and public in general that how its Corporate Social Responsibility (CSR) policy would help overcome the likely difficulties of the residents of Vikaspuri region. In spite of this the protests begin and some of the residents decided to approach the judiciary as their plea before the Government did not yield any result. (a)  Identify the issues involved in the case. (b)  What can be suggested to satisfy Company’s goal and to address the resident’s concern.","topic":"Case Study","marks":"25","paper":"GS4","type":"Case Study"},{"qno":"8","year":"2017","question":"You are the head of the Human Resources department of an organisation. One day one of the workers died on duty. His family was demanding compensation. However, the company denied compensation because it was revealed in investigation that he was drunk at the time of the accident. The workers of the company went to strike demanding compensation for the family of the deceased. The Chairman of the management board has asked for your recommendation. What recommendation would you provide the management? Discuss the merits and demerits of each of the recommendations.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"9","year":"2017","question":"You are the manager of a spare parts company A and you have to negotiate a deal with the manager of a large manufacturing company B. The deal is highly competitive and sealing the deal is critical for your company. The deal is being worked out over a dinner. After dinner the manager of manufacturing company B offered to drop you to the hotel in his car. On the way to hotel he happens to hit motorcycle injuring the motorcyclist badly. You know the manager was driving fast and thus lost control. The law enforcement officer comes to investigate the issue and you are the sole eyewitness to it. Knowing the strict laws pertaining to road accidents you are aware that your honest account of the incident would lead to the prosecution of the manager and as a consequence the deal is likely to be jeopardised, which is of immense importance to your company. What are the dilemmas you face? What will be your response to the situation?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"10","year":"2019","question":"An apparel manufacturing company having a large number of women employees was losing sales due to various factors. The company hired a reputed marketing executive, who increased the volume of sales within a short span of time. However, some unconfirmed reports came up regarding his indulgence in sexual harassment at the workplace. After sometime a women employee launched a formal complaint to the management against the marketing executive about sexually harassing her. Faced with the companies’ indifference, in not taking cognizance of her grievances, she lodged an FIR with the police. Realizing the sensitivity and gravity of the situation, the company called the women employee to negotiate. In that she was offered a hefty sum of money to withdraw the complaint and the FIR and also give in writing that the marketing executive is not involved in the case. Identify the ethical issues involved in this case. What options are available to the women employee?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"11","year":"2020","question":"Parmal is a small but underdeveloped district. It has a rocky terrain that is not suitable for agriculture, though some subsistence agriculture is being done on small plots of land. The area receives adequate rainfall and has an irrigation canal flowing through it. Amria, its administrative centre, is a medium-sized town. It houses a large district hospital, an Industrial Training Institute and some privately owned skill training centres. It has all the facilities of a district headquarters. A trunk railway line passes approximately 50 kilometers from Amria. Its poor connectivity is a major reason for the absence of any major industry therein. The state government offers a 10 year tax holiday as an incentive to new industry. In 2010 Anil, an industrialist decided to take benefits to set up Amria Plastic Works (APW) in Noora village, about 20km from Amria. While the factory was being built, Anil hired the required key labour and got them trained at the skill training centres at Amria. This act of his made the key personnel very loyal to APW. APW started production in 2011 with the labour drawn fully from Noora village. The villagers were very happy to get employment near their homes and were motivated by the key personnel to meet the production targets with high quality. APW started making large profits, a sizeable portion of which was used to improve the quality of life in Noora. By 2016, Noora could boast of a greener village and a renovated village temple. Anil liaised with the local MLA to increase the frequency of the bus services to Amria. The government also opened a primary health care centre and primary school at Noora in buildings constructed by APW. APW used its CSR funds to set up women’s self-help groups, subsidize primary education to the village children and procure an ambulance for use by its employeed and the needy. In 2019, there was a minor fire in APW. It was quickly extinguished as fire safety protocols were in place in the factory. Investigations revealed that the factory had been using electricity in excess of its authorized capacity. This was soon rectified. The next year, due to nationwide lockdown, the requirement of production fell for four months. Anil decided that all employees would be paid regularly. He employed them to plant trees and improve the village habitat. APW had developed a reputation of high-quality production and a motivated workforce. Critically analyse the story of APW and state the ethical issues involved. Do you consider APW as a role model for the development of backward areas? Give reasons.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"12","year":"2021","question":"An elevated corridor is being constructed to reduce traffic congestion in the capital of a particular state. You have been selected as project manager of this prestigious project on your professional competence and experience. The deadline is to complete the project in next two years by 20 June, 2021, since this project is to be inaugurated by the Chief Minister before the elections are announced in the second week of July 2021. While carrying out the surprise inspection by the inspecting team, a minor crack was noticed in one of the piers of the elevated corridor possibly due to poor material used. You immediately informed the chief engineer and stopped further work. It was assessed by you that minimum three piers of the elevated corridor have to be demolished and reconstructed. But this process will delay the project minimum by four to six months. But the chief engineer overruled the observation of inspecting team on the ground that it was a minor crack that will not in any way impact the strength and durability of the bridge. He ordered you to overlook the observation of the inspecting team and continue working with same speed and tempo. He informed you that the minister does not want any delay as he wants the chief Minister to inaugurate the elevated corridor before the elections are declared. Also informed you that the contractor is far relative of the minister and he wants him to finish the project. He also gave you hint that your further promotion as additional chief engineer is under consideration with the ministry. However, you strongly felt that the minor crack in the pier of the elevated corridor will adversely affect the health and life of the bridge and therefore it will be very dangerous not to repair the elevated corridor. 1) Under the given conditions, what are the options available to you as a project manager? 2) What are the ethical dilemmas being faced by the project manager? 3) What are the professional challenges likely to be faced by the project manager and his response to overcome such challenges? 4) What can be the consequences of overlooking the observation raised by the inspecting team?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"13","year":"2021","question":"A Reputed food product company based in India developed a food product for international market and started exporting the same after getting necessary approvals. The company announced this achievement and also indicated that soon the product will be made available for the domestic consumers with almost sane quality and health benefits. Accordingly, the company got its product approved by the domestic competent authority and launched the product in Indian market. The company could increase its market share over a period of time and earned substantial profit both domestically and internationally. However, the random sample test conducted by inspecting team found the product being sold domestically in variance with the approval obtained from the competent authority. On further investigation, it was also discovered that the food company was not only selling products which were not meeting the health standard of the country but also selling the rejected export products in the domestic market. This episode adversely affected the reputation and profitability of the food company. 1) What action do you visualize should be taken by the competent authority against the food company for violating the laid down domestic food standard and selling rejected export products in domestic market? 2) What course of action is available with the food company to resolve the crisis and bring back its lost reputation? 3) Examine the ethical dilemma involved in the case.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"14","year":"2022","question":"Prabhat was working as Vice President (Marketing) at Sterling Electric Ltd., a reputed multinational company. But presently the company was passing through the difficult times as the sales were continuously showing downward trend in the last two quarters. His division, which hitherto had been a major revenue contributor to the company’s financial health, was now desperately trying to procure some big government order for them. But their best efforts did not yield any positive success or breakthrough. His was a professional company and his local bosses were under pressure from their London-based HO to show some positive results. In the last performance review meeting taken by the Executive Director (India Head), he was reprimanded for his poor performance. He assured them that his division is working on a special contract from the Ministry of Defence for a secret installation near Gwalior and tender is being submitted shortly. He was under extreme pressure and he was deeply perturbed. What aggravated the situation further was a warning from the top that if the deal is not clinched in favour of the company, his division might have to be closed and he may have to quit his lucrative job. There was another dimension which was causing him deep mental torture and agony. This pertained to his personal precarious financial health. He was a single earner in the family with two school-college going children and his old ailing mother. The heavy expenditure on education and medical was causing a big strain to his monthly pay packet. Regular EMI for housing loan taken from bank unavoidable and any default would render him liable for severe legal action. In the above backdrop, he was hoping for some miracle to happen. There was sudden turn of events. His Secretary informed that a gentleman Subhas Verma wanted to see him as he was interested in the position of Manager which was to be filled by him in the company. He further brought to his notice that his CV has been received through the office of the Minister of Defence. During interview of the candidate-Subhash Verma, he found him technically sound, resourceful and experienced marketeer. He seemed to be well- conversant with tendering procedures and having knack of follow-up and liaising in this regard Prabhat felt that he was better choice than the rest of the candidates who were recently interviewed by him in the last few days. Subhash Verma also indicated that he was in possession of the copies of the bid documents that the Unique Electronics Ltd. would be submitting the next day to the Defence Ministry for their tender. He offered to hand over those documents subject to his employment in the company on suitable terms and conditions. He made it clear that in the process, the Sterling Electric Ltd. could outbid their rival company and get the bid and hefty Defence Ministry order. He indicated that it will be win-win situation for both-him and the company. Prabhat was absolutely stunned. It was a mixed feeling of shock and thrill. He was uncomfortable and perspiring. If accepted, all his problems would vanish instantly and he may be rewarded for securing the much awaited tender and thereby boosting company’s sales and financial health. He was in a fix as to the future course of action. He was wonder-struck at the guts of Subhash Verma in having surreptitiously removing his own company papers and offering to the rival company for a job. Being an experienced person, he was examining the pros and cons of the proposal/situation and he asked him to come the next day. 1) Discuss the ethical issues involved in the case. 2) Critically examine the options available to Prabhat in the above situation. 3) Which of the above would be the most appropriate for Prabhat and why?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"15","year":"2022","question":"You have done MBA from a reputed institution three years back but could not get campus placement due to COVID- 19 generated recession. However, after a lot of persuasion and series of competitive tests including written and interview, you managed to get a job in a leading shoe company. You have ageur parents who are dependent and staying with you. You also recently got married after getting this decent job. You were allotted the Inspection Section which is responsible for clearing the final product. In first one year, you learnt your job well and was appreciated for your performance by the management. The company is doing good business for last five years in domestic market and this year it is decided even to export to Europe and Gulf countries. However, one large consignment to Europe was rejected by their Inspecting Team due to certain poor quality and was sent back. The top management ordered that ibid consignment to be cleared for the domestic market. As a part of Inspecting Team, you observed the glaring poor quality and brought to the knowledge of the Team Commander. However, the top management advised all the members of the team to overlook these defects as the management cannot bear such a huge loss. Rest of the team members except you promptly signed and cleared the consignment for domestic market, overlooking glaring defects. You again brought to the knowledge of the Team Commander that such consignment, if cleared even for domestic market, will tarnish the image and reputation of the company and will be counter- productive in the long run. However, you were further advised by the top management that if you do not clear the consignment, the company will not hesitate to terminate your services citing certain innocuous reasons. 1) Under the given conditions, what are the options available to you as a member of the Inspecting Team? 2) Critically evaluate each of the options listed by you. 3) What option would you adopt and why? 4) What are the ethical dilemmas being faced by you? 5) What can be the consequences of overlooking the observations raised by the Inspecting Team?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"16","year":"2023","question":"You are working as an executive in a nationalized bank for several years. One day one of your close colleagues tells you that her father is suffering from heart disease and needs surgery to service. She also tells you that she has no insurance and the operation will cost about Rs 10 lakh. You are also aware of the fact that her husband and that she is from a lower middle class family. You are empathetic about her situation. However, apart from expressing your sympathy, you do not have the resources to fund her. A few weeks later, you ask her about the well-being of her father and she informs you about his successful surgery and that he is recovering. She then confides in you that the bank manager was kind enough to facilitate the release of 10 lakhs from a dormant account of someone to pay for the operation with a promise that it should be confidential and be repaid at the earliest. She has already started paying it back and will continue to do so until it is all returned. (a) What are the ethical issues involved? (b) Evaluate the behavior of the bank manager from an ethical point of view. (c) How would you react to the situation?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"1","year":"2014","question":"Suppose one of your close friends, who is also aspiring for civil services, comes to you for discussing some of the issues related to ethical conduct in public service. He raises the following points : 1) In the present times, when unethical environment is quite prevalent, individual attempts to stick to ethical principles may cause a lot of problems in one’s career. It may also cause hardship to the family members as well as risk to one’s life. Why should we not be pragmatic and follow the path of least resistance, and be happy with doing whatever good we can? 2) When so many people are adopting wrong means and are grossly harming the system, what difference would it make if only a small minority tries to be ethical? They are going to be rather ineffective and are bound to get frustrated. 3) If we become fussy about ethical considerations, will it not hamper the economic progress of our country? After all, in the present age of high competition, we cannot afford to be left behind in the race of development. 3) It is understandable that we should not get involved in grossly unethical practices, but giving and accepting small gratifications and doing small favours increases everybody’s motivation. It also makes the system more efficient. What is wrong in adopting such practices? Critically analyze the above viewpoints. On the basis of this analysis, what will be your advice to your friend?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"3","year":"2017","question":"A building permitted for three floors, while being extended illegally to 6 floors by a builder, collapses. As a consequence, a number of innocent labourers including women and children died. These labourers are migrants of different places. The government immediately announced cash relief to the aggrieved families and arrested the builder. Give reasons for such incidents taking place across the country. Suggest measures to prevent their occurrence.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"4","year":"2019","question":"In recent times, there has been an increasing concern in India to develop effective civil service ethics, code of conduct, transparency measures, ethics and integrity systems and anti-corruption agencies. In view of this, there is a need being felt to focus on three specific areas, which are directly relevant to the problems of internalizing integrity and ethics in the civil services. These are as follows: 1) Anticipating specific threats to ethical standards and integrity in the civil services, 2) Strengthening the ethical competence of civil servant and 3) Developing administrative processes and practices which promote ethical values and integrity in civil services. Suggest institutional measures to address the above three issues.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"5","year":"2023","question":"A landslide occurred in the middle of the night on 20th July. 2023 in a remote mountain hamlet, approximately 60 kilometers from Uttarkashi. The landslide was caused by torrential rains and has resulted in large-scale destruction of property and life. You, as District Magistrate of that area, have rushed to the spot with a team of doctors, NGOs, media and police along with numerous support staff to oversee the rescue operations. A man came running to you with a request for urgent medical help for his pregnant wife who is in labour and in loosing blood. You directed your medal team to examine his wife. They return and convey to you that this woman needs blood transfusion immediately. Upon enquiry, you come to know that a few blood collection bags and blood group test kits are available in the ambulance accompanying your team. Few people of your team have already volunteered to donate blood. Being a physician who has graduated from AIIMS, you know that blood for transfusion needs to be procured only through a recognized blood bank. Your team members are divided on this issue; some favour transfusing, while some others oppose it. The doctors in the team are ready to facilitate the delivery provided they are not penalised for transfusion. Now you are in a dilemma. Your professional training emphasizes on prioritising service to humanity and saving lives of individuals. (a) What are the ethical issues involved in this case? (b) Evaluate the options available to you, being District Magistrate of the area.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"1","year":"2014","question":"Rameshwar successfully cleared the prestigious civil services examination and was excited about the opportunity that he would get through the civil services to serve the country. However, soon after joining the services, he realized that things are not as rosy as he had imagined. He found a number of malpractices prevailing in the department assigned to him. For example, funds under various schemes and grants were being misappropriated. The official facilities were frequently being used for personal needs by the officers and staff. After some time, he noticed that the process of recruiting the staff was also not up to the mark. Prospective candidates were required to write an examination in which a lot of cheating was going on. Some candidates were provided external help in the examination. Rameshwar brought these incidents to the notice of his seniors. However, he was advised to keep his eyes, ears and mouth shut and ignore all these things which were taking place with the connivance of the higher-ups. Rameshwar felt highly disillusioned and uncomfortable. He comes to you seeking your advice. Indicate various options that you think are available in this situation. How would you help him to evaluate these options and choose the most appropriate path to be adopted?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"2","year":"2017","question":"You are aspiring to become an IAS officer and you have cleared various stages and now you have been selected for the personal interview. On the day of the interview, on the way to the venue you saw an accident where a mother and child who happen to be your relatives were badly injured. They needed immediate help. What would you have done in such a situation? Justify your action.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"3","year":"2018","question":"Edward Snowden, a computer expert and former CIA administrator, released confidential Government documents to the press about the existence of Government surveillance programmes. According to many legal experts and the US Government, his action violated the Espionage act of 1971, which identified the leak of State secret as an act of treason. Yet, despite the fact that he broke the law, Snowden argued that he had a moral obligation to act. He gave a justification for his “whistle blowing” by stating that he had a duty “to inform the public as to that which is done in there name and that which is done against them.” According to Snowden, the Government’s violation of privacy had to be exposed regardless of legality since more substantive issues of social action and public morality were involved here. Many agreed with Snowden. Few argued that he broke the law and compromised national security, for which he should be held accountable. Do you agree that Snowden’s actions were ethically justified even if legally prohibited? Why or why not? Make an argument by weighing the competing values in this case","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"4","year":"2021","question":"You are Vice Principal of a degree college in one of the middle–class towns. The principal has recently retired and management is looking for his replacement. There are also feelers that the management may promote you as Principal. In the meantime, during annual examination, the flying squad came from the university caught two students red-handed involving in unfair means. A senior lecturer of the college was personally helping these student in this act. This senior lecturer also happens to be close to the management. One of the students was son of a local politician who was responsible in getting college affiliated to the present reputed university. The second student was son of a local businessman who has donated maximum funds for running of the college. You immediately informed the management regarding this unfortunate incident. The management told you to resolve the issue with flying squad at any cost. They further said that such an incident will not only tarnish the image of the college but also the politician and businessmen are very important personalities for the functioning of the college. You were also given hint that your further promotion to Principal depends on your capability in resolving this issue with flying squad. In the meantime, you were intimated by your administrative officer that certain members of the student union are protesting outside the college gate against the senior lecturer and the students involved in this incident and demanding strict action against defaulters. 1) Discuss the ethical issues involved in the case. 2) Critically examine the options available with you as Vice Principal. What option will you adopt and why?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"5","year":"2021","question":"The coronavirus disease (CoVID-19) pandemic has quickly spread to various countries. As on May 8th, 2020, in India 56342 positive cases of corona had been reported. India with a population of more than 1-35 billion had difficulty in controlling the transmission of coronavirus among its population. Multiple strategies became necessary to handle this outbreak. The Ministry of Health and Family Welfare of India raised awareness about this outbreak and took all necessary actions to control the spread of COVID-19. Indian Government implemented a 55-day lockdown throughout the country to reduce the transmission of the virus. Schools and colleges had shifted to an alternative mode of teaching- learning-evaluation and certification. Online mode became popular during these days. India was not prepared for a sudden onslaught of such a crisis due to limited infrastructure in terms of human resource, money and other facilities needed for taking care of this situation. This disease did not spare anybody irrespective of caste, creed, religion on the one hand and have and have not’ on the other. Deficiencies in hospital beds, oxygen cylinders, ambulances, hospital staff and crematorium were the most crucial aspects You are a hospital administrator in a public hospital at the time when coronavirus had attacked large number of people and patients were pouring into hospital day in and day out. 1) What are your criteria and justification for putting your clinical and non-clinical staff to attend to the patients knowing fully well that it is highly infectious disease and resources and infrastructure are limited? 2) If yours is a private hospital, whether your justification and decision would remain same as that of a public hospital?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"6","year":"2022","question":"The Supreme Court has banned mining in the Aravalli Hills to stop degradation the forest cover and to maintain ecological balance. However, the stone mining to still prevalent in the border district of the affected State with connivance of certain corrupt forest officials and politicians. Young and dynamic SP who was recently posted in the affected district promised to himself to stop this menace. In one of his surprise checks with his team, he found loaded truck with stone trying to escape the mining area. He tried to stop the truck but the truck driver overrun the police officer, killing him on the spot and thereafter managed to flee. Police filed FIR but no breakthrough was achieved in the case for almost three months. Ashok who was the Investigative Journalist working with leading TV channel, suo moto started investigating the case. Within one month, Ashok got breakthrough by interacting with local people, stone mining masia and government officials. He prepared his investigative story and presented to the CMD of the TV channel. He exposed in his investigative report the complete nexus of stone mafia working with blessing of corrupt police and civil officials and politicians. The politician who was involved in the mafia was no one else but local MLA who was considered to be very close to the Chief Minister. After going through the investigative report, the CMD advised Ashok to drop the idea of making the story public through electronic media. He informed that the local MLA was not only the relative of the owner of the TV channel but also had unofficially 20 percent share in the channel. The CMD further informed Ashok that his further promotion and hike in pay will be taken care of in addition the soft loan of 10 lakhs which he has taken from the TV channel for his son’s chronic disease will be suitably adjusted if he hands over the investigative report to him. 1) What are the options available with Ashok to cope up with the situation? 2) Critically evaluate/examine each of the options identified by Ashok. 3) What are the ethical dilemmas being faced by Ashok? 4) Which of the options, do you think, would be the most appropriate for Ashok to adopt and why? 5) In the above scenario, what type of training would you suggest for police officers posted to such districts where stone mining illegal activities are rampant?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"7","year":"2023","question":"You hold a responsible position in a ministry in the government. One day in the morning you received a call from the school of your 11-year-old son that you are required to come and meet the Principal. You proceed to the school and find your son in the Principal’s office. The Principal informs you that your son had been found wandering aimlessly in the grounds during the time classes were in progress. The class teacher further informs you that your son has lately become a loner and did not respond to questions in the class, he had also been unable to perform well in the football trials held recently. You bring your son back from the school and in the evening, you along with your wife try to find out the reasons for your son’s changed behavior. After repeated cajoling, your son shares that some children had been making fun of him in the class as well as in the WhatsApp group of the students by calling him stunted, duh and a frog. He tells you the names of a few children who are the main culprits but pleads with you to let the matter rest. After a few days, during a sporting event, where you and your wife have gone to watch your son play, one of your colleague’s son shows you a video in which students have caricatured your son. Further, he also points out to perpetrators who were sitting in the stands. You purposefully walk past them with your son and go home. Next day, you find on social media, a video denigrating you, your son and even your wife, stating that you engaged in physical bullying of children in the sports field. The video became viral on social media. Your friends and colleagues began calling you to find out the details. One of your juniors advised you to make a counter video giving the background and explaining that nothing had happened on the field. You, in turn posted a video which you have captured during the sporting event, identifying the likely perpetrators who were responsible for your son’s predicament. You have also narrated what has actually happened in the field and made attempts to bring out the adverse effects of the misuse of social media. (a) Based on the above case study, discuss the ethical issues involved in the use of social media. (b) Discuss the pros and cons of using social media by you to put across the facts to counter the fake propaganda against your family","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"1","year":"2014","question":"In our country, the migration of rural people to towns and cities is increasing drastically. This is causing serious problems both in the rural as well as in the urban areas. In fact, things are becoming really unmanageable. Can you analyze this problem in detail and indicate not only the socio-economic but also the emotional and attitudinal factors responsible for this problem? Also, distinctly bring out why— 1) Educated rural youth are trying to shift to urban areas; 2) Landless poor people are migrating to urban slums; 3) Even some farmers are selling off their land and trying to settle in urban areas taking up petty jobs. What feasible steps can you suggest which will be effective in controlling this serious problem of our country?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"2","year":"2015","question":"You are recently posted as district development officer of a district. Shortly thereafter you found that there is considerable tension in the rural areas of your district on the issue of sending girls to schools. The elders of the village feel that many problems have come up because girls are being educated and they are stepping out of the safe environment of the household. They are of the view that the girls should be quickly married off with minimum education. The girls are also competing for jobs after education, which have traditionally remained in boys’ exclusive domain, adding to unemployment amongst male population. The younger generation feels that in the present era, girls should have equal opportunities for education and employment, and other means of livelihood. The entire locality is divided between the elders and the younger lot and further sub-divided between sexes in both generations. You come to know that in Panchayat or in other local bodies or even in busy crossroads, the issue is being acrimoniously debated. One day you are informed that an unpleasant incident has taken place. Some girls were molested, when they were en route to schools. The incident led to clashes between several groups and a law and order problem has arisen. The elders after heated discussion have taken a joint decision not to allow girls to go to school and to socially boycott all such families, which do not follow their dictate. 1)What steps would you take to ensure girls’ safety without disrupting their education? 2) How would you manage and mould matriarchic attitude of the village elders to ensure harmony in the inter- generational relations?","topic":"Case Study","marks":"25","paper":"GS4","type":"Case Study"},{"qno":"3","year":"2015","question":"You are the Sarpanch of a Panchayat. There is a primary school run by the government in your area. Midday meals are provided to the children attending the school. The Headmaster has now appointed a new cook in the school to prepare the meals. However, when it is found that the cook is from Dalit community, almost half of the children belonging to higher castes are not allowed to take meals by their parents. Consequently the attendance in the school falls sharply. This could result in the possibility of discontinuation of midday meal scheme, thereafter of teaching staff and subsequent closing down the school. 1) Discuss some feasible strategies to overcome the conflict and to create right ambience. 2) What should be the responsibilities of different social segments and agencies to create positive social ambience for accepting such changes?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"4","year":"2016","question":"You are a young, aspiring and sincere employee in a Government office working as an assistant, to the director of your deportment. Since you’ve joined recently, you need to learn and progress. Luckily your superior is very kind and ready to train you for your job. He is a very intelligent and well-informed person having knowledge of various departments. In short, you respect your book and are looking forward to learn a lot from him. Since you’ve good tuning with the boss, he started depending on you. One day due to ill health he invited you at his place for finishing some urgent work. You reached his house and you heard shouting noises before you could ring the bell. You waited for a while. After entering, boss greeted you and explained the work. But you were constantly disturbed by the crying of a woman. At last, you inquired with the boss but his answer did not satisfy you. Next day, you were compelled to inquire further in the office and found out that his behavior is very had at home with his wife. He also beat up his wife. His wife is not well educated and is a simple woman in comparison to her husband. You see that though your boss is a nice person in the office, he is engaged in domestic violence at home. In such a situation, you are left with the following options. Analyse each option with its consequences. 1) Just ignore thinking about it because it is their personal matter. 2) Report the case to the appropriate authority. 3) Your own innovative approach towards the situation.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"5","year":"2016","question":"Saraswati was a successful IT professional in USA. Moved by the patriotic sense of doing something for the country she returned to India. Together with some other like-minded friends, she formed an NGO to build a school for a poor rural community. The objective of the school was to provide the best quality modern education at a nominal cost. She soon discovered that she has to seek permission from a number of Governments agencies.  The rules and procedures were quite confusing and cumbersome. What frustrated her most was the delays, callous attitude of officials and constant demand of bribes. Her experience and the experience of many others like her has deterred people from taking up social service projects. A measure of Government control over voluntary social work is necessary. But it should not be exercised in a coercive or corrupt manner. What measures can you suggest to ensure that due control is exercised but well meaning, honest NGO efforts are not thwarted?","topic":"Case Study","marks":"25","paper":"GS4","type":"Case Study"}];

  /* -------------------------------------------------------
     UPSC DIRECTIVE DETECTOR
     ------------------------------------------------------- */

  function getDirective(question) {

    const q = String(question || "").toLowerCase();

    const directives = [
      "critically examine",
      "critically evaluate",
      "to what extent",
      "differentiate",
      "compare",
      "analyse",
      "analyze",
      "evaluate",
      "assess",
      "discuss",
      "comment",
      "examine",
      "elucidate",
      "justify",
      "explain",
      "enumerate",
      "highlight",
      "substantiate",
      "clarify"
    ];

    for (const d of directives) {
      if (q.includes(d)) {
        return d;
      }
    }

    return "conceptual";
  }


  /* -------------------------------------------------------
     DIRECTIVE MEANING
     ------------------------------------------------------- */

  function directiveMeaning(d) {

    const map = {

      "discuss":
        "Multiple dimensions mein issue ko explain karo. Sirf description nahi; relevant arguments, examples aur balanced conclusion do.",

      "analyse":
        "Issue ko components mein todkar causes, mechanism, linkages aur consequences establish karo.",

      "analyze":
        "Issue ko components mein todkar causes, mechanism, linkages aur consequences establish karo.",

      "critically examine":
        "Arguments ke saath counter-arguments/limitations bhi do aur balanced judgement tak pahucho.",

      "critically evaluate":
        "Positive aur negative dimensions ko evidence ke saath weigh karke reasoned judgement do.",

      "evaluate":
        "Importance/effectiveness ko clear criteria par assess karo aur final judgement do.",

      "assess":
        "Relative importance, impact aur limitations ko weigh karke conclusion do.",

      "examine":
        "Issue ke different components ko evidence aur implications ke saath examine karo.",

      "comment":
        "Statement ko explain karo, supporting arguments do aur reasoned concluding view do.",

      "elucidate":
        "Concept ko clearly explain karo aur suitable examples se clarify karo.",

      "justify":
        "Statement ke support mein logical arguments aur evidence do; relevant limitations acknowledge karo.",

      "explain":
        "Concept/process ko why/how ke saath clear karo; sirf facts list mat karo.",

      "enumerate":
        "Major points ko systematically identify aur organise karo.",

      "compare":
        "Common dimensions par similarities aur differences point-to-point show karo.",

      "differentiate":
        "Clear criteria ke basis par dono concepts ko distinguish karo.",

      "highlight":
        "Question ke most significant aspects ko focused manner mein bring out karo.",

      "substantiate":
        "Claim ko concrete evidence, examples aur arguments se establish karo.",

      "clarify":
        "Concept ko ambiguity ke bina simple logical structure mein explain karo.",

      "to what extent":
        "Statement ki validity/impact kitni extent tak hai, usko weigh karke balanced judgement do.",

      "conceptual":
        "Question ke central concept ko define karke relevant dimensions aur examples ke through answer build karo."

    };

    return map[d] || map["conceptual"];
  }


  /* -------------------------------------------------------
     CORE QUESTION DEMAND
     ------------------------------------------------------- */

  function getDemand(q) {

    const directive = getDirective(q.question);

    return {
      directive: directive,
      meaning: directiveMeaning(directive),
      topic: q.topic || "General",
      marks: q.marks || "10"
    };
  }


  /* -------------------------------------------------------
     RELATED PYQS
     ------------------------------------------------------- */

  function getRelated(q) {

    if (!Array.isArray(DATA)) {
      return [];
    }

    return DATA
      .filter(x =>
        x !== q &&
        x.paper === q.paper &&
        String(x.topic || "").toLowerCase() ===
        String(q.topic || "").toLowerCase()
      )
      .slice(0, 6);
  }


  /* -------------------------------------------------------
     THEME FREQUENCY
     ------------------------------------------------------- */

  function getThemeData(q) {

    if (!Array.isArray(DATA)) {
      return {
        count: 1,
        years: [q.year]
      };
    }

    const same = DATA.filter(x =>
      x.paper === q.paper &&
      String(x.topic || "").toLowerCase() ===
      String(q.topic || "").toLowerCase()
    );

    return {
      count: same.length,
      years: [...new Set(
        same.map(x => x.year)
      )].sort()
    };
  }


  /* -------------------------------------------------------
     COMMON MISTAKES
     ------------------------------------------------------- */

  function getMistakes(q) {

    const d = getDirective(q.question);

    const mistakes = [
      "Directive ko ignore karke generic answer likhna.",
      "Question ki exact demand se bahar chale jana.",
      "Sirf facts list karna, analysis nahi dena.",
      "Specific examples/evidence na dena.",
      "Introduction bahut lamba kar dena.",
      "Body ko headings/dimensions mein organise na karna."
    ];

    if (
      d === "critically examine" ||
      d === "critically evaluate" ||
      d === "evaluate" ||
      d === "assess"
    ) {
      mistakes.push(
        "Balanced judgement ke bina answer conclude karna."
      );
    }

    if (
      d === "compare" ||
      d === "differentiate"
    ) {
      mistakes.push(
        "Point-to-point comparison ke बजाय dono topics ko separately describe karna."
      );
    }

    return mistakes;
  }

      const min =
        Math.floor(seconds / 60);

      const sec =
        String(seconds % 60)
          .padStart(2, "0");

      if (timer) {
        timer.textContent =
          `${String(min).padStart(2, "0")}:${sec}`;

<style id="f27-bilingual-style">
.f27-bilingual-question{background:#fff;border:1px solid #dedede;border-radius:20px;padding:16px;margin:0 0 16px;box-shadow:0 8px 24px #00000008}
.f27-q-head{font-size:12px;font-weight:900;letter-spacing:.4px;margin-bottom:12px}
.f27-q-en,.f27-q-hi{border-radius:15px;padding:13px;margin-top:9px}
.f27-q-en{background:#f1f1f1}
.f27-q-hi{background:#111;color:#fff}
.f27-q-en span,.f27-q-hi span{font-size:10px;font-weight:900;letter-spacing:.8px;opacity:.72;text-transform:uppercase}
.f27-q-en p,.f27-q-hi p{margin:7px 0 0;font-size:14px;line-height:1.7;font-weight:650}
.f27-q-hi p{color:#f2f2f2}
</style>

<script>
(function(){
  if(window.__F27_BILINGUAL_V1__) return;
  window.__F27_BILINGUAL_V1__ = true;
  const previousOpenQ = window.openQ;

  function escHtml(s){
    return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function cacheKey(q){ return 'f27_pyq_hi_v1_'+btoa(unescape(encodeURIComponent(q))).replace(/=+$/,''); }

  async function translateQuestion(text){
    const ck=cacheKey(text);
    const cached=localStorage.getItem(ck);
    if(cached) return cached;
    try{
      const res=await fetch('/api/translate',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text,source:'en',target:'hi'})
      });
      if(res.ok){
        const data=await res.json();
        if(data.translation){
          localStorage.setItem(ck,data.translation);
          return data.translation;
        }
      }
    }catch(e){ console.warn('FATEH27 Hindi translation API unavailable',e); }
    return '';
  }

  window.openQ = async function(i){
    previousOpenQ(i);
    const q=DATA[i];
    if(!q) return;
    const detail=document.getElementById('detail');
    if(!detail) return;

    const old=detail.querySelector('.f27-bilingual-question');
    if(old) old.remove();

    const box=document.createElement('div');
    box.className='f27-bilingual-question';
    box.innerHTML=`
      <div class="f27-q-head">Question • प्रश्न</div>
      <div class="f27-q-en"><span>English</span><p>${escHtml(q.question)}</p></div>
      <div class="f27-q-hi"><span>हिंदी</span><p id="f27HindiText">हिंदी अनुवाद तैयार हो रहा है…</p></div>
    `;
    const h2=detail.querySelector('h2');
    if(h2) h2.insertAdjacentElement('beforebegin',box); else detail.prepend(box);

    const hi=await translateQuestion(q.question);
    const target=box.querySelector('#f27HindiText');
    if(!target) return;
    target.textContent=hi || 'हिंदी अनुवाद अभी उपलब्ध नहीं है। कृपया दोबारा प्रश्न खोलें।';
  };
})();

</script>
