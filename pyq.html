ion in the development process of the country.","topic":"Nanotechnology","marks":"12.5","paper":"GS3"},{"year":"2017","question":"India has achieved remarkable successes in unmanned space missions including the Chandrayaan and Mars Orbitter Mission, but has not ventured into manned space mission, both in terms of technology and logistics? Explain critically.","topic":"Space","marks":"10","paper":"GS3"},{"year":"2017","question":"Give an account of the growth and development of nuclear science and technology in India. What is the advantage of fast breeder reactor programme in India?","topic":"Nuclear","marks":"15","paper":"GS3"},{"year":"2018","question":"Discuss the work of ‘Bose-Einstein Statistics’ done by Prof. Satyendra Nath Bose and show how it revolutionized the field of Physics.","topic":"Scientist","marks":"10","paper":"GS3"},{"year":"2019","question":"What is India’s plan to have its own space station and how will it benefit our space programme?","topic":"Space","marks":"10","paper":"GS3"},{"year":"2019","question":"How is the government of India protecting traditional knowledge of medicine from patenting by pharmaceutical companies?","topic":"Pharma","marks":"15","paper":"GS3"},{"year":"2021","question":"The Nobel Prize in Physics of 2014 was jointly awarded to Akasaki, Amano and Nakamura for the invention of Blue LEDs in 1990s. How has this invention impacted the everyday life of human beings?","topic":"Scientist","marks":"15","paper":"GS3"},{"year":"2022","question":"What is the basic principle behind vaccine development? How do vaccines work? What approaches were adopted by the Indian vaccine manufacturers to produce COVID-19 vaccines?","topic":"Vaccine","marks":"15","paper":"GS3"},{"year":"2023","question":"What is the main task of India’s third moon mission which could not be achieved in its earlier mission? List the countries that have achieved this task. Introduce the system in the spacecraft launched and explain the role of the ‘Virtual Launch Control Centre’ at the Vikram Sarabhai Space Centre which contributed to the successful launch from Sriharikota.","topic":"Space","marks":"15","paper":"GS3"},{"year":"2013","question":"Article 244 of Indian Constitution relates to Administration of Scheduled areas and tribal areas. Analyze the impact of non-implementation of the provisions of fifth schedule on the growth of Left Wing Extremism.","topic":"LWE","marks":"10","paper":"GS3"},{"year":"2015","question":"The persisting drives of the government for development of large industries in backward areas have resulted in isolating the tribal population and the farmers who face multiple displacements with Malkangiri and Naxalbari foci, discuss the corrective strategies needed to win the left wing extremism (LWE) doctrine affected citizens back into the mainstream of social and economic growth.","topic":"LWE","marks":"12.5","paper":"GS3"},{"year":"2015","question":"Religious indoctrination via digital media has resulted in Indian youth joining the ISIS. What is ISIS and its mission? How can ISIS be dangerous for the internal security of our country?","topic":"Terrorism","marks":"12.5","paper":"GS3"},{"year":"2016","question":"“Terrorism is emerging as a competitive industry over the last few decades.” Analyse the above statement.","topic":"Terrorism","marks":"12.5","paper":"GS3"},{"year":"2017","question":"Mob violence is emerging as a serious law and order problem in India. By giving suitable examples, analyze the causes and consequences of such violence.","topic":"Organised Crime","marks":"15","paper":"GS3"},{"year":"2017","question":"The scourge of terrorism is a grave challenge to national security. What solutions do you suggest to curb this growing menace? What are the major sources of terrorist funding?","topic":"Terrorism","marks":"15","paper":"GS3"},{"year":"2017","question":"The north-eastern region of India has been infested with insurgency for a very long time. Analyze the major reasons for the survival of arm nal security threat. In this context, discuss the emerging issues and suggest a multilayered strategy to tackle the menace of Naxalism.","topic":"LWE","marks":"15","paper":"GS3"},{"year":"2023","question":"Winning of ‘Hearts and Minds’ in terrorism affected areas is an essential step in restoring the trust of the population. Discuss the measures adopted by the Government in this respect as part of the conflict resolution in Jammu and Kashmir.","topic":"Terrorism","marks":"10","paper":"GS3"},{"year":"2023","question":"Give out the major sources of terror funding in India and the efforts being made to curtail these sources. In the light of this, also discuss the aim and objective of the No Money for Terror (NMFT) Conference recently held at New Delhi in November 2022.","topic":"Terrorism","marks":"15","paper":"GS3"},{"year":"2013","question":"How far are India’s internal security challenges linked with border management, particularly in view of the long porous borders with most countries of South Asia and Myanmar?","topic":"Border","marks":"10","paper":"GS3"},{"year":"2014","question":"International civil aviation laws provide all countries complete and exclusive sovereignty over the airspace above the territory. What do you understand by airspace? What are the implications of these laws on the space above this airspace? Discuss the challenges which this poses and suggests ways to contain the threat.","topic":"Forces","marks":"12.5","paper":"GS3"},{"year":"2014","question":"The diverse nature of India as a multireligious and multi-ethnic society is not immune to the impact of radicalism which has been in her neighbourhood. Discuss along with the strategies to be adopted to counter this environment.","topic":"Challenge","marks":"12.5","paper":"GS3"},{"year":"2014","question":"How illegal transborder migration does pose a threat to India’s security? Discuss the strategies to curb this, bring out the factors which give impetus to such migration.","topic":"Border","marks" ia-Myanmar border. Also, discuss the steps to counter the challenges.","topic":"Border","marks":"15","paper":"GS3"},{"year":"2020","question":"Analyze internal security threats and transborder crimes along Myanmar, Bangladesh and Pakistan borders including Line of Control (LoC). Also discuss the role played by various security forces in this regard","topic":"Border","marks":"15","paper":"GS3"},{"year":"2020","question":"For effective border area management, discuss the steps required to be taken to deny local support to militants and also suggest ways to manage favourable perception among locals","topic":"Border","marks":"10","paper":"GS3"},{"year":"2021","question":"Keeping in view India’s internal security, analyse the impact of cross-border cyber attacks. Also, discuss defensive measures against these sophisticated attacks.","topic":"Border","marks":"10","paper":"GS3"},{"year":"2021","question":"Analyse the multidimensıonal challenges posed by external state and non-state actors, to the internal security of India. Also, discuss measures required to be taken to combat these threats","topic":"Actors","marks":"15","paper":"GS3"},{"year":"2022","question":"What are the maritime security challenges in India? Discuss the organisational, technical and procedural initiatives taken to improve the maritime security.","topic":"Maritime","marks":"10","paper":"GS3"},{"year":"2023","question":"The use of unmanned aerial vehicles (UAVs) by our adversaries across the borders to ferry arms/ammunitions, drugs, etc, is a serious threat to the internal security. Comment on the measures being taken to tackle this threat.","topic":"Border","marks":"10","paper":"GS3"},{"year":"2013","question":"Money laundering poses a serious threat to country’s economic sovereignty. What is its significance for India and what steps are required to be taken to control this menace?","topic":"Steps","marks":"10","paper":"GS3"},{"year":"2018","question":"India’s proximity to two of the world’s biggest illicit opium-growing states has enhanced her internal security concerns. Explain the linkages between drug trafficking and other illicit activities such as gunrunning, money laundering and human trafficking. What counter-measures should be taken to prevent the same?","topic":"Linkage","marks":"15","paper":"GS3"},{"year":"2021","question":"Discuss how emerging technologies and globalisation contribute to money laundering. Elaborate measures to tackle the problem of money laundering both at national and international levels.","topic":"Technologies","marks":"10","paper":"GS3"},{"year":"2013","question":"Cyber warfare is considered by some defense analysts to be a larger threat than even Al Qaeda or terrorism. What do you understand by Cyber warfare? Outline the cyber threats which India is vulnerable to and bring out the state of the country’s preparedness to deal with the same.","topic":"Terrorism","marks":"10","paper":"GS3"},{"year":"2013","question":"What is digital signature? What does its authentication mean? Giver various salient built in features of a digital signature.","topic":"Concept","marks":"5","paper":"GS3"},{"year":"2013","question":"What are social networking site and what security implications do these sites present?","topic":"Social Network","marks":"10","paper":"GS3"},{"year":"2015","question":"Discuss the advantage and security implications of cloud hosting of server vis-a-vis in- house machine-based hosting for government businesses.","topic":"Concept","marks":"12.5","paper":"GS3"},{"year":"2015","question":"Considering the threats cyberspace poses for the country, India needs a “Digital Armed Force” to prevent crimes. Critically evaluate the National Cyber Security Policy, 2013 outlining the challenges perceived in its effective implementation.","topic":"Policy","marks":"12.5","paper":"GS3"},{"year":"2016","question":"Use of Internet and social media by non-state actors for subversive activities is a major concern. How have these have misused in th  implications in the modern techno-economic society.","topic":"Human Values","marks":"10","paper":"GS4","type":"Theory"},{"qno":"3","year":"2015","question":"What is meant by ‘environmental ethics’? Why is it important to study? Discuss any one environmental issue from the viewpoint of environmental ethics.","topic":"Branch","marks":"10","paper":"GS4","type":"Theory"},{"qno":"4","year":"2016","question":"Law and ethics are considered to be the two tools for controlling human conduct so as to make it conducive to civilized social existence. (a) Discuss how they achieve this objective. (b) Giving examples, show how the two differ in their approaches.","topic":"Law v Ethics","marks":"10","paper":"GS4","type":"Theory"},{"qno":"5","year":"2016","question":"Explain how ethics contributes to social and human well-being.","topic":"Ethics","marks":"10","paper":"GS4","type":"Theory"},{"qno":"6","year":"2017","question":"Without commonly shared and widely entrenched moral values and obligations, neither the law, nor democratic government, nor even the market economy will function properly. What do you understand by this statement? Explain with illustration in the contemporary times.","topic":"Values","marks":"10","paper":"GS4","type":"Theory"},{"qno":"7","year":"2017","question":"The crisis of ethical values in modern times is traced to a narrow perception of the good life. Discuss.","topic":"Values","marks":"10","paper":"GS4","type":"Theory"},{"qno":"8","year":"2018","question":"With regard to the morality of actions, one view is that means is of paramount importance and the other view is that the ends justify the means. Which view do you think is more appropriate? Justify your answer.","topic":"Morality","marks":"10","paper":"GS4","type":"Theory"},{"qno":"9","year":"2018","question":"What does this quotations mean to you in the present context: “Falsehood takes the place of truth when it results in unblemished common good.”- Tirukkural.","topic":"Truth","marks":"10","paper": opic":"Society","marks":"10","paper":"GS4","type":"Theory"},{"qno":"6","year":"2016","question":"Our attitudes towards life, work, other people and society are generally shaped unconsciously by the family and social surroundings in which we grow up. Some of these unconsciously acquired attitudes and values are often undesirable in the citizens of modern democratic and egalitarian society.  (a) Discuss such undesirable values prevalent in today’s educated Indians. (b) How can such undesirable attitudes be changed and socio-ethical values be cultivated in the aspiring and serving civil servants?","topic":"Family","marks":"10","paper":"GS4","type":"Theory"},{"qno":"7","year":"2020","question":"The current internet expansion has instilled a different set of cultural values which are in conflict with traditional values. Discuss.","topic":"Society","marks":"10","paper":"GS4","type":"Theory"},{"qno":"8","year":"2020","question":"“Education is not an injunction, it is an effective and pervasive tool for all-round development of an individual and social transformation”.Examine the New Education Policy,2020(NEP,2020)in light of the above statement.","topic":"Education","marks":"10","paper":"GS4","type":"Theory"},{"qno":"9","year":"2022","question":"Online methodology is being used for day-to-day meetings, institutional approvals in the administration and for teaching and learning in the education sector to the extent telemedicine in the health sector is getting popular with the approvals of the competent authority. No doubt it has advantages and disadvantages for both the beneficiaries and the system at large. Describe and discuss the ethical issues involved in the use of online methods particularly to vulnerable sections of society.","topic":"Education","marks":"10","paper":"GS4","type":"Theory"},{"qno":"1","year":"2013","question":"It is often said that ‘politics’ and ‘ethics’ do not go together. What is your opinion in this regard? Justify your answer with illustrations.","topic":"Politics","marks":"10","paper":"GS4","type":"Theory"},{"qno":"2","year":"2014","question":"In the context of defense services, ‘patriotism’ demands readiness to even lay down one’s life in protecting the nation. According to you, what does patriotism imply in everyday civil life? Explain with illustrations and justify your answer.","topic":"Politics","marks":"10","paper":"GS4","type":"Theory"},{"qno":"3","year":"2014","question":"What factors affect the formation of a person’s attitude towards social problems? In our society, contrasting attitudes are prevalent about many social problems. What contrasting attitudes do you notice about the caste system in our society? How do you explain the existence of these contrasting attitudes?","topic":"Social","marks":"10","paper":"GS4","type":"Theory"},{"qno":"4","year":"2016","question":"How could social influence and persuasion contribute to the success of Swatchh Bharat Abhiyan?","topic":"Social","marks":"10","paper":"GS4","type":"Theory"},{"qno":"5","year":"2017","question":"Young people with ethical conduct are not willing to come forward to join active politics. Suggest steps to motivate them to come forward.","topic":"Politics","marks":"10","paper":"GS4","type":"Theory"},{"qno":"6","year":"2020","question":"A positive attitude is considered to be an essential characteristic of a civil servant who is often required to function under extreme stress. What contributes a positive attitude in person.?","topic":"Attitude","marks":"10","paper":"GS4","type":"Theory"},{"qno":"7","year":"2021","question":"Impact of digital technology as a reliable source of input for rational decision making is debatable issue. Critically evaluate with a suitable example.","topic":"Influence","marks":"10","paper":"GS4","type":"Theory"},{"qno":"8","year":"2021","question":"Attitude is an important component that goes as input in the development of humans. How to build a suitable needed for a public servant?","topic":"Attitude","marks":"10","paper":"GS4","type":"Theory"},{"qno":"9","year":"2023","question":"Differentiate ‘moral intuition” from ‘moral reasoning’ with suitable examples.","topic":"Moral","marks":"10","paper":"GS4","type":"Theory"},{"qno":"1","year":"2013","question":"Indicate two more attributes which you consider important for public service. Justify your answer","topic":"Attributes","marks":"10","paper":"GS4","type":"Theory"},{"qno":"2","year":"2013","question":"What do you understand by the following terms in the context of public service? (3M) : a) Integrity  b) Perseverance c) Spirit of service  d) Commitment e) Courage of conviction f) Personal opinion","topic":"Multiple","marks":"10","paper":"GS4","type":"Theory"},{"qno":"3","year":"2014","question":"Integrity without knowledge is weak and useless, but knowledge without integrity is dangerous and dreadful. What do you understand by this statement? Explain your stand with illustrations from the modern context.","topic":"Integrity","marks":"10","paper":"GS4","type":"Theory"},{"qno":"4","year":"2015","question":"How do the virtues of trustworthiness and fortitude get manifested in public service? Explain with examples.","topic":"Multiple","marks":"10","paper":"GS4","type":"Theory"},{"qno":"5","year":"2015","question":"Public servants are likely to confront with the issues of ‘Conflict of Interest’. What do you understand by the term ‘Conflict of Interest’ and how does it manifest in the decision making by public servants? If faced with the conflict of interest situation, how would you resolve it? Explain with the help of examples. Conflict Of","topic":"Interest","marks":"10","paper":"GS4","type":"Theory"},{"qno":"6","year":"2016","question":"Why should impartiality and non-partisanship be considered as foundational values in public services, especially in the present day socio-political context? Illustrate your answer with examples.","topic":"Multiple","marks":"10","paper":"GS4","type":"Theory"},{"qno":"7","year":"2017","question":"One of the tests of integrity is complete refusal to be compromised. Explain with reference to a real life example.","topic":"Integrity","marks":"10","paper":"GS4","type":"Theory"},{"qno":"8","year":"2018","question":"“In looking for people to hire, you look for three qualities: integrity, intelligence and energy. And if they do not have the first, the other two will kill you.” – Warren Buffett. What do you understand by this statement in the present-day scenario? Explain.","topic":"Multiple","marks":"10","paper":"GS4","type":"Theory"},{"qno":"9","year":"2021","question":"Identify five ethical traits on which one can plot the performance of a civil servant. Justify their inclusion in the matrix.","topic":"Multiple","marks":"10","paper":"GS4","type":"Theory"},{"qno":"10","year":"2021","question":"Should impartial and being non-partisan be considered as indispensable qualities to make a successful civil servant? Discuss with illustrations.","topic":"Non-Partisanship","marks":"10","paper":"GS4","type":"Theory"},{"qno":"11","year":"2021","question":"“Integrity is a value that empowers the human being.” Justify with suitable illustration.","topic":"Integrity","marks":"10","paper":"GS4","type":"Theory"},{"qno":"12","year":"2022","question":"Apart from intellectual competency and moral qualities, empathy and compassion are some of the other vital attributes that facilitate the civil servants to be more competent in tackling the crucial issues or taking critical decisions. Explain with suitable illustrations.","topic":"Multiple","marks":"10","paper":"GS4","type":"Theory"},{"qno":"13","year":"2022","question":"(i) Constitutional morality (ii) Conflict of interest (iii) Probity in public life (iv) Challenges of digitalization (v) Devotion to duty","topic":"Multiple","marks":"10","paper":"GS4","type":"Theory"},{"qno":"1","year":"2013","question":"What is ’emotional intelligence’ and how can it be developed in people? How does it help an individual in taking ethical decisions?","topic":"EI","marks":"10","paper":"GS4","type":"Theory"},{"qno":"2","year":"2014","question":"All human beings aspire for happiness. Do you agree? What does happiness mean to you? Explain with examples.","topic":"Emotion","marks":"10","paper":"GS4","type":"Theory"},{"qno":"3","year":"2016","question":"Anger is a harmful negative emotion. It is injurious to both personal life and work life. (a) Discuss how it leads to negative emotions and undesirable behaviours. (b) How can it be managed and controlled?","topic":"Emotion","marks":"10","paper":"GS4","type":"Theory"},{"qno":"4","year":"2017","question":"How will you apply emotional intelligence in administrative practices?","topic":"EI","marks":"10","paper":"GS4","type":"Theory"},{"qno":"5","year":"2018","question":"What does this quotations mean to you in the present context: Anger and intolerance are the enemies of correct understanding. “ _ Mahatma Gandhi.","topic":"Emotion","marks":"10","paper":"GS4","type":"Theory"},{"qno":"6","year":"2019","question":"“Emotional Intelligence is the ability to make your emotions work for you instead of against you.” Do you agree with this view? Discuss.","topic":"EI","marks":"10","paper":"GS4","type":"Theory"},{"qno":"7","year":"2020","question":"What are the main components of emotional intelligence (EI) ? Can they be learned? discuss.","topic":"EI","marks":"10","paper":"GS4","type":"Theory"},{"qno":"8","year":"2021","question":"In case of crisis of conscience does emotional intelligence help to overcome the same without compromising the ethical or moral stand that you are likely to follow? Critically examine.","topic":"EI","marks":"10","paper":"GS4","type":"Theory"},{"qno":"9","year":"2023","question":"“What really matters for success, character, happiness, and lifelong achievements is a definite set of emotional skills -your EQ- not just purely cognitive abilities that are measured by conventional IQ tests.” Do you agree with the view? Give reasons in support of your answer.","topic":"EQ","marks":"10","paper":"GS4","type":"Theory"},{"qno":"1","year":"2013","question":"I count him braver who overcomes his desires than him who overcomes his enemies.—Aristotle","topic":"Desire","marks":"10","paper":"GS4","type":"Theory"},{"qno":"2","year":"2013","question":"Nearly all men can withstand adversity, but if you want to test a man’s character, give him power.—Abraham Lincoln","topic":"Character","marks":"10","paper":"GS4","type":"Theory"},{"qno":"3","year":"2013","question":"There is enough on this earth for every one’s need but for no one’s greed. Mahatma Gandhi.","topic":"Greed","marks":"10","paper":"GS4","type":"Theory"},{"qno":"4","year":"2014","question":"Which eminent personality has inspired you the most in the context of ethical conduct in life? Give the gist of his/her teachings giving specific examples, describe how you have been able to apply these teachings for your own ethical development.","topic":"Ethical Conduct","marks":"10","paper":"GS4","type":"Theory"},{"qno":"5","year":"2015","question":"We can easily forgive a child who is afraid of the dark; the real tragedy of life is when men are afraid of the light.","topic":"Truth","marks":"10","paper":"GS4","type":"Theory"},{"qno":"6","year":"2015","question":"“The weak can never forgive; forgiveness is the attribute of the strong.”","topic":"Forgivness","marks":"10","paper":"GS4","type":"Theory"},{"qno":"7","year":"2016","question":"Max Weber said that it is not wise to apply to public administration the sort of moral and ethical norms we apply to matters of personal conscience. It is important to realise that the State bureaucracy might possess its own independent bureaucratic morality. Critically analyse this statement. Bureaucratic","topic":"Morality","marks":"10","paper":"GS4","type":"Theory"},{"qno":"8","year":"2016","question":"Corruption causes misuse of government treasury, Administrative inefficiency and obstruction in the path of national Development. Discuss Kautilya’s views.","topic":"Administartion","marks":"10","paper":"GS4","type":"Theory"},{"qno":"9","year":"2016","question":"Analyse John Rawls’s concept of social justice in the Indian context.","topic":"Justice","marks":"10","paper":"GS4","type":"Theory"},{"qno":"10","year":"2016","question":"Discuss Mahatma Gandhi’s concept of seven sins.","topic":"Sins","marks":"10","paper":"GS4","type":"Theory"},{"qno":"11","year":"2017","question":"“Great ambition is the passion of a great character. Those endowed with it may perform very good or very bad acts. All depends on the principles which direct them.” – Napoleon Bonaparte. Stating examples mention the rulers (i) who have harmed society and country, (ii) who worked for the development of society and country.","topic":"Character","marks":"10","paper":"GS4","type":"Theory"},{"qno":"12","year":"2019","question":"“An unexamined life is not worth living.” – Socrates","topic":"Introspect","marks":"10","paper":"GS4","type":"Theory"},{"qno":"13","year":"2019","question":"“A man is but the product of his thoughts. What he thinks, he becomes.” – M.K.Gandhi","topic":"Thoughts","marks":"10","paper":"GS4","type":"Theory"},{"qno":"14","year":"2019","question":"“Where there is righteousness in the heart, there is beauty in the character. When there is beauty in the character, there is harmony in the home. When there is harmony in the home, there is order in the nation. When there is order in the nation, there is peace in the world.” – A.P.J. Abdul Kalam","topic":"Character","marks":"10","paper":"GS4","type":"Theory"},{"qno":"15","year":"2020","question":"What teachings of Buddha are most relevant today and why? Discuss.","topic":"Buddha","marks":"10","paper":"GS4","type":"Theory"},{"qno":"16","year":"2020","question":"What are the main factors responsible for gender responsibility in India ? Discuss the contribution of Savitribai Phule in this regard.","topic":"Phule","marks":"10","paper":"GS4","type":"Theory"},{"qno":"17","year":"2020","question":"”Condemn none: if you can stretch out a helping hand do so. If not fold your hands, bless your brothers and let them go their own way.” – Swami Vivekanand","topic":"Help","marks":"10","paper":"GS4","type":"Theory"},{"qno":"18","year":"2020","question":"The best way to find yourself is to lose yourself in service of others .” Mahatma Gandhi","topic":"Selflessness","marks":"10","paper":"GS4","type":"Theory"},{"qno":"19","year":"2020","question":"”A system of morality which is based on relative emotional values is a mere illusion, a thoroughly vulgar conception which has nothing sound in it and nothing true.” – Socrates.","topic":"Morality","marks":"10","paper":"GS4","type":"Theory"},{"qno":"20","year":"2021","question":"“Every work has got to pass through hundreds of difficulties before succeeding. Those that persevere will see the light, sooner or later.-Swami Vivekananda","topic":"Perseverance","marks":"10","paper":"GS4","type":"Theory"},{"qno":"21","year":"2021","question":"“We can never obtain peace in the outer world until and unless we obtain peace within ourselves.” – Dalai Lama","topic":"Introspect","marks":"10","paper":"GS4","type":"Theory"},{"qno":"22","year":"2021","question":"Life doesn’t make any sense without interdependence. We need each other, and the sooner we learn that, it is better for us all.” - Erik Erikson","topic":"Unity","marks":"10","paper":"GS4","type":"Theory"},{"qno":"23","year":"2022","question":"Ethics is knowing the difference between what you have the right to do and what is right to do.’-Potter Stewart .","topic":"Morality","marks":"10","paper":"GS4","type":"Theory"},{"qno":"24","year":"2022","question":"“If a country is to be corruption free and become a nation of beautiful minds, I strongly feel there are three key societal members who can make a difference. They are the father, the mother and the teacher.” – Abdul Kalam","topic":"Corruption","marks":"10","paper":"GS4","type":"Theory"},{"qno":"25","year":"2022","question":"“Judge your success by what you had to give up in order to get it.” Dalai Lama.","topic":"Selflessness","marks":"10","paper":"GS4","type":"Theory"},{"qno":"26","year":"2023","question":"“The simplest arts of kindness are by far more powerful than a thousand heads bowing in prayer.”- Mahatma Gandhi","topic":"Kindness","marks":"10","paper":"GS4","type":"Theory"},{"qno":"27","year":"2023","question":"To awaken the people, it is the women who must be awakened. Once she is on the move, the family moves, the village moves, the nation moves”.- Jawaharlal Nehru","topic":"Empowerment","marks":"10","paper":"GS4","type":"Theory"},{"qno":"28","year":"2023","question":"“Do not hate anybody, because that hatred that comes out from you must, in the long run, come back to you. If you love, that love will me back to you, completing the circle- Swami Vivekananda","topic":"Hate","marks":"10","paper":"GS4","type":"Theory"},{"qno":"29","year":"2023","question":"What were the major teachings of Guru Nanak? Explain their relevance in the contemporary world.","topic":"Teachings","marks":"10","paper":"GS4","type":"Theory"},{"qno":"1","year":"2013","question":"What is meant by ‘crisis of conscience’? Narrate one incident in your life when you were faced with such a crisis and how you resolved the same.","topic":"Conscience","marks":"10","paper":"GS4","type":"Theory"},{"qno":"2","year":"2013","question":"What do you understand by the term ‘voice of conscience’? How do you prepare yourself to heed to the voice of conscience?","topic":"Conscience","marks":"10","paper":"GS4","type":"Theory"},{"qno":"3","year":"2014","question":"What does ‘accountability’ mean in the context of public service? What measures can be adopted to ensure individual and collective accountability of public servants?","topic":"Accountability","marks":"10","paper":"GS4","type":"Theory"},{"qno":"4","year":"2014","question":"What does ethics seek to promote in human life? Why is it all the more important in public administration?","topic":"Ethics","marks":"10","paper":"GS4","type":"Theory"},{"qno":"5","year":"2015","question":"Differentiate between the following a) Law and Ethics b) Ethical management and Management of ethics; c) Discrimination and Preferential treatment; d) Personal ethics and Professional ethics","topic":"Multiple","marks":"10","paper":"GS4","type":"Theory"},{"qno":"6","year":"2015","question":"Two different kinds of attitudes exhibited by public servants towards their work have been identified as the bureaucratic attitude and the democratic attitude. A) Distinguish between these two terms and write their merits and demerits. B) Is it possible to balance the two to create a better administration for the faster development of our country?","topic":"Attitude","marks":"10","paper":"GS4","type":"Theory"},{"qno":"7","year":"2015","question":"A mere compliance with law is not enough, the public servant also has to have a well-developed sensibility to ethical issues for effective discharge of duties.” Do you agree? Explain with the help of two examples, where (i) an act is ethically right, but not legally and (ii) an act is legally right, but not ethically.","topic":"Ethics","marks":"10","paper":"GS4","type":"Theory"},{"qno":"8","year":"2017","question":"Conflict of interest in the public sector arises when (a) official duties, (b) public interest, and (c) personal interest are taking priority one above the other. How can this conflict in administration be resolved? Describe with an example.","topic":"Multiple","marks":"10","paper":"GS4","type":"Theory"},{"qno":"9","year":"2017","question":"Examine the relevance of the following in the context of civil service: (a) Transparency (b) Accountability (c) Fairness and justice (d) Courage of conviction (e) Spirit of service.","topic":"Multiple","marks":"10","paper":"GS4","type":"Theory"},{"qno":"10","year":"2018","question":"“In doing a good thing, everything is permitted which is not prohibited expressly or by clear implication”. Examine the statement with suitable examples in the context of a public servant discharging his/her duties.","topic":"Ethics","marks":"10","paper":"GS4","type":"Theory"},{"qno":"11","year":"2018","question":"Explain the process of resolving ethical dilemmas in Public Administration","topic":"Dilemma","marks":"10","paper":"GS4","type":"Theory"},{"qno":"12","year":"2018","question":"State the three basic values, universal in nature, in the context of civil services and bring out their importance.","topic":"Multiple","marks":"10","paper":"GS4","type":"Theory"},{"qno":"13","year":"2018","question":"Suppose the Government of India is thinking of constructing a dam in a mountain valley bond by forests and inhabited by ethnic communities. What rational policy should it resort to in dealing with unforeseen contingencies","topic":"Dilemma","marks":"10","paper":"GS4","type":"Theory"},{"qno":"14","year":"2018","question":"What is mean by public interest? What are the principles and procedures to be followed by the civil servants in public interest?","topic":"Public Interest","marks":"10","paper":"GS4","type":"Theory"},{"qno":"15","year":"2018","question":"What does this quotations mean to you in the present context: “The true rule, in determining to embrace, or reject anything, is not whether it has any evil in it; but whether it has more evil than good. There are few things wholly evil or wholly good. Almost everything, especially of governmental policy, is an inseparable compound of the two; so that our best judgement of the preponderance between them is continually demanded. ” Abraham Lincoln.","topic":"Dilemma","marks":"10","paper":"GS4","type":"Theory"},{"qno":"16","year":"2018","question":"What is meant by conflict of interest? Illustrate with examples, the difference between the actual and potential conflicts of interest. Conflict of","topic":"Interest","marks":"10","paper":"GS4","type":"Theory"},{"qno":"17","year":"2019","question":"What do you understand by the term ‘public servant’? Reflect on the expected role of a public servant.","topic":"Role","marks":"10","paper":"GS4","type":"Theory"},{"qno":"18","year":"2019","question":"what is meant by constitutional morality? How does one uphold constitutional morality?","topic":"Morality","marks":"10","paper":"GS4","type":"Theory"},{"qno":"19","year":"2019","question":"What is meant by ‘crisis of conscience’? How does it manifest itself in the public domain?","topic":"Conscience","marks":"10","paper":"GS4","type":"Theory"},{"qno":"20","year":"2020","question":"‘Hatred is destructive of a person‘s wisdom and conscience that can poison a nation’s spirit. Do you agree with this view? Justify your answe","topic":"Conscience","marks":"10","paper":"GS4","type":"Theory"},{"qno":"21","year":"2020","question":"Distinguish between laws and rules. Discuss the role of ethics in formulating them.","topic":"Law Rule Ethics","marks":"10","paper":"GS4","type":"Theory"},{"qno":"22","year":"2021","question":"Identify ten essential values that are needed to be an effective public servant. Describe the /ways and means to prevent non- ethical behaviour in public servants.","topic":"Multiple","marks":"10","paper":"GS4","type":"Theory"},{"qno":"23","year":"2021","question":"Besides domain knowledge, a public official needs innovativeness and creativity of a high order as well, while resolving ethical dilemmas. Discuss with a suitable example.","topic":"Dilemma","marks":"10","paper":"GS4","type":"Theory"},{"qno":"24","year":"2021","question":"“Refugees should not be turned back to the country where they would face persecution or human right violation.” Examine the statement with reference to ethical dimension being violated by the nation claiming to be democratic with open society.","topic":"Dilemma","marks":"10","paper":"GS4","type":"Theory"},{"qno":"25","year":"2021","question":"An independent and empowered social audit mechanism is an absolute must in every sphere of public service, including the judiciary, to ensure performance, accountability and ethical conduct. Elaborate","topic":"Ethics","marks":"10","paper":"GS4","type":"Theory"},{"qno":"26","year":"2022","question":"The Rules and Regulations provided to all the civil servants are same, yet there is difference in the performance. Positive minded officers are able to interpret the Rules and Regulations in favour of the case and achieve success, whereas negative minded officers are unable to achieve goals by interpreting the same Rules and Regulations against the case. Discuss with illustrations.","topic":"Rules","marks":"10","paper":"GS4","type":"Theory"},{"qno":"27","year":"2023","question":"Is conscience a more reliable guide when compared to laws, rules, and regulations in the context of ethical decision-making. Discuss","topic":"Conscience","marks":"10","paper":"GS4","type":"Theory"},{"qno":"1","year":"2015","question":"At the international level, the bilateral relations between most nations are governed on the policy of promoting one’s own national interest without any regard for the interest of other nations. This leads to conflicts and tensions between the nations. How can ethical consideration help resolve such tensions? Discuss with specific examples.","topic":"International","marks":"10","paper":"GS4","type":"Theory"},{"qno":"2","year":"2017","question":"Strength, peace and security are considered to be the pillars of international relations. Elucidate.","topic":"International","marks":"10","paper":"GS4","type":"Theory"},{"qno":"3","year":"2017","question":"Corporate social responsibility makes companies more profitable and sustainable. Analyse.","topic":"Corporate","marks":"10","paper":"GS4","type":"Theory"},{"qno":"4","year":"2017","question":"Increased national wealth did not result in equitable distribution of its benefits. It has created only some “enclaves of modernity and prosperity for a small minority at the cost of the majority.” Justify.d national wealth did not result in equitable distribution of its benefits. It has created only some “enclaves of modernity and prosperity for a small minority at the cost of the majority.” Justify.","topic":"International","marks":"10","paper":"GS4","type":"Theory"},{"qno":"5","year":"2020","question":"‘The will to power exits, but it can be tamed and be guided by rationality and principles of moral duty.’ Examine this statement in the context of international relations.","topic":"International","marks":"10","paper":"GS4","type":"Theory"},{"qno":"6","year":"2020","question":"Discuss the role of ethics and values in enhancing the following three major components of Comprehensive National Power(CNP)viz. human capital, soft power(culture and policies), and social harmony. (150 words)","topic":"International","marks":"10","paper":"GS4","type":"Theory"},{"qno":"7","year":"2022","question":"Russia and Ukraine war has been going on for the last seven months. Different countries have taken independent stands and actions keeping in view their own national interests. We are all aware that war has its own impact on the different aspects of society, including human tragedy. What are those ethical issues that are crucial to be considered while launching the war and its continuation so far? Illustrate with justification the ethical issues involved in the given state of affair.","topic":"International","marks":"10","paper":"GS4","type":"Theory"},{"qno":"8","year":"2022","question":"In contemporary world, corporate sector’s contribution in generating wealth and employment is increasing. In doing so, they are bringing in unprecedented onslaught on the climate, environmental sustainability and living conditions of human beings. In this background, do you Responsibility (CSR) is efficient and sufficient enough to fulfill the social roles and responsibilities needed in the corporate work mandated? Critically examine.","topic":"Corporate","marks":"10","paper":"GS4","type":"Theory"},{"qno":"9","year":"2023","question":"What do you understand by ‘moral integrity’ and ‘professional efficiency in the context of corporate governance in India? Illustrate with suitable examples.","topic":"Corporate","marks":"10","paper":"GS4","type":"Theory"},{"qno":"10","year":"2023","question":"International aid is an accepted form of helping resource- challenged nations. Comment on ethics in contemporary international aid. Support your answer with suitable examples.","topic":"International","marks":"10","paper":"GS4","type":"Theory"},{"qno":"1","year":"2014","question":"What do you understand by ‘probity’ in public life? What are the difficulties in practicing it in the present times? How can these difficulties be overcome?","topic":"Public","marks":"10","paper":"GS4","type":"Theory"},{"qno":"2","year":"2015","question":"Today we find that in spite of various measures like prescribing codes of conduct, setting up vigilance cells/commissions, RTI, active media and strengthening of legal mechanisms, corrupt practices are not coming under control. A) Evaluate the effectiveness of these measures with justifications. B) Suggest more effective strategies to tackle this menace.","topic":"RTI","marks":"10","paper":"GS4","type":"Theory"},{"qno":"3","year":"2015","question":"Some recent developments such as introduction of RTI Act, media and judicial activism, etc., are proving helpful in bringing about greater transparency and accountability in the functioning of the government. However, it is also being observed that at times the mechanisms are misused. Another negative effect is that the officers are now afraid to take prompt decisions. Analyze this situation in detail and suggest how this dichotomy can be resolved. Suggest how these negative impacts can be minimized.","topic":"RTI","marks":"10","paper":"GS4","type":"Theory"},{"qno":"4","year":"2016","question":"What do you understand by the terms ‘governance’, ‘good governance’ and ‘ethical governance’?","topic":"Governance","marks":"10","paper":"GS4","type":"Theory"},{"qno":"5","year":"2018","question":"“The Right to Information Act is not all about citizens’ empowerment alone, it essentially redefines the concept of accountability. Discuss.","topic":"RTI","marks":"10","paper":"GS4","type":"Theory"},{"qno":"6","year":"2019","question":"What do you understand by probity in governance? Based on your understanding of the term, suggest measures for ensuring probity in government.","topic":"Governance","marks":"10","paper":"GS4","type":"Theory"},{"qno":"7","year":"2019","question":"There is a view that the official secrets act is an obstacle to the implementation of the Rights to Information act. Do you agree with the view? Discuss","topic":"RTI","marks":"10","paper":"GS4","type":"Theory"},{"qno":"8","year":"2022","question":"Wisdom lies in knowing what to reckon with and what to overlook. An officer being engrossed with the periphery, ignoring the core issues before him, is no rare in the bureaucracy. Do you agree that such preoccupation of an administrator leads to travesty of justice to the cause of effective service delivery and good governance? Critically evaluate.","topic":"Governance","marks":"10","paper":"GS4","type":"Theory"},{"qno":"9","year":"2022","question":"What do you understand by term ‘good governance’? How far recent initiatives in terms of e-Governance steps taken by the State have helped the beneficiaries? Discuss with suitable examples.","topic":"Governance","marks":"10","paper":"GS4","type":"Theory"},{"qno":"10","year":"2023","question":"Probity is sential for an effective system of governance and socio- economic development. Discuss","topic":"Governance","marks":"10","paper":"GS4","type":"Theory"},{"qno":"11","year":"2023","question":"Explain the term social capital. How does it enhance good governance?","topic":"Governance","marks":"10","paper":"GS4","type":"Theory"},{"qno":"1","year":"2014","question":"It is often said that poverty leads to corruption. However, there is no dearth of instances where affluent and powerful people indulge in corruption in a big way. What are the basic causes of corruption among people? Support your answer with examples.","topic":"Corruption","marks":"10","paper":"GS4","type":"Theory"},{"qno":"2","year":"2014","question":"There is a heavy ethical responsibility on the public servants because they occupy positions of power, handle huge amounts of public funds, and their decisions have wide-ranging impact on society and environment. What steps have you taken to improve your ethical competence to handle such responsibility?","topic":"Funds","marks":"10","paper":"GS4","type":"Theory"},{"qno":"3","year":"2016","question":"Discuss the Public Services Code as recommended by the 2nd Administrative Reforms Commission.","topic":"Code of Conduct","marks":"10","paper":"GS4","type":"Theory"},{"qno":"4","year":"2017","question":"“If a country is to be corruption free and become a nation of beautiful minds, I strongly feel there are three key societal members who can make a difference. they are father, the mother and the teacher.” – A. P. J. Abdul Kalam. Analyse.","topic":"Corruption","marks":"10","paper":"GS4","type":"Theory"},{"qno":"5","year":"2017","question":"Discipline generally implies following the order and subordination. However, it may be counter-productive for the organisation. Discuss.","topic":"Code of Conduct","marks":"10","paper":"GS4","type":"Theory"},{"qno":"6","year":"2018","question":"Distinguish between “Code of ethics” and “Code of conduct” with suitable examples.","topic":"Code of Conduct","marks":"10","paper":"GS4","type":"Theory"},{"qno":"7","year":"2019","question":"Explain the basic principles of citizens’ charter movement and bring out its importance","topic":"Citizens Charter","marks":"10","paper":"GS4","type":"Theory"},{"qno":"8","year":"2019","question":"“Non-performance of duty by a public servant is a form of corruption” Do you agree with this view? Justify your answer","topic":"Corruption","marks":"10","paper":"GS4","type":"Theory"},{"qno":"9","year":"2019","question":"Effective utilisation of public funds is crucial to meet development goals. Critically examine the reasons for under- utilization and mis-utilisation of public funds and their implication","topic":"Funds","marks":"10","paper":"GS4","type":"Theory"},{"qno":"10","year":"2022","question":"Whistle blower, who reports corruption and illegal activities, wrongdoing and misconduct to the concerned authorities, runs the risk of being exposed to grave danger, physical harm and victimization by the vested interests, accused persons and his team. What policy measures would you suggest to strengthen protection mechanism to safeguard the whistle blower?","topic":"Corruption","marks":"10","paper":"GS4","type":"Theory"},{"qno":"11","year":"2023","question":"“Corruption is the manifestation of the failure of core values in the society.” In your opinion, what measures can be adopted to uplift the core values in the society?","topic":"Corruption","marks":"10","paper":"GS4","type":"Theory"},{"qno":"13","year":"2023","question":"In the context of work environment, differentiate between ‘coercion and undue influence’ with suitable examples.","topic":"Work","marks":"10","paper":"GS4","type":"Theory"},{"qno":"1","year":"2013","question":"You are working as an Executive Engineer in the construction cell of a Municipal Corporation and are presently in- charge of the construction of a flyover. There are two Junior Engineers under you who have the responsibility of day-to-day inspection of the site and are reporting to you, while you are finally reporting to the Chief Engineer who heads the cell. While the construction is heading towards completion, the Junior Engineers have been regularly reporting that all construction is taking place as per design specifications. However, in one of your surprise inspections, you have noticed some serious deviations and lacunae which, in your opinion, are likely to affect the safety of the flyover. Rectification of these lacunae at this stage would require a substantial amount of demolition and rework which will cause a tangible loss to the contractor and will also delay completion. There is a lot of public pressure on the Corporation to get this construction completed because of heavy traffic congestion in the area. When you brought this matter to the notice of the Chief Engineer, he advised you that in his opinion it is not a very serious lapse and may be ignored. He advised for further expediting the project for completion in time. However, you are convinced that this was a serious matter which might affect public safety and should not be left unaddressed. What will you do in such a situation? Some of the options are given below. Evaluate the merits and demerits of each of these options and finally suggest what course of action you would like to take, giving reasons. 1) Follow the advice of the Chief Engineer and go ahead. 2) Make an exhaustive report of the situation bringing out all facts and analysis along with your own viewpoints stated clearly and seek for written orders from the chief Engineer. 3) Call for explanation from the Junior Engineers and issue orders to the contractor for necessary correction within targeted time. 4) Highlight the issue so that it reaches superiors above the Chief Engineer. 5) Considering the rigid attitude of the Chief Engineer, seek transfer from the project or report sick.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"2","year":"2013","question":"Sivakasi in Tamil Nadu is known for its manufacturing clusters on firecrackers and matches. The local economy of the area is largely dependent on firecrackers industry. It has led to tangible economic development and improved standard of living in the area. So far as child labour norms for hazardous industries like firecrackers industry are concerned, International Labour Organization (ILO) has set the minimum age as 18 years. In India, however, this age is 14 years. The units in industrial clusters of firecrackers can be classified into registered and non-registered entities. One typical unit is household-based work. Though the law is clear on the use of child labour employment norms in registered/non-registered units, it does not include household-based works. Household-based work means children working under the supervision of their parents/relatives. To evade child labour norms, several units project themselves as household-based works but employ children from outside. Needless to say that employing children saves the costs for these units leading to higher profits to the owners. On your visit to one of the units at Sivakasi, the owner takes you around the unit which has about 10-15 children below 14 years of age. The owner tells you that in his household-based unit, the children are all his relatives. You notice that several children smirk, when the owner tells you this. On deeper enquiry, you figure out that neither the owner nor the children are able to satisfactorily establish their relationship with each other. 1) Bring out and discuss the ethical issues involved in the above case. 2) What would be your reaction after your above visit?","topic":"Case Study","marks":"25","paper":"GS4","type":"Case Study"},{"qno":"3","year":"2013","question":"A Public Information Officer has received an application under RTI Act. Having gathered the information, the PIO discovers that the information pertains to some of the decisions taken by him, which were found to be not altogether right. There were other employees also who party to these decisions were. Disclosure of the information is likely to lead to disciplinary action with possibility of punishment against him as well as some of his colleagues. Non-disclosure or part disclosure or camouflaged disclosure of information will result into lesser punishment or no punishment. The PIO is otherwise an honest and conscientious person but this particular decision, on which the RTI application has been filed, turned out to be wrong. He comes to you for advice. The following are some suggested options. Please evaluate the merits and demerits of each of the options: 1) The PIO could refer the matter to his superior officer and seek his advice and act strictly in accordance with the advice, even though he is not completely in agreement with the advice of the superior. 2) The PIO could proceed on leave and leave the matter to be dealt by his successor in office or request for transfer of the application to another PIO. 3) The PIO could weigh the consequences of disclosing the information truthfully, including the effect on his career, and reply in a manner that would not place him or his career in jeopardy, but at the same time a little compromise can be made on the contents of the information. 4) The PIO could consult his other colleagues who are party to the decision and take action as per their advice. Also please indicate (without necessarily restricting to the above options) what you would like to advise, giving proper reasons","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"4","year":"2013","question":"As a senior officer in the Finance Ministry, you have access to some confidential and crucial information about policy decisions that the Government is about to announce. These decisions are likely to have far-reaching impact on the housing and construction industry. If the builders have access to this information beforehand, they can make huge profits. One of the builders has done a lot of quality work for the Government and is known to be close to your immediate superior, who asks you to disclose this information to the said builder. 1)What are the options available to you? 2) Evaluate each of these options and choose the option which you would adopt, giving reasons.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"5","year":"2014","question":"You are a no-nonsense, honest officer. You have been transferred to a remote district to head a department that is notorious for its inefficiency and callousness. You find that the main cause of the poor state of affairs is the indiscipline of a section of employees. They do not work themselves and also disrupt the working of others. You first warned the troublemakers to mend their ways or else face disciplinary action. When the warning had little effect, you issued a show cause notice to the ringleaders. As a retaliatory measure, these troublemakers instigated a woman employee amongst them to file a complaint of sexual harassment against you with the Women’s Commission. The Commission promptly seeks your explanation. The matter is also publicized in the media to embarrass you further. Some of the options to handle this situation could be as follows : 1) Give your explanation to the Commission and go soft on the disciplinary action. 2) Ignore the Commission and proceed firmly with the disciplinary action. 3) Brief your higher-ups, seek directions from them and act accordingly. Suggest any other possible option(s). Evaluate all of them and suggest the best course of action, giving your reasons for it.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"6","year":"2015","question":"You are heading a district administration in a particular department. Your senior officer calls you from the State Headquarters and tells you that a plot in Rampur village is to have a building constructed on it for a school. A visit is scheduled during which he will visit the site along with the chief engineer and the senior architect. He wants you to check out all the papers relating to it and to ensure that the visit is properly arranged. You examine the file which relates to the period before you joined the department. The land was acquired from the local Panchayat at a nominal cost and the papers show that clearance certificates are available from the two of the three authorities who have to certify the site’s suitability. There is no certification by the architect available on file. You decide to visit Rampur to ensure that all is in order as stated on file. When you visit Rampur, you find that the plot under reference is part of Thakurgarh Fort and that the walls, ramparts, etc., are running across it. The fort is well away from the main village, therefore a school here will be a serious inconvenience for the children. However, the area near the village has potential to expand into a larger residential area. The development charges on the existing plot, at the fort, will be very high and the question of heritage site has not been addressed. Moreover, the Sarpanch, at the time of acquisition of the land, was a relative of your predecessor. The whole transaction appears to have been done with some vested interest. 1) List the likely vested interests of the concerned parties. 2) Some of the options for action available to you are listed below. Discuss the merits and demerits of each of the options : 1)You can await the visit of the superior officer and let him take a decision. 2) You can seek his advice in writing or on phone. 3) You can consult your predecessor/colleagues, etc., and then decide what to do. 4)You can find out if any alternate plot can be got in exchange and then send a comprehensive written report. Can you suggest any other option with proper justification?","topic":"Case Study","marks":"25","paper":"GS4","type":"Case Study"},{"qno":"7","year":"2015","question":"There is a disaster-prone State having frequent landslides, forest fires, cloudbursts, flash floods and earthquakes, etc. Some of these are seasonal and often unpredictable. The magnitude of the disaster is always unanticipated. During one of the seasons, a cloudburst caused devastating floods and landslides leading to high casualties. There was major damage to infrastructure like roads, bridges and power generating units. This led to more than 100000 pilgrims, tourists and other locals trapped across different routes and locations. The people trapped in your area of responsibility included senior citizens, patients in hospitals, women and children, hikers, tourists, ruling party’s regional president along with his family, additional jail. As secretary State and prisoners in jail. As a civil services officer of the State, what would be the order in which you would rescue these people and why? Give justifications.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"8","year":"2016","question":"Land needed for mining, dams and other large-scale projects is acquired mostly from Adivasis, hill dwellers and rural communities. The displaced persons are paid monetary compensation as per the legal provisions. However, the payment is often tardy. In any case, it cannot sustain the displaced families for long. These people do not possess marketable skills to engage in some other occupation. They end up as low paid migrant labourers. Moreover, their living is destroyed. Thus, the benefits of traditional ways of community development go to industries, industrialists and urban communities whereas the costs are passed on to these poor helpless people. This unjust distribution of costs and benefits is unethical. Suppose you have been entrusted with the task of drafting a better compensation-cum-rehabilitation policy for such displaced persons, how would you approach the problem and what would be the main elements of your suggested policy?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"9","year":"2016","question":"Suppose you are an officer in-charge of implementing a social service scheme to provide support to old and destitute women. An old and illiterate woman comes to you to avail the benefits of the scheme. However, she has no documents to show that she fulfils the eligibility criteria. But after meeting her and listening to her you feel that she certainly needs support. Your enquiries also show that she is really destitute and living in a pitiable condition. You are in a dilemma as to what to do. Putting her under the scheme without are documents would clearly be violation of rules. But denying her the support would be cruel and inhuman. 1) Can you think of a rational way to resolve this dilemma? 2) Give your reasons for it.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"10","year":"2017","question":"You are an honest and responsible civil servant. You often observe the following: 1) There is a general perception that adhering to ethical conduct one may face difficulties to oneself and cause problems for the family, whereas unfair practices may help to reach the career goals. 2) When the number of people adopting unfair means is large, a small minority having a penchant towards ethical means makes no difference. 3) Sticking to ethical means is detrimental to the larger developmental goals 4) While one may not involve oneself in large unethical practices, but giving and accepting small gifts makes the system more efficient. Examine the above statements with their merits and demerits","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"11","year":"2017","question":"You are a Public Information Officer (PIO) in a government department. You are aware that the RTI Act 2005 envisages transparency and accountability in administration. The act has functioned as a check on the supposedly arbitrarily administrative behaviour and actions. However, as a PIO you have observed that there are citizens who filed RTI applications not for themselves but on behalf of such stakeholders who purportedly want to have access to information to further their own interests. At the same time there are these RTI activists who routinely file RTI applications and attempt to extort money from the decision makers. This type of RTI activism has affected the functioning of the administration adversely and also possibly jeopardises the genuineness of the applications which are essentially aimed at getting justice. What measures would you suggest to separate genuine and non-genuine applications? Give merits and demerits of your suggestions.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"12","year":"2018","question":"Rakesh is a responsible district level officer, who enjoys the trust of his higher officials. Knowing his honesty, the government entrusted him with the responsibility of identifying the beneficiaries under a health care scheme meant for senior citizens. The criteria to be a beneficiary are the following: 1) 60 years of age or above. 2) Belonging to a reserved community. 3) Family income of less than 1 Lakh rupees per annum. 4) Post-treatment prognosis is likely to be high to make a positive difference to the quality of life of the beneficiary. One day, an old couple visited Rakesh’s office with their application. They have been the residents of a village in his district since their birth. The old man is diagnosed with a rare condition that causes obstruction in the large intestine. As a consequence, he has severe abdominal pain frequently that prevents him from doing any physical labour. The couple has no children to support them. The expert surgeon whom they contacted is willing to do the surgery without charging any fee. However, the couple will have to bear the cost of incidental charges, such as medicines, hospitalization, etc., to the tune of rupees one lakh. The couple fulfils all the criteria except criterion ‘b’. However, any financial aid would certainly make a significant difference in their quality of life. How should Rakesh respond to the situation?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"13","year":"2018","question":"Dr X is a leading medical practitioner in a city. He has set up a charitable trust through which he plans to establish a super-speciality hospital in the city to cater to the medical needs of all sections of the society. Incidentally, that part of the State had been neglected over the years. The proposed hospital would be a boon for the region. You are heading the tax investigation agency of that region. During an inspection of the doctor’s clinic, your officers have found out some major irregularities. A few of them are substantial which had resulted in considerable withholding of tax that should be paid by him now. The doctor is cooperative. He undertakes to pay the tax immediately. However, there are certain other deficiencies in his tax compliance which are purely technical in nature. If these technical defaults are pursued by the agency, considerable time and energy of the doctor will be diverted to issues which are not so serious, urgent or even helpful to the tax collection process. Further, in all probability, it will hamper the prospects of the hospital coming up. There are two options before you: 1) Taking a broader view, ensure substantial tax compliance and ignore defaults that are merely technical in nature. 2) Pursue the matter strictly and proceed on all fronts,whether substantial or merely technical. As the head of the tax agency, which course of action will you opt and why?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"14","year":"2018","question":"It is a State where prohibition is in force. You are recently appointed as the Superintendent of Police of a district notorious for illicit distillation of liquor. The illicit liquor leads to many death, reported and unreported, and causes a major problem for the district authorities. The approach till now had been to view it as a law and order problem and tackle it accordingly. Raids, arrest, police cases, and criminal trials – all these had only limited impact. The problem remains as serious as ever. Your inspections show that the parts of the district where the distillation flourishes are economically, industrially and educationally backward. Agriculture is badly affected by poor irrigation facilities. Frequent clashes among communities gave boost to illicit distillation. No major initiatives had taken place in the past either from the government’s side or from social organizations to improve the lot of the people. Which new approach will you adopt to bring the problem under control?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"15","year":"2018","question":"A big corporate house is engaged in manufacturing industrial chemicals on a large scale. It proposes to set upon the additional unit. Many states rejected its proposal due to the detrimental effect on the environment. But one state government acceded to the request and permitted the unit close to a city, brushing aside all opposition. The unit was set up 10 years ago and was in full swing till recently. The pollution caused by the industrial effluents was affecting the land, water and crops in the area. It was also causing serious health problems to human beings and animals. This gave rise to a series of agitation thousands of people took part, creating a law and order problem necessitating stern police action. Following the public outcry, the State government ordered the closure of the factory. The closure of the factory resulted in the unemployment of not only those workers who were engaged in the factory but also those who were working in the ancillary units. It also very badly affected those industry which depended on the chemicals manufactured by it. As a senior officer entrusted with the responsibility of handling this issues, how are you going to address it?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"16","year":"2018","question":"As a senior officer in the Ministry, you have access to important policy decisions and upcoming big announcements such as road constructions projects before they are notified in the public domain. The Ministry is about to announce a mega road project for which the drawings are already in place. Sufficient care was taken by the planners to make use of the government land with the minimum land acquisition from private parties. Compensation rate for private parties was also finalized as per government rules. Care was also taken to minimize deforestation. Once the project is announced, it is expected that there will be a huge spurt in real estate prices in and around that area. Meanwhile, the Minister concerned insists that you realign the road in such a way that it comes closer to his 20 acres farmhouse. He also suggests that he would facilitate the purchase of a big plot of land in your wife name at the prevailing rate which is very nominal, in and around the proposed mega road project. He also tries to convince you by saying that there is no harm in it as he is buying the land legally. He even promises to supplement your savings in case you do not have sufficient funds to buy the land. However, by the act of realignment, a lot of agricultural lands has to be acquired, thereby causing a considerable financial burden on the government, and also the displacement of the farmers. As if this is not enough, it will involve cutting down of a large number of trees denuding the area of its green cover. Faced with this situation, what will you do? Critically examine various conflicts of interest and explain what your responsibilities are as a public servant.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"17","year":"2019","question":"In a modern democratic polity, there is a concept of the political executive and permanent executive elected people’s representatives forms the political executive and bureaucracy form the permanent executive. Ministers frame policy decisions and bureaucrats execute these. In the initial decades after independence, the relationship between the permanent executives and the political executives were characterized by mutual understanding, respect, and cooperation, without encroaching upon each other’s domain. However, in subsequent decades, the situation has changed. There are instances of the political executive insisting upon the permanent executives to follow its agenda. Respect for an appreciation of upright bureaucrats has declined. There is an increasing tendency among the political executive to get involved in routine administrative matters such as transfers, posting etc. Under this scenario, there is a definitive trend towards ‘politicization of bureaucracy’. The rising materialism and acquisitiveness in social life has also adversely impacted upon the ethical values of both the permanent executive and the political executive. What are the consequences of this ‘politicization of bureaucracy? Discuss.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"18","year":"2019","question":"You are the heading the rescue operations in an area affected by severe natural calamity, thousands of people are rendered homeless and deprived of food, drinking water and other basic amenities. Rescue work has been disrupted by heavy rainfall and damaged to supply routes. The local people are seeding with anger against the delayed limited rescue operations. When your team reaches the affected area, the people there heckle and even assault some of the team members. One of your team members is even severely injured. Faced with this crisis some team member pleads with you to call off the operations freeing threats to their life. In such trying circumstances, what will be your response? Examine the qualities of a public servant which will be required to manage the situations.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"19","year":"2019","question":"In one of the districts of a frontier state, narcotics menace has been rampant. This has resulted in money laundering, mushrooming of poppy farming, arms smuggling and near stalling of education. The system is on the verge of collapse. The situation has been further worsened by unconfirmed reports that local politicians, as well as some senior police officers, are providing surreptitious patronage to the drug mafia. At that point of time a woman police officer, known for her skills in handling such situations is appointed as superintendent of police to bring the situation to normalcy. If you are the same police officer, identify the various dimensions of the crisis. Based on your understanding, suggest measures to deal with the crisis.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"20","year":"2019","question":"Honesty and uprightness are the hallmarks of civil servants. Civil servants possessing these qualities are considered as a backbone of any strong organizations. In the line of duty, they take various decisions, at time some become bonafide mistakes. As long as such decisions, are not taken intentionally and do not benefit personally, the officer cannot be said to be guilty. Though such decisions may, at times, lead to unforeseen adverse consequences in the long term. In the recent past, a few instances have surfaced wherein civil servants have been implicated for bonafide mistakes. They have often been prosecuted and even imprisoned. These instances have greatly rattled the moral fibre of the civil servants. How does this trend affect the functioning of civil services? What measures can be taken to ensure that honest civil servants are not implicated for bonafide mistakes on their part? Justify your answer.","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"21","year":"2020","question":"Rampura, a remote district inhabited by a tribal population, is marked by extreme backwardness and abject poverty. Agriculture is the mainstay of the local population, though it is subsistence due to the very small landholdings. There is insignificant industrial or mining activity. Even the targeted welfare programs have inadequately benefited the tribal population. In this restrictive scenario, the youth has begun to migrate to other states to supplement the family income. Plight of minor girls is that their parents are persuaded by labour contractors to send them to work in the Bt Cotton farms of a nearby state. The soft fingers of the minor girls are well suited for plucking the cotton. The inadequate living and working conditions in these farms have caused serious health issues for the minor girls. NGOs in the districts of domicile and the cotton farms appear to be compromised and have not effectively espoused the twin issues of child labour and development of the area. You are appointed as the District Collector of Rampura. Identify the ethical issues involved. Which specific steps will you initiate to ameliorate the conditions of minor girls of your district and to improve the overall economic scenario in the district","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"22","year":"2020","question":"Migrant workers have always remained at the socio-economic margins of our society, silently serving as the instrumental labour force of urban economics. The pandemic has brought them into national focus. On announcement of a countrywide lockdown, a very large number of migrant workers decided to move back from their places of employment to their native villages. The non-availability of transport created its own problems. Added to this was the fear of starvation and inconvenience to their families. This caused, the migrant workers to demand wages and transport facilities for returning to their villages. Their mental agony was accentuated by multiple factors such as a sudden loss of livelihood, possibility of lack of food and inability to assist in harvesting their rabi crop due to not being able to reach home in time. Reports of inadequate response of some districts in providing the essential boarding and lodging arrangements along the way multiplied their fears. You have learnt many lessons from this situation when you were tasked to oversee the functioning of the District Disaster Relief Force in your district. In your opinion what ethical issues arose in the current migrant crisis? What do you understand by an ethical care giving state? What assistance can the civil society render to mitigate the sufferings of migrants in similar situations?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"23","year":"2020","question":"Rajesh Kumar is a senior public servant, with a reputation of honesty and forthrightness, currently posted in the Finance Ministry as the Head of the Budget Division. His department is presently busy in organizing the budgetary support to the states, four of which are due to the polls within the financial year. This year’s annual budget had allotted Rs 8300 crores for the National Housing Scheme (NHS), a centrally sponsored social housing scheme for the weaker sections of society. Rs 775 crores have been drawn for NHS till June. The Ministry of Commerce had long been pursuing a case for setting up a Special Economic Zone (SEZ) in a southern state to boost exports. After two years of detailed discussion between the center and state, the Union Cabinet approved the project in August. The process was initiated to acquire the necessary land. Eighteen months ago a leading Public Sector Unit (PSU) had projected the need for setting up a large natural gas processing plant in a northern state for the regional gas grid. The land is already in possession of the PSU. The gas grid is an essential component of the national energy security strategy. After three rounds of global bidding, the project was allotted to an MNC, M/s XYZ Hydrocarbons. The first tranche of payment to the MNC is scheduled to be made in December. Finance Ministry was asked for a timely allocation of an additional Rs 6000 crores for these two developmental projects. It was decided to recommend re-appropriation of this entire amount from NHS allocation. The file was forwarded to the Budget Department for their comments and further processing. On studying the case file, Rajesh Kumar realized that this re-appropriation may cause an inordinate delay in the execution of NHS, a project much publicized in the rallies of senior politicians. Correspondingly, the non-availability of finances would cause a financial loss in the SEZ and national embarrassment due to delayed payment in the international project. Rajesh Kumar discussed the matter with seniors. He was conveyed that this politically sensitive situation needs to be processed immediately. Rajesh Kumar realized that diversion of funds from the NHS could raise difficult questions for the government in the Parliament. Discuss the following with reference to this case: 1) Ethical issues involved in re-appropriation of funds from a welfare project to the development projects. 2) Given the need for proper utilization of public funds, discuss the options available to Rajesh Kumar. Is resigning a worthy option?","topic":"Case Study","marks":"20","paper":"GS4","type":"Case Study"},{"qno":"24","year":"2020","question":"You are a municipal commissioner of a large city, having the reputation of a very honest and upright officer. A huge multipurpose mall is under construction in your city in which a large number of daily wage earners are employed. One night, during monsoons, a big chunk of the roof collapsed causing instant death of four labourers including two minors. Many more were seriously injured requiring immediate medical attention. The mishap resulted in a big hue and cry, forcing the government to institute an enquiry. Your preliminary enquiry has revealed a series of anomalies. The material used for the construction was of poor quality. Despite the approved building plans permitting only one basement, an additional basement has been constructed. This was overlooked during the periodic inspections by the building inspector of the municipal corporation. In your enquiry, you noticed that the constructi
