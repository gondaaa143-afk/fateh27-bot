<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FATEH27 Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f2;color:#111;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{width:min(100%,760px);margin:auto;padding:18px 14px 110px}
.card{background:rgba(255,255,255,.88);border:1px solid #ddd;border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}
h1{font-size:24px;margin:0}
.badge{background:#111;color:#fff;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.stat{padding:12px;border-radius:15px;background:#f0f0f0}
.stat b{display:block;font-size:22px}.stat span{font-size:10px;color:#777}
.req{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #eee}
.req:last-child{border-bottom:0}
.info{min-width:0}.name{font-weight:800}.meta{font-size:11px;color:#777;margin-top:4px;overflow-wrap:anywhere}
.actions{display:flex;gap:7px;flex-shrink:0}
button{border:0;border-radius:11px;padding:9px 12px;font-weight:800;cursor:pointer}
.approve{background:#111;color:#fff}.reject{background:#eee;color:#111}
.empty{color:#777;font-size:13px;padding:15px 0}
@media(max-width:520px){.req{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.stats{grid-template-columns:1fr 1fr}.wrap{padding:12px 10px 90px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top"><h1>FATEH27 Admin</h1><div class="badge">OWNER ACCESS</div></div>
    <div class="stats">
      <div class="stat"><b id="total">0</b><span>Total Requests</span></div>
      <div class="stat"><b id="pending">0</b><span>Pending</span></div>
      <div class="stat"><b id="membersCount">0</b><span>Approved Members</span></div>
    </div>
  </div>
  <div class="card">
    <div class="top"><strong>Join Requests</strong><button id="refresh">Refresh</button></div>
    <div id="list" class="empty">Loading…</div>
  </div>
  <div class="card">
    <div class="top"><strong>Approved Members</strong><span class="meta">Who is currently added to FATEH27</span></div>
    <div id="membersList" class="empty">Loading…</div>
  </div>
</div>
<script>
(function(){
 const tg=window.Telegram?.WebApp;
 tg?.ready(); tg?.expand();
 const list=document.getElementById("list");
 const total=document.getElementById("total");
 const pending=document.getElementById("pending");
 const membersCount=document.getElementById("membersCount");
 const membersList=document.getElementById("membersList");

 function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
 function fmt(v){try{return v?new Date(v).toLocaleString():"—"}catch{return "—"}}

 async function load(){
   const initData=tg?.initData;
   if(!initData){list.innerHTML='<div class="empty">Open this page inside the FATEH27 Telegram Mini App.</div>';return;}
   list.textContent="Loading…";
   try{
     const r=await fetch("/api/access?admin=1",{headers:{"x-telegram-init-data":initData}});
     const d=await r.json();
     if(!r.ok) throw new Error(d.detail||d.error||"Admin access denied");
     const requests=d.requests||[];
     const members=d.members||[];
     total.textContent=requests.length;
     pending.textContent=requests.filter(x=>x.status==="pending").length;
     membersCount.textContent=members.length;
     if(!requests.length){list.innerHTML='<div class="empty">No join requests yet.</div>';return;}
     list.innerHTML=requests.map(x=>{
       const name=[x.firstName,x.lastName].filter(Boolean).join(" ")||"Unknown User";
       return '<div class="req"><div class="info"><div class="name">'+esc(name)+'</div><div class="meta">ID: '+esc(x.telegramId||"—")+(x.username?" • @"+esc(x.username):"")+'<br>Status: '+esc(x.status)+' • '+esc(fmt(x.updatedAt||x.requestedAt))+'</div></div><div class="actions">'+(x.status==="pending"?'<button class="approve" data-action="approve" data-id="'+esc(x.telegramId)+'">Approve</button><button class="reject" data-action="reject" data-id="'+esc(x.telegramId)+'">Reject</button>':"<span class='meta'>"+esc(x.status)+"</span>")+'</div></div>';
     }).join("");
   }catch(e){list.innerHTML='<div class="empty">'+esc(e.message)+'</div>';}
 }

 list.addEventListener("click",async e=>{
   const b=e.target.closest("button[data-action]"); if(!b)return;
   b.disabled=true;
   try{
     const r=await fetch("/api/access",{method:"POST",headers:{"content-type":"application/json","x-telegram-init-data":tg.initData},body:JSON.stringify({action:b.dataset.action,userId:b.dataset.id})});
     const d=await r.json();
     if(!r.ok) throw new Error(d.detail||d.error||"Action failed");
     await load();
   }catch(e){alert(e.message);b.disabled=false;}
 });
 document.getElementById("refresh").onclick=load;
 load();
})();
</script>
</body>
</html>
