const data=[{"year": "2013", "paper": "GS2", "question": "Discuss Section 66A of IT Act, with reference to its alleged violation of Article 19 of the Constitution.", "topic": "FR 19", "marks": "10"}, {"year": "2014", "paper": "GS2", "question": "What do you understand by the concept “freedom of speech and expression”? Does it cover hate speech also? Why do the films in India stand on a slightly different plane from other forms of expression? Discuss.", "topic": "FR 19", "marks": "12.5"}, {"year": "2015", "paper": "GS2", "question": "Does the right to clean environment entail legal regulations on burning crackers during Diwali? Discuss in the light of Article 21 of the Indian Constitution and Judgement(s) of the Apex Court in this regard.", "topic": "FR 21", "marks": "12.5"}, {"year": "2015", "paper": "GS2", "question": "Khap Panchayats have been in the news for functioning as extra-constitutional authorities, often delivering pronouncements amounting to human rights violations. Discuss critically the actions taken by the legislative, executive and the judiciary to set the things right in this regard.", "topic": "Rights", "marks": "12.5"}, {"year": "2015", "paper": "GS2", "question": "Discuss the possible factors that inhibit India from enacting for its citizens a uniform civil code as provided for in the Directive Principles of State Policy.", "topic": "DPSP", "marks": "12.5"}, {"year": "2016", "paper": "GS2", "question": "Discuss each adjective attached to the word ‘Republic’ in the preamble. Are they defendable in the present circumstances stances?", "topic": "Preamble", "marks": "12.5"}, {"year": "2017", "paper": "GS2", "question": "Examine the scope of Fundamental Rights in the light of the latest judgement of the Supreme Court on Right to Privacy.", "topic": "FR 21", "marks": "15"}, {"year": "2018", "paper": "GS2", "question": "Under what circumstances can the Financial Emergency be proclaimed by the President of India? What consequences follow when such a declaration remains in force?", "topic": "Emergency", "marks": "10"}, {"year": "2018", "paper": "GS2", "question": "India and USA are two large democracies. Examine the basic tenants on which the two political systems are based.", "topic": "USA", "marks": "15"}, {"year": "2019", "paper": "GS2", "question": "What can France learn from the Indian Constitution’s approach to secularism?", "topic": "FRANCE", "marks": "10"}, {"year": "2019", "paper": "GS2", "question": "“Parliament’s power to amend the Constitution is a limited power and it cannot be enlarged into absolute power.” In the light of this statement explain whether Parliament under Article 368 of the Constitution can destroy the Basic Structure of the Constitution by expanding its amending power?", "topic": "Amendment", "marks": "15"}, {"year": "2020", "paper": "GS2", "question": "The judicial systems in India and UK seem to be converging as well as diverging in recent times. Highlight the key points of convergence and divergence between the two nations in terms of their judicial practices.", "topic": "UK", "marks": "10"}, {"year": "2021", "paper": "GS2", "question": "Constitutional Morality’ is rooted in the Constitution itself and is founded on its essential facets. Explain the doctrine of ‘Constitutional Morality’ with the help of relevant judicial decisions.", "topic": "Significance", "marks": "10"}, {"year": "2021", "paper": "GS2", "question": "Though the Human Rights Commissions have contributed immensely to the protection of human rights in India, yet they have failed to assert themselves against the mighty and powerful. Analyzing their structural and practical limitations, suggest remedial measures.", "topic": "Rights", "marks": "15"}, {"year": "2022", "paper": "GS2", "question": "“The most significant achievement of modern law in India is the constitutionalization of environmental problems by the Supreme Court.” Discuss this statement with the help of relevant case laws.", "topic": "Evolution", "marks": "10"}, {"year": "2022", "paper": "GS2", "question": "“Right of movement and residence throughout the territory of India are freely available to the Indian citizens, but these rights are not absolute. “ Comment.", "topic": "FR 19", "marks": "10"}, {"year": "2022", "paper": "GS2", "question": "Critically examine the procedures through which the Presidents of India and France are elected.", "topic": "FRANCE", "marks": "15"}, {"year": "2023", "paper": "GS2", "question": "Compare and contrast the British and Indian approaches to Parliamentary sovereignty.", "topic": "BRITISH", "marks": "10"}, {"year": "2023", "paper": "GS2", "question": "\"The Constitution of India is a living instrument with capabilities of enormous dynamism.It is a constitution made for a progressive society.\" Illustrate with special reference to the expanding horizons of the right to life and personal liberty.", "topic": "Constitution", "marks": "15"}, {"year": "2023", "paper": "GS2", "question": "Explain the constitutional perspectives of Gender Justice with the help of relevant Constitutional Provisions and case laws.", "topic": "Laws", "marks": "15"}, {"year": "2023", "paper": "GS2", "question": "Account for the legal and political factors responsible for the reduced frequency of using Article 356 by the Union Governments since mid 1990s.", "topic": "Laws", "marks": "15"}, {"year": "2014", "paper": "GS2", "question": "Instances of President’s delay in commuting death sentences has come under public debate as denial of justice. Should there be a time limit specified for the President to accept/reject such petitions? Analyse.", "topic": "President", "marks": "12.5"}, {"year": "2014", "paper": "GS2", "question": "The size of the cabinet should be as big as governmental work justifies and as big as the Prime Minister can manage as a team. How far the efficacy of a government then is inversely related to the size of the cabinet? Discuss.", "topic": "Cabinet", "marks": "12.5"}, {"year": "2021", "paper": "GS2", "question": "To what extent, in your view, the Parliament is able to ensure accountability of the executive in India?", "topic": "Executive", "marks": "10"}, {"year": "2021", "paper": "GS2", "question": "Do Department-related Parliamentary Standing Committees keep the administration on its toes and inspire reverence for parliamentary control? Evaluate the working of such committees with suitable examples", "topic": "Committees", "marks": "15"}, {"year": "2013", "paper": "GS2", "question": "The role of individual MPs (Members of Parliament) has diminished over the years and as a result healthy constructive debates on policy issues are not usually witnessed. How far can this be attributed to the anti-defection law, which was legislated but with a different intention?", "topic": "Anti-defection", "marks": "10"}, {"year": "2014", "paper": "GS2", "question": "The ‘Powers, Privileges and Immunities of Parliament and its Members’ as envisaged in Article 105 of the Constitution leave room for a large number of un-codified and un- enumerated privileges to continue. Assess the reasons for the absence of legal codification of the ‘parliamentary privileges’. How can this problem be addressed?", "topic": "Parliamentry Privilege", "marks": "12.5"}, {"year": "2016", "paper": "GS2", "question": "The Indian party system is passing through a phase of transition which looks to be full of contradictions and paradoxes.” Discuss.", "topic": "Political Parties", "marks": "12.5"}, {"year": "2017", "paper": "GS2", "question": "The Indian Constitution has provisions for holding joint session of the two houses of the Parliament. Enumerate the occasions when this would normally happen and also the occasions when it cannot, with reasons thereof.", "topic": "Parliament", "marks": "15"}, {"year": "2017", "paper": "GS2", "question": "To enhance the quality of democracy in India the Election Commission of India has proposed electoral reforms in 2016. What are the suggested reforms and how far are they significant to make democracy successful?", "topic": "Electoral reforms in 2016", "marks": "15"}, {"year": "2017", "paper": "GS2", "question": "‘Simultaneous election to the Lok Sabha and the State Assemblies will limit the amount of time and money spent in electioneering but it will reduce the government’s accountability to the people’ Discuss.", "topic": "Election", "marks": "10"}, {"year": "2018", "paper": "GS2", "question": "In the light of recent controversy regarding the use of Electronic Voting Machines (EVM), what are the challenges before the Election Commission of India to ensure the trustworthiness of elections in India", "topic": "Election", "marks": "10"}, {"year": "2018", "paper": "GS2", "question": "Why do you think the committees are considered to be useful for parliamentary work? Discuss, in this context, the role or the Estimates Committee.", "topic": "Parliamentry Committee", "marks": "10"}, {"year": "2019", "paper": "GS2", "question": "On what grounds a people’s representative can be disqualified under the Representation of People Act, 1951? Also mention the remedies available to such person against his disqualification.", "topic": "RoPA", "marks": "15"}, {"year": "2019", "paper": "GS2", "question": "Individual Parliamentarian’s role as the national lawmaker is on a decline, which in turn, has adversely impacted the quality of debates and their outcome. Discuss.", "topic": "Debate", "marks": "15"}, {"year": "2020", "paper": "GS2", "question": "Rajya Sabha has been transformed from a ‘useless stepney tyre’ to the most useful supporting organ in past few decades. Highlight the factors as well as the areas in which this transformation could be visible.", "topic": "Rajya Sabha", "marks": "15"}, {"year": "2020", "paper": "GS2", "question": "“There is a need for simplification of procedure for disqualification of persons found guilty of corrupt practices under the Representation of Peoples Act”. Comment.", "topic": "RoPA", "marks": "10"}, {"year": "2020", "paper": "GS2", "question": "‘Once a Speaker, Always a Speaker’! Do you think this practice should be adopted to impart objectivity to the office of the Speaker of Lok Sabha? What could be its implications for the robust functioning of parliamentary business in India?", "topic": "Speaker", "marks": "10"}, {"year": "2021", "paper": "GS2", "question": "Explain the constitutional provisions under which Legislative Councils are established. Review the working and current status of Legislative Councils with suitable illustrations.", "topic": "Legislative Council", "marks": "15"}, {"year": "2022", "paper": "GS2", "question": "Discuss the role of the Vice –Presidents of India as the chairman of the Rajyasabha", "topic": "Rajya Sabha", "marks": "10"}, {"year": "2022", "paper": "GS2", "question": "Discuss the procedures to decide the disputes arising out of the election of a Member of the Parliament or State Legislature under The Representation of the People Act, 1951. What are the grounds on which the election of any returned candidate may be declared void? What remedy is available to the aggrieved party against the decision? Refer to the case laws.", "topic": "RoPA", "marks": "15"}, {"year": "2022", "paper": "GS2", "question": "Discuss the essential conditions for the exercise of the legislative powers by the Governor. Discuss the legality of the re-promulgation of ordinances by the Governor without placing them before the Legislature.", "topic": "Governor", "marks": "15"}, {"year": "2023", "paper": "GS2", "question": "Discuss the role of Presiding Officers of state legislatures in maintaining order and impartiality in conducting legislative work and in facilitating best democratic practices.", "topic": "Presiding Office", "marks": "10"}, {"year": "2023", "paper": "GS2", "question": "Discuss the contribution of civil society groups for women’s effective and meaningful participation and representation in state legislatures in India.", "topic": "State", "marks": "15"}, {"year": "2023", "paper": "GS2", "question": "Explain the structure of the Parliamentary Committee system. How far have the financial committees helped in the institutionalization of Indian Parliament?", "topic": "Parliamentary Committee", "marks": "15"}, {"year": "2013", "paper": "GS2", "question": "The Supreme Court of India keeps a check on arbitrary power of the Parliament in amending the Constitution. Discuss critically.", "topic": "SC", "marks": "10"}, {"year": "2014", "paper": "GS2", "question": "Starting from inventing the ‘basic structure’ doctrine, the judiciary has played a highly proactive role in ensuring that India develops into a thriving democracy. In light of the statement, evaluate the role played by judicial activism in achieving the ideals of democracy.", "topic": "Role of Judiciary", "marks": "12.5"}, {"year": "2015", "paper": "GS2", "question": "Resorting to ordinances has always raised concern on violation of the spirit of separation of powers doctrine. While noting the rationales justifying the power to promulgate ordinances, analyze whether the decisions of the Supreme Court on the issue have further facilitated resorting to this power. Should the power to promulgate ordinances be repealed?", "topic": "SoP Ordinance", "marks": "12.5"}, {"year": "2016", "paper": "GS2", "question": "What was held in the Coelho case? In this context, can you say that judicial review is of key importance amongst the basic features of the Constitution?", "topic": "Judicial Review", "marks": "12.5"}, {"year": "2017", "paper": "GS2", "question": "Critically examine the Supreme Court’s judgement on ‘National Judicial Appointments Commission Act, 2014’ with reference to appointment of judges of higher judiciary in India.", "topic": "SC", "marks": "10"}, {"year": "2018", "paper": "GS2", "question": "Whether the Supreme Court Judgement (July 2018) can settle the political tussle between the Lt. Governor and elected government of Delhi? Examine.", "topic": "SC", "marks": "15"}, {"year": "2019", "paper": "GS2", "question": "From the resolution of contentious issues regarding distribution of legislative powers by the courts, ‘Principle of Federal Supremacy’ and ‘Harmonious Construction’ have emerged. Explain.", "topic": "SoP", "marks": "10"}, {"year": "2019", "paper": "GS2", "question": "Do you think that constitution of India does not accept principle of strict separation of powers rather it is based on the principle of ‘checks and balance’? Explain.", "topic": "SoP", "marks": "10"}, {"year": "2020", "paper": "GS2", "question": "Judicial Legislation is antithetical to the doctrine of separation of powers as envisaged in the Indian Constitution. In this context justify the filing of large number of public interest petitions praying for issuing guidelines to executive authorities.", "topic": "SoP", "marks": "15"}, {"year": "2021", "paper": "GS2", "question": "Discuss the desirability of greater representation to women in the higher judiciary to ensure diversity, equity and inclusiveness.", "topic": "Women in Judiciary", "marks": "10"}, {"year": "2022", "paper": "GS2", "question": "To what extent, in your opinion, as the decentralisation of power in India changed the governance landscape at the grassroots?", "topic": "SoP", "marks": "10"}, {"year": "2023", "paper": "GS2", "question": "Constitutionally guaranteed judicial independence is a prerequisite of democracy. Comment.", "topic": "Judicial", "marks": "10"}, {"year": "2013", "paper": "GS2", "question": "Constitutional mechanisms to resolve the inter-state water disputes have failed to address and solve the problems. Is the failure due to structural or process inadequacy or both? Discuss.", "topic": "Water Dispute", "marks": "10"}, {"year": "2013", "paper": "GS2", "question": "Many State Governments further bifurcate geographical administrative areas like Districts and Talukas for better governance. In light of the above, can it also be justified that more number of smaller States would bring in effective governance at State level? Discuss.", "topic": "Local level", "marks": "10"}, {"year": "2013", "paper": "GS2", "question": "Recent directives from Ministry of Petroleum and Natural Gas are perceived by the `Nagas’ as a threat to override the exceptional status enjoyed by the State. Discuss in light of Article 371A of the Indian Constitution.", "topic": "State", "marks": "10"}, {"year": "2014", "paper": "GS2", "question": "Though the federal principle is dominant in our Constitution and that principle is one of its basic features, but it is equally true that federalism under the Indian Constitution leans in favour of a strong Centre, a feature that militates against the concept of strong federalism. Discuss.", "topic": "Federalism", "marks": "12.5"}, {"year": "2015", "paper": "GS2", "question": "In absence of a well-educated and organized local level government system, `Panchayats’ and ‘Samitis’ have remained mainly political institutions and not effective instruments of governance. Critically discuss.", "topic": "Local level", "marks": "12.5"}, {"year": "2015", "paper": "GS2", "question": "The concept of cooperative federalism has been increasingly emphasized in recent years. Highlight the drawbacks in the existing structure and the extent to which cooperative federalism would answer the shortcomings.", "topic": "Federalism", "marks": "12.5"}, {"year": "2016", "paper": "GS2", "question": "Did the Government of India Act, 1935 lay down a federal constitution? Discuss.", "topic": "Federalism", "marks": "12.5"}, {"year": "2016", "paper": "GS2", "question": "To what extent is Article 370 of the Indian Constitution, bearing marginal note “Temporary provision with respect to the State of Jammu and Kashmir”, temporary? Discuss the future prospects of this provision in the context of Indian polity.", "topic": "State", "marks": "12.5"}, {"year": "2016", "paper": "GS2", "question": "Discuss the essentials of the 69th Constitutional Amendment Act and anomalies, if any that have led to recent reported conflicts between the elected representatives and the institution of the Lieutenant Governor in the administration of Delhi. Do you think that this will give rise to a new trend in the functioning of the Indian federal politics?", "topic": "Federalism", "marks": "12.5"}, {"year": "2017", "paper": "GS2", "question": "“The local self-government system in India has not proved to be effective instrument of governance”. Critically examine the statement and give your views to improve the situation.", "topic": "Local level", "marks": "10"}, {"year": "2018", "paper": "GS2", "question": "Assess the importance of Panchayat system in India as a part of local government. Apart from government grants, what sources the Panchayats can look out for financing developmental projects.", "topic": "Local level", "marks": "15"}, {"year": "2019", "paper": "GS2", "question": "“The reservation of seats for women in the institutions of local self- government has had a limited impact on the patriarchal character of the Indian Political Process.” Comment.", "topic": "Women Local Govt", "marks": "15"}, {"year": "2020", "paper": "GS2", "question": "How far do you think cooperation, competition and confrontation have shaped the nature of federation in India? Cite some recent examples to validate your answer.", "topic": "Federalism", "marks": "10"}, {"year": "2020", "paper": "GS2", "question": "Indian Constitution exhibits centralising tendencies to maintain unity and integrity of the nation. Elucidate in the perspective of the Epidemic Diseases Act, 1897; The Disaster Management Act, 2005 and recently passed Farm Acts.", "topic": "Federalism", "marks": "15"}, {"year": "2020", "paper": "GS2", "question": "The strength and sustenance of local institutions in India has shifted from their formative phase of ‘Functions, Functionaries and Funds’ to the contemporary stage of ‘Functionality’. Highlight the critical challenges faced by local inst onal self- esteem and ambitions” Explain with suitable examples.", "topic": "USA", "marks": "15"}, {"year": "2019", "paper": "GS2", "question": "“The long-sustained image of India as a leader of the oppressed and marginalised Nations has disappeared on account of its new found role in the emerging global order”. Elaborate.", "topic": "Image", "marks": "15"}, {"year": "2019", "paper": "GS2", "question": "‘The time has come for India and Japan to build a strong contemporary relationship, one involving global and strategic partnership that will have a great significance for Asia and the world as a whole.’ Comment.", "topic": "Japan", "marks": "10"}, {"year": "2020", "paper": "GS2", "question": "What is the significance of Indo-US defence deals over Indo-Russian defence deals? Discuss with reference to stability in the Indo-Pacific region.", "topic": "Defence", "marks": "15"}, {"year": "2020", "paper": "GS2", "question": "‘Indian diaspora has a decisive role to play in the politics and economy of America and European Countries’. Comment with examples.", "topic": "Diaspora US Europe", "marks": "10"}, {"year": "2021", "paper": "GS2", "question": "“If the last few decades were of Asia’s growth story, the next few are expected to be of Africa’s.” In the light of this statement, examine India’s influence in Africa in recent years.", "topic": "Africa", "marks": "10"}, {"year": "2021", "paper": "GS2", "question": "“The USA is facing an existential threat in the form of a China, that is much more challenging than the erstwhile Soviet Union.” Explain.", "topic": "USA- CHINA", "marks": "10"}, {"year": "2022", "paper": "GS2", "question": "Clean energy is the order of the day.’ Describe briefly India’s changing policy towards climate change in various international fora in the context of geopolitics.", "topic": "Climate policy", "marks": "15"}, {"year": "2023", "paper": "GS2", "question": "Indian diaspora has scaled new heights in the West. Describe its economic and political benefits for India.", "topic": "Diaspora West", "marks": "10"}, {"year": "2013", "paper": "GS2", "question": "The World Bank and the IMF, collectively known as the Bretton Woods Institutions, are the two inter-governmental pillars supporting the structure of the world’s economic and financial order. Superficially, the World Bank and the IMF exhibit many common characteristics, yet their role, functions and mandate are distinctly different. Elucidate.", "topic": "WB IMF", "marks": "10"}, {"year": "2014", "paper": "GS2", "question": "WTO is an important international institution where decisions taken affect countries in profound manner. What is the mandate of WTO and how binding are their decisions? Critically analyse India’s stand on the latest round of talks on Food security.", "topic": "WTO", "marks": "12.5"}, {"year": "2014", "paper": "GS2", "question": "India has recently signed to become founding a New Development Bank (NDB) and also the Asian Infrastructure Investment Bank (AIIB) .How will the role of the two Banks be different? Discuss the significance of these two Banks for India.", "topic": "NDB AIIB", "marks": "12.5"}, {"year": "2014", "paper": "GS2", "question": "Some of the International funding agencies have special terms for economic participation stipulating a substantial component of the aid to be used for sourcing equipment from the leading countries. Discuss on merits of such terms and if, there exists a strong case not to accept such conditions in the Indian context.", "topic": "Funding Agency", "marks": "12.5"}, {"year": "2014", "paper": "GS2", "question": "The aim of Information Technology Agreements (ITAs) is to lower all taxes and tariffs on information technology products by signatories to zero. What impact should such agreements have on India’s interests?", "topic": "Agreements", "marks": "12.5"}, {"year": "2015", "paper": "GS2", "question": "Discuss the impediments India is facing in its pursuit of a permanent seat in UN Security Council.", "topic": "UNSC", "marks": "12.5"}, {"year": "2016", "paper": "GS2", "question": "What are the aims and objectives of the McBride Commission of the UNESCO? What is India’s position on these?", "topic": "UNESCO Comission", "marks": "12.5"}, {"year": "2016", "paper": "GS2", "question": "“The broader aims and objectives of WTO are to manage and promote international trade in the era of globalization. But the Doha round of negotiations seem doomed due to differences between the developed and the developing countries.” Discuss in the Indian perspective.", "topic": "WTO", "marks": "12.5"}, {"year": "2017", "paper": "GS2", "question": "What are the main functions of the United Nations Economic and Social Council (ECOSOC)? Explain different functional commissions attached to it.", "topic": "UNESCO Comission", "marks": "10"}, {"year": "2018", "paper": "GS2", "question": "What are the key areas of reform if the WTO has to survive in the present context of ‘Trade War’, especially keeping in mind the interest of India?", "topic": "WTO", "marks": "15"}, {"year": "2018", "paper": "GS2", "question": "A number or outside powers have entrenched themselves in Central Asia, which is a zone to interest to India. Discuss the implications, in this context, of India’s joining the Ashgabat Agreement, 2018.", "topic": "Agreements", "marks": "10"}, {"year": "2019", "paper": "GS2", "question": "‘Too little cash, too much politics, leaves UNESCO fighting for life.’ Discuss the statement in the light of US’ withdrawal and its accusation of the cultural body as being ‘anti-Israel bias’.", "topic": "UNESCO", "marks": "10"}, {"year": "2020", "paper": "GS2", "question": "Critically examine the role of WHO in providing global health security during the Covid-19 pandemic.", "topic": "WHO", "marks": "10"}, {"year": "2020", "paper": "GS2", "question": "‘Quadrilateral Security Dialogue (Quad)’ is transforming itself into a trade bloc from a military alliance, in present times – Discuss.", "topic": "QUAD", "ma [...new Set(data.map(x=>x.year))].sort((a,b)=>Number(b)-Number(a)).forEach(y=>{
  year.innerHTML+=`<option value="${y}">${y}</option>`;
});

function escapeHtml(value){
  return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function render(){
  box.innerHTML="";
  const term=search.value.toLowerCase().trim();
  const filtered=data.filter(q=>
    (year.value==="all"||q.year===year.value) &&
    (q.question.toLowerCase().includes(term)||q.topic.toLowerCase().includes(term))
  );
  count.textContent=`${filtered.length} Questions`;

  filtered.forEach(q=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="cardTop">
        <span class="year">${q.year}</span>
        <span class="meta">${q.marks} Marks</span>
      </div>
      <div class="question">${escapeHtml(q.question)}</div>
      <span class="topic">${escapeHtml(q.topic)}</span>`;
    card.onclick=()=>openQuestion(q);
    box.appendChild(card);
  });

  if(!filtered.length) box.innerHTML=`<div class="card" style="text-align:center;color:#777;cursor:default">No question found</div>`;
}

function openQuestion(q){
  clearInterval(interval);
  currentQuestion=q.question;
  dYear.textContent=q.year;
  dMarks.textContent=`${q.marks} Marks`;
  dTopic.textContent=q.topic;
  dQuestion.textContent=q.question;
  timer.textContent="00:00";
  try{if(window.Progress&&typeof Progress.addSolved==="function")Progress.addSolved("GS2",q.year+"_"+q.question)}catch(e){}
  listView.style.display="none";detail.style.display="block";window.scrollTo(0,0);
}

document.getElementById("backBtn").onclick=()=>{
  clearInterval(interval);timer.textContent="00:00";
  detail.style.display="none";listView.style.display="block";window.scrollTo(0,0);
};

document.getElementById("copyBtn").onclick=async()=>{
  try{await navigator.clipboard.writeText(currentQuestion);if(tg)tg.showAlert("Question Copied");else alert("Question Copied");}
  catch(e){if(tg)tg.showAlert("Copy Failed");else alert("Copy Failed");}
};

function startTimer(min){
  clearInterval(interval);let sec=min*60;timer.textContent=`${min}:00`;
  interval=setInterval(()=>{
    sec--;timer.textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
    if(sec<=0){
      clearInterval(interval);
      try{if(window.Progress&&typeof Progress.timerCompleted==="function")Progress.timerCompleted()}catch(e){}
      if(tg)tg.showAlert("Time Up (+10 XP)");else alert("Time Up (+10 XP)");
      timer.textContent="00:00";
    }
  },1000);
}
document.getElementById("btn7").onclick=()=>startTimer(7);
document.getElementById("btn11").onclick=()=>startTimer(11);
document.getElementById("homeBtn").onclick=()=>window.location.href="index.html";
year.onchange=render;search.oninput=render;render();
</script>
