<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FATEH27 Current Affairs</title>

<script src="./progress.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#04110a;color:#fff}
.wrap{padding:18px;padding-bottom:90px}
h1{font-size:34px;font-weight:900}
.sub{color:#9FD8B6;margin:4px 0 20px}
.search{width:100%;padding:14px;border-radius:16px;border:1px solid #1f5f3a;background:#081b11;color:#fff;margin-bottom:18px}
.filter{display:flex;gap:8px;overflow:auto;margin-bottom:18px}
.chip{padding:10px 16px;border-radius:999px;border:1px solid #1f5f3a;background:#081b11;color:#fff}
.active{background:#1fd37a;color:#001a0d;font-weight:bold}
.card{background:rgba(10,24,16,.9);border:1px solid rgba(57,255,136,.18);border-radius:22px;padding:18px;margin-bottom:18px}
.tag{display:inline-block;margin-top:10px;padding:6px 12px;border-radius:999px;background:#0d2d1b;border:1px solid #1f5f3a;font-size:12px}
ul{margin:14px 0 0 18px}
li{margin:8px 0}
button{width:100%;padding:15px;border:none;border-radius:18px;background:#1fd37a;color:#001a0d;font-weight:bold;margin-top:16px}
.back{margin-top:24px}
</style>
</head>
<body>

<div class="wrap">

<h1>CURRENT AFFAIRS</h1>
<div class="sub">Command Center • <span id="date">Loading...</span></div>

<input class="search" id="search" placeholder="Search topic, scheme, article...">

<div class="filter">
<div class="chip active" onclick="setFilter('All',this)">All</div>
<div class="chip" onclick="setFilter('GS1',this)">GS1</div>
<div class="chip" onclick="setFilter('GS2',this)">GS2</div>
<div class="chip" onclick="setFilter('GS3',this)">GS3</div>
<div class="chip" onclick="setFilter('GS4',this)">GS4</div>
</div>

<div id="newsContainer"></div>

<button class="back" onclick="location.href='index.html'">← Back to War Room</button>

</div>

<script>
let articles = [];
let currentFilter = "All";

async function loadCurrentAffairs() {
  try {
    const res = await fetch("/data/current-affairs.json?t=" + Date.now());
    const data = await res.json();

    document.getElementById("date").textContent =
      data.date || new Date().toISOString().slice(0, 10);

    articles = (data.articles || []).map(a => ({
      title: a.title,
      gs: a.gs_paper?.match(/GS Paper (\d)/)
        ? "GS" + a.gs_paper.match(/GS Paper (\d)/)[1]
        : "GS3",
      points: a.key_points || [],
      source: a.gs_paper || ""
    }));

    render();
  } catch (e) {
    document.getElementById("newsContainer").innerHTML =
      "<div class='card'>Data load failed.</div>";
  }
}

function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const box = document.getElementById("newsContainer");
  box.innerHTML = "";

  articles
    .filter(a =>
      (currentFilter === "All" || a.gs === currentFilter) &&
      a.title.toLowerCase().includes(q)
    )
    .forEach(a => {
      box.innerHTML += `
        <div class="card">
          <h2>${a.title}</h2>

          <div class="tag">${a.gs}</div>
          <div class="tag">${a.source}</div>

          <ul>
            ${a.points.map(p => `<li>${p}</li>`).join("")}
          </ul>

          <button onclick="markXP()">+10 XP Mark Revised</button>
        </div>
      `;
    });
}

function setFilter(gs, el) {
  currentFilter = gs;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
  render();
}

function markXP() {
  const d = Progress.get();
  d.xp = (d.xp || 0) + 10;
  Progress.save(d);
  alert("+10 XP");
}

document.getElementById("search").addEventListener("input", render);
loadCurrentAffairs();
</script>
</body>
</html>
