<script>

/* ---------------------------------------
   TELEGRAM
--------------------------------------- */

if(window.Telegram && Telegram.WebApp){

  Telegram.WebApp.ready();

  Telegram.WebApp.expand();

  if(Telegram.WebApp.BackButton){

    Telegram.WebApp.BackButton.show();

    Telegram.WebApp.BackButton.onClick(function(){
      goBack();
    });

  }

}


/* ---------------------------------------
   BACK
--------------------------------------- */

function goBack(){

  if(window.history.length > 1){

    window.history.back();

  }else{

    location.href="index.html";

  }

}


/* ---------------------------------------
   VARIABLES
--------------------------------------- */

let articles = [];

let currentFilter = "ALL";

let revised = JSON.parse(
  localStorage.getItem("fateh27_ca_revised") || "[]"
);

let xp = Number(
  localStorage.getItem("fateh27_ca_xp") || 0
);

let important = JSON.parse(
  localStorage.getItem("fateh27_ca_important") || "[]"
);

let bookmarked = JSON.parse(
  localStorage.getItem("fateh27_ca_bookmarked") || "[]"
);


/* ---------------------------------------
   LOAD CURRENT AFFAIRS
--------------------------------------- */

async function loadCurrentAffairs(){

  try{

    const response = await fetch(
      "/data/current.md?t=" + Date.now()
    );

    if(!response.ok){

      throw new Error(
        "current.md not found"
      );

    }

    const markdown =
      await response.text();

    parseMarkdown(markdown);

    renderArticles();

  }catch(error){

    console.error(error);

    document.getElementById("content").innerHTML = `

      <div class="error">

        <strong>
          Current Affairs load नहीं हो पाया।
        </strong>

        <br><br>

        GitHub Actions से
        <code>data/current.md</code>
        generate होना चाहिए।

      </div>

    `;

  }

}


/* ---------------------------------------
   MARKDOWN PARSER
--------------------------------------- */

function parseMarkdown(text){

  articles = [];

  const blocks =
    text.split(/\n---\n/);

  blocks.forEach(block => {

    if(!block.includes("### Why in News?")){
      return;
    }

    const titleMatch =
      block.match(/##\s+\d+\.\s+(.+)/);

    if(!titleMatch){
      return;
    }

    articles.push({

      title:titleMatch[1].trim(),

      source:getSection(
        block,
        "Source:"
      ),

      url:getSection(
        block,
        "Source URL:"
      ),

      category:getSection(
        block,
        "Category:"
      ),

      priority:getSection(
        block,
        "Priority:"
      ),

      sourceGroup: /the hindu/i.test(getSection(block,"Source:"))
        ? "THE HINDU"
        : /\bpib\b/i.test(getSection(block,"Source:"))
          ? "PIB"
          : "OTHER",

      why:getSection(
        block,
        "Why in News?"
      ),

      what:getSection(
        block,
        "What Happened?"
      ),

      background:getSection(
        block,
        "Background"
      ),

      prelims:getSection(
        block,
        "Prelims Focus"
      ),

      mains:getSection(
        block,
        "Mains Focus"
      ),

      syllabus:getSection(
        block,
        "UPSC Syllabus Link"
      ),

      staticLink:getSection(
        block,
        "Static Connection"
      ),

      pyq:getSection(
        block,
        "PYQ Connection"
      ),

      revision:getSection(
        block,
        "30-Second Revision"
      ),

      recall:getSection(
        block,
        "Active Recall"
      )

    });

  });


  document.getElementById(
    "articleCount"
  ).innerText = articles.length;


  updateStats();


  const dateMatch =
    text.match(
      /##\s+(\d{1,2}\s+\w+\s+\d{4})/
    );


  if(dateMatch){

    document.getElementById(
      "date"
    ).innerText = dateMatch[1];

  }

}


/* ---------------------------------------
   SECTION EXTRACTOR
--------------------------------------- */

function getSection(text,label){

  const escaped =
    label.replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );

  const regex =
    new RegExp(
      escaped +
      "\\s*\\n?([\\s\\S]*?)(?=\\n###|\\n##|$)"
    );

  const match =
    text.match(regex);

  if(!match){
    return "";
  }

  return match[1]
    .replace(/^\s+|\s+$/g,"")
    .trim();

}


/* ---------------------------------------
   FILTER
--------------------------------------- */

function setFilter(filter,button){

  currentFilter = filter;

  document
    .querySelectorAll(".filter")
    .forEach(b =>
      b.classList.remove("active")
    );

  button.classList.add("active");

  renderArticles();

}


/* ---------------------------------------
   RENDER
--------------------------------------- */

function renderArticles(){

  const search =
    document.getElementById(
      "search"
    ).value
    .toLowerCase()
    .trim();


  const filtered =
    articles.filter(article => {

      const filterMatch =
        currentFilter === "ALL" ||
        (currentFilter === "IMPORTANT" && important.includes(articles.indexOf(article))) ||
        (currentFilter === "SAVED" && bookmarked.includes(articles.indexOf(article))) ||
        (currentFilter === "THE HINDU" && (
          article.sourceGroup === "THE HINDU" ||
          /the hindu/i.test(article.source || "")
        )) ||
        (currentFilter === "PIB" && (
          article.sourceGroup === "PIB" ||
          /\bpib\b/i.test(article.source || "")
        )) ||
        article.category
          .toUpperCase()
          .includes(currentFilter);


      const text = (

        article.title + " " +
        article.source + " " +
        article.category + " " +
        article.why + " " +
        article.what + " " +
        article.prelims + " " +
        article.mains

      ).toLowerCase();


      const searchMatch =
        !search ||
        text.includes(search);


      return (
        filterMatch &&
        searchMatch
      );

    });


  if(filtered.length === 0){

    document.getElementById(
      "content"
    ).innerHTML = `

      <div class="loading">

        इस filter में कोई
        current affair नहीं मिला।

      </div>

    `;

    return;

  }


  const renderCard = article => {
    const originalIndex = articles.indexOf(article);
    return createArticle(article, originalIndex);
  };

  if(currentFilter === "ALL" && !search){
    const hindu = filtered.filter(a => a.sourceGroup === "THE HINDU");
    const pib = filtered.filter(a => a.sourceGroup === "PIB");
    const other = filtered.filter(a => a.sourceGroup === "OTHER");

    document.getElementById("content").innerHTML = [
      hindu.length ? `
        <section class="sourceSection">
          <div class="sourceSectionHead">
            <div class="sourceSectionKicker">Source • The Hindu</div>
            <div class="sourceSectionTitle">The Hindu Current Affairs</div>
            <div class="sourceSectionSub">UPSC-relevant news • Prelims + Mains</div>
          </div>
        </section>
        ${hindu.map(renderCard).join("")}
      ` : "",
      pib.length ? `
        <section class="sourceSection">
          <div class="sourceSectionHead">
            <div class="sourceSectionKicker">Source • PIB</div>
            <div class="sourceSectionTitle">PIB Current Affairs</div>
            <div class="sourceSectionSub">Government releases • Schemes • Reports • Policies</div>
          </div>
        </section>
        ${pib.map(renderCard).join("")}
      ` : "",
      other.length ? other.map(renderCard).join("") : ""
    ].join("");
    return;
  }

  document.getElementById("content").innerHTML =
    filtered.map(renderCard).join("");

}


/* ---------------------------------------
   ARTICLE
--------------------------------------- */

function createArticle(article,index){

  const isRevised = revised.includes(index);
  const isImportant = important.includes(index);
  const isBookmarked = bookmarked.includes(index);

  const priorityClass =
    String(article.priority || "").toUpperCase() === "HIGH"
      ? "priority high"
      : "priority";

  const analysisId = "analysis-" + index;

  return `
    <article class="article" id="article-${index}">

      <div class="articleTop">

        <div class="articleNumber">
          ${index + 1}
        </div>

        <div class="articleTitle">
          ${escapeHtml(article.title)}
        </div>

        <div class="${priorityClass}">
          ${escapeHtml(article.priority || "UPSC")}
        </div>

      </div>

      <div class="meta">
        <div class="tag">
          ${escapeHtml(article.category || "UPSC")}
        </div>
        <div class="tag">
          ${escapeHtml(article.source || "Source")}
        </div>
      </div>

      <div class="analysisTools">

        <button
          class="analysisBtn"
          id="analysisBtn-${index}"
          onclick="toggleAnalysis(${index})"
          aria-expanded="false"
          aria-controls="${analysisId}">
          Read Analysis
        </button>

        <button
          class="utilityBtn ${isImportant ? "active" : ""}"
          onclick="toggleImportant(${index})">
          ${isImportant ? "★ Important" : "☆ Important"}
        </button>

        <button
          class="utilityBtn ${isBookmarked ? "active" : ""}"
          onclick="toggleBookmark(${index})">
          ${isBookmarked ? "✓ Saved" : "＋ Save"}
        </button>

        <button
          class="utilityBtn"
          id="translateBtn-${index}"
          onclick="translateArticle(${index})">
          हिंदी में पढ़ें
        </button>

      </div>

      <div class="translationPanel" id="translation-${index}">
        <div class="translationHeading">हिंदी अनुवाद</div>
        <div id="translationContent-${index}"></div>
      </div>

      <div class="analysisPanel" id="${analysisId}">

        <div class="analysisHeader">
          <div class="analysisHeading">UPSC Analysis</div>
          <div class="analysisHint">Prelims + Mains</div>
        </div>

        ${sectionHTML("Why in News?",article.why)}
        ${sectionHTML("What Happened?",article.what)}
        ${sectionHTML("Background",article.background)}
        ${sectionHTML("Prelims Focus",article.prelims)}
        ${sectionHTML("Mains Focus",article.mains)}
        ${sectionHTML("UPSC Syllabus",article.syllabus)}
        ${sectionHTML("Static Connection",article.staticLink)}
        ${sectionHTML("PYQ Connection",article.pyq)}
        ${sectionHTML("30-Second Revision",article.revision)}

      </div>

      <div class="recall">
        <div class="recallTitle">
          Active Recall
        </div>
        <div class="recallQuestion">
          ${escapeHtml(
            article.recall || "Revise this topic."
          )}
        </div>
      </div>

      <div class="articleFooter">

        <button
          class="actionBtn ${isRevised ? "revised" : ""}"
          onclick="markRevised(${index})">
          ${isRevised ? "✓ Revised +10 XP" : "Mark Revised +10 XP"}
        </button>

        ${
          article.url
          ? `
          <button
            class="actionBtn"
            onclick="window.open('${escapeAttr(article.url)}','_blank')">
            Source ↗
          </button>
          `
          : ""
        }

      </div>

    </article>
  `;
}

/* ---------------------------------------
   INLINE ANALYSIS
--------------------------------------- */

function toggleAnalysis(index){

  const panel = document.getElementById("analysis-" + index);
  const button = document.getElementById("analysisBtn-" + index);

  if(!panel || !button) return;

  const willOpen = !panel.classList.contains("open");

  panel.classList.toggle("open",willOpen);
  button.classList.toggle("open",willOpen);
  button.setAttribute("aria-expanded",String(willOpen));
  button.innerText = willOpen ? "Hide Analysis" : "Read Analysis";

}

/* ---------------------------------------
   HINDI TRANSLATION
--------------------------------------- */

async function translateArticle(index){

  const article = articles[index];
  const panel = document.getElementById("translation-" + index);
  const content = document.getElementById("translationContent-" + index);
  const button = document.getElementById("translateBtn-" + index);

  if(!article || !panel || !content || !button) return;

  const cacheKey = "fateh27_ca_hi_" + index + "_" + btoa(unescape(encodeURIComponent(article.title))).slice(0,24);
  const cached = localStorage.getItem(cacheKey);

  panel.classList.add("open");

  if(cached){
    content.innerHTML = sectionHTML("हिंदी अनुवाद", cached);
    button.innerText = "✓ हिंदी";
    return;
  }

  content.innerHTML = '<div class="translationLoading">हिंदी अनुवाद तैयार हो रहा है…</div>';
  button.disabled = true;
  button.innerText = "अनुवाद हो रहा है…";

  try{
    const tgInit = window.Telegram?.WebApp?.initData || sessionStorage.getItem("f27_tg_init_data") || "";
    if(!tgInit) throw new Error("Telegram authentication required.");

    const sourceText = [
      "Title: " + article.title,
      "Why in News?: " + article.why,
      "What Happened?: " + article.what,
      "Background: " + article.background,
      "Prelims Focus: " + article.prelims,
      "Mains Focus: " + article.mains,
      "UPSC Syllabus Link: " + article.syllabus,
      "Static Connection: " + article.staticLink,
      "PYQ Connection: " + article.pyq,
      "30-Second Revision: " + article.revision,
      "Active Recall: " + article.recall
    ].filter(Boolean).join("\n\n");

    const response = await fetch("/api/translate",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-telegram-init-data":tgInit
      },
      body:JSON.stringify({text:sourceText,source:"en",target:"hi"})
    });

    const data = await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.detail || data.error || "Translation failed.");

    const translation = String(data.translation || "").trim();
    if(!translation) throw new Error("Translation returned empty output.");

    localStorage.setItem(cacheKey, translation);
    content.innerHTML = sectionHTML("हिंदी अनुवाद", translation);
    button.innerText = "✓ हिंदी";
  }catch(error){
    content.innerHTML = '<div class="translationError">हिंदी अनुवाद उपलब्ध नहीं है। ' + escapeHtml(error.message || "") + '</div>';
    button.innerText = "↻ Retry Hindi";
  }finally{
    button.disabled = false;
  }
}

/* ---------------------------------------
   IMPORTANT
--------------------------------------- */

function toggleImportant(index){

  if(important.includes(index)){
    important = important.filter(i => i !== index);
  }else{
    important.push(index);
  }

  localStorage.setItem(
    "fateh27_ca_important",
    JSON.stringify(important)
  );

  renderArticles();

}

/* ---------------------------------------
   BOOKMARK
--------------------------------------- */

function toggleBookmark(index){

  if(bookmarked.includes(index)){
    bookmarked = bookmarked.filter(i => i !== index);
  }else{
    bookmarked.push(index);
  }

  localStorage.setItem(
    "fateh27_ca_bookmarked",
    JSON.stringify(bookmarked)
  );

  renderArticles();

}

/* ---------------------------------------
   SECTION HTML
--------------------------------------- */

function sectionHTML(title,text){

  if(!text){
    return "";
  }

  return `

    <div class="section">

      <div class="sectionTitle">
        ${title}
      </div>

      <div class="sectionText">
        ${escapeHtml(text)}
      </div>

    </div>

  `;

}


/* ---------------------------------------
   REVISED
--------------------------------------- */

function markRevised(index){

  if(revised.includes(index)){
    return;
  }


  revised.push(index);

  xp += 10;


  localStorage.setItem(
    "fateh27_ca_revised",
    JSON.stringify(revised)
  );


  localStorage.setItem(
    "fateh27_ca_xp",
    xp
  );


  updateStats();

  renderArticles();

}


/* ---------------------------------------
   STATS
--------------------------------------- */

function updateStats(){

  document.getElementById(
    "revisedCount"
  ).innerText = revised.length;


  document.getElementById(
    "xpCount"
  ).innerText = xp;

}


/* ---------------------------------------
   ESCAPE
--------------------------------------- */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return String(value || "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,"&quot;");

}
