<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FATEH27 Current Affairs</title>

<style>
body{
background:#07152d;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:20px;
}
h1{font-size:32px;}
.tabs{
display:flex;
gap:8px;
margin:18px 0;
flex-wrap:wrap;
}
button{
background:#18d26b;
color:white;
border:none;
padding:10px 16px;
border-radius:20px;
font-weight:bold;
}
button.active{
background:#00a651;
}
.card{
background:#0d2148;
padding:18px;
border-radius:18px;
white-space:pre-wrap;
line-height:1.7;
}
</style>
</head>

<body>

<h1>📚 Current Affairs</h1>

<div class="tabs">
<button onclick="loadGS('gs1',this)" class="active">GS1</button>
<button onclick="loadGS('gs2',this)">GS2</button>
<button onclick="loadGS('gs3',this)">GS3</button>
<button onclick="loadGS('gs4',this)">GS4</button>
</div>

<div class="card" id="content">Loading...</div>

<script>
async function loadGS(gs,btn){
document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
if(btn)btn.classList.add("active");

const res=await fetch("/"+gs+"?t="+Date.now());
const text=await res.text();
document.getElementById("content").innerText=text;
}

loadGS("gs1",document.querySelector("button"));
</script>

</body>
</html>
