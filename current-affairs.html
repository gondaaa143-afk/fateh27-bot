<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FATEH27 Current Affairs</title>

<style>
body{background:#02140b;color:#fff;font-family:Arial,sans-serif;margin:0;padding:24px}
h1{margin:0;font-size:48px}
.sub{color:#9fb3a8;margin-bottom:24px}
.search{width:100%;padding:14px;background:#072317;border:1px solid #13452c;border-radius:18px;color:#fff;margin-bottom:20px;box-sizing:border-box}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.chip{padding:12px 20px;border:1px solid #175538;border-radius:999px;cursor:pointer}
.active{background:#2be07a;color:#000}
.card{background:#072317;border:1px solid #12462d;border-radius:22px;padding:22px;margin-bottom:18px}
.tag{display:inline-block;padding:6px 12px;border-radius:999px;background:#11321f;font-size:12px;margin-right:8px;margin-top:8px}
.box{background:#0b2c1d;border-radius:18px;padding:16px;margin-top:14px}
.back{width:100%;padding:18px;border:none;border-radius:18px;background:#2be07a;font-weight:bold;margin-top:22px}
</style>
</head>
<body>

<h1>CURRENT AFFAIRS</h1>
<div class="sub">Command Center • <span id="date">Loading...</span></div>

<input id="search" class="search" placeholder="Search topic, scheme, article...">

<div class="filters">
  <div class="chip active" onclick="setFilter('All',this)">All</div>
  <div class="chip" onclick="setFilter('GS1',this)">GS1</div>
  <div class="chip" onclick="setFilter('GS2',this)">GS2</div>
  <div class="chip" onclick="setFilter('GS3',this)">GS3</div>
  <div class="chip" onclick="setFilter('GS4',this)">GS4</div>
</div>

<div id="newsContainer"></div>

<button class="back" onclick="location.href='index.html'">← Back to War Room</button>

<script>
let articles=[];
let currentFilter="All";

async function loadCurrentAffairs(){
  try{
    const res=await fetch("/data/current-affairs.json?v="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);

    const data=await res.json();
    document.getElementById("date").textContent=data.date||"Today";

    articles=(data.articles||[]).map(a=>{
      let gs="GS3";
      if(a.gs) gs=a.gs;
      else if(a.gs_paper){
        const m=a.gs_paper.match(/GS Paper (\d)/);
        if(m) gs="GS"+m[1];
      }

      return{
        title:a.title||"",
        gs:gs,
        source:a.source||"AI",
        points:a.key_points||[],
        mains:a.mains||a.summary||"Use in UPSC answer writing."
      };
    });

    render();
  }catch(e){
    document.getElementById("newsContainer").innerHTML="<div class='card'>Data load failed.</div>";
  }
}

function render(){
  const q=document.getElementById("search").value.toLowerCase();
  const list=articles.filter(a=>(currentFilter==="All"||a.gs===currentFilter)&&a.title.toLowerCase().includes(q));

  const c=document.getElementById("newsContainer");
  c.innerHTML="";

  if(!list.length){
    c.innerHTML="<div class='card'>No articles found.</div>";
    return;
  }

  list.forEach(a=>{
    c.innerHTML+=`
      <div class="card">
        <h2>${a.title}</h2>
        <div>
          <span class="tag">${a.gs}</span>
          <span class="tag">${a.source}</span>
        </div>

        <div class="box">
          <b>Prelims Facts</b>
          <ul>${a.points.map(p=>`<li>${p}</li>`).join("")}</ul>
        </div>

        <div class="box">
          <b>Mains Value Addition</b>
          <p>${a.mains}</p>
        </div>
      </div>`;
  });
}

function setFilter(f,el){
  currentFilter=f;
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
  render();
}

document.getElementById("search").addEventListener("input",render);
window.onload=loadCurrentAffairs;
</script>

</body>
</html>
