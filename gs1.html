<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GS1 PYQs</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#07152d;color:white;font-family:Arial;padding:20px}
.card{background:#0f2348;padding:18px;border-radius:16px;margin:12px 0}
select{width:100%;padding:12px;border-radius:10px;margin:10px 0;background:#0f2348;color:white;border:none}
</style>
</head>
<body>

<h1>📘 GS1 PYQs</h1>

<div id="questions"></div>
</div>

<div class="card" id="q2">
<b>2025</b>
<p>How does urbanisation affect disaster management?</p>
</div>

<script>

const year=document.getElementById("year");

async function load(){
 const list=await fetch("/api/gs1").then(r=>r.json());
 const box=document.getElementById("questions");

 box.innerHTML="";

 list.forEach(q=>{
   if(year.value=="all"||year.value==q.year.toString()){
     box.innerHTML+=`
      <div class="card">
       <b>${q.year}</b>
       <p>${q.question}</p>
      </div>`;
   }
 });
}

year.onchange=load;
load();
  
</script>

</body>
</html>
