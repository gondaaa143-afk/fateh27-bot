<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GS1 PYQs</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  background:#07152d;
  color:white;
  font-family:Arial;
  padding:20px 20px 90px;
}
.card{
  background:#0f2348;
  padding:18px;
  border-radius:16px;
  margin:12px 0;
}
select,input,button{
  width:100%;
  padding:12px;
  border-radius:10px;
  margin:10px 0;
  background:#0f2348;
  color:white;
  border:none;
  box-sizing:border-box;
}
#detail{display:none;}

#homeBtn{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:180px;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#229ED9;
  color:white;
  font-size:18px;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="listView">
  <h1>📘 GS1 PYQs</h1>

  <select id="year"></select>
    <option value="all">All Years</option>
    <option value="2026">2026</option>
    <option value="2025">2025</option>
  </select>

  <input id="search" placeholder="Topic Search">

  <div id="questions"></div>
</div>

<div id="detail" class="card">
  <h2 id="dYear"></h2>
  <p id="dQuestion"></p>

  <button id="btn7">⏱ 7 Min Timer</button>
  <button id="btn11">⏱ 11 Min Timer</button>
  <button id="copyBtn">📋 Copy Question</button>
  <button id="backBtn">⬅ Back to List</button>

  <h3 id="timer"></h3>
</div>

<button id="homeBtn">⬅ Home</button>

<script>
Telegram.WebApp.ready();
Telegram.WebApp.expand();
const year=document.getElementById("year");

year.innerHTML='<option value="all">All Years</option>';

for(let y=2026;y>=2013;y--){
  year.innerHTML+=`<option value="${y}">${y}</option>`;
}
const year=document.getElementById("year");
const search=document.getElementById("search");
const box=document.getElementById("questions");

const listView=document.getElementById("listView");
const detail=document.getElementById("detail");
const dYear=document.getElementById("dYear");
const dQuestion=document.getElementById("dQuestion");
const timer=document.getElementById("timer");

let currentQuestion="";
<script>
Telegram.WebApp.ready();
Telegram.WebApp.expand();

const year=document.getElementById("year");
const search=document.getElementById("search");
const box=document.getElementById("questions");

const listView=document.getElementById("listView");
const detail=document.getElementById("detail");
const dYear=document.getElementById("dYear");
const dQuestion=document.getElementById("dQuestion");
const timer=document.getElementById("timer");

let currentQuestion="";
let interval;
let data=[];

async function loadCSV(){
  const text=await fetch("./pyqs.csv").then(r=>r.text());

  const rows=text.trim().split("\n").slice(1);

  data=rows.map(r=>{
    const c=r.match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g)||[];
    return{
      year:c[0]?.replace(/"/g,""),
      paper:c[1]?.replace(/"/g,""),
      question:c[2]?.replace(/"/g,""),
      topic:c[3]?.replace(/"/g,""),
      marks:c[4]?.replace(/"/g,"")
    };
  }).filter(x=>x.paper==="GS1");

  year.innerHTML='<option value="all">All Years</option>';
  [...new Set(data.map(x=>x.year))]
    .sort((a,b)=>b-a)
    .forEach(y=>year.innerHTML+=`<option value="${y}">${y}</option>`);

  render();
}

function render(){
  box.innerHTML="";
  data.filter(q=>
    (year.value==="all"||q.year===year.value) &&
    q.question.toLowerCase().includes(search.value.toLowerCase())
  ).forEach(q=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`<b>${q.year}</b><p>${q.question}</p>`;
    card.onclick=()=>{
      currentQuestion=q.question;
      dYear.textContent=q.year;
      dQuestion.textContent=q.question;
      listView.style.display="none";
      detail.style.display="block";
    };
    box.appendChild(card);
  });
}

document.getElementById("backBtn").onclick=()=>{
  detail.style.display="none";
  listView.style.display="block";
};

document.getElementById("copyBtn").onclick=()=>{
  navigator.clipboard.writeText(currentQuestion);
};

function startTimer(m){
  clearInterval(interval);
  let s=m*60;
  interval=setInterval(()=>{
    timer.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
    if(s--<=0){
      clearInterval(interval);
      Telegram.WebApp.showAlert("Time Up");
    }
  },1000);
}

document.getElementById("btn7").onclick=()=>startTimer(7);
document.getElementById("btn11").onclick=()=>startTimer(11);

year.onchange=render;
search.oninput=render;

loadCSV();
  
</script>

</body>
</html>
