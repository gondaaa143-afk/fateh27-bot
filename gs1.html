<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GS1 PYQs</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#07152d;color:white;font-family:Arial;padding:20px}
.card{background:#0f2348;padding:18px;border-radius:16px;margin:12px 0}
select{width:100%;padding:12px;border-radius:10px;margin:10px 0;background:#0f2348;color:white;border:none}
</style>
</head>
<body>

<h1>📘 GS1 PYQs</h1>
<select id="year">
  <option value="all">All Years</option>
  <option value="2026">2026</option>
  <option value="2025">2025</option>
</select>

<input id="search"
placeholder="Topic Search (जैसे Federalism)"
style="width:100%;padding:12px;border-radius:10px;margin:10px 0;background:#0f2348;color:white;border:none;">
<div id="questions"></div>
</div>

<div class="card" id="q2">
<b>2025</b>
<p>How does urbanisation affect disaster management?</p>
</div>
<script>
const year=document.getElementById("year");
const search=document.getElementById("search");
const box=document.getElementById("questions");

async function load(){

 const text=await fetch("/pyqs.csv").then(r=>r.text());

 const rows=text.trim().split("\n").slice(1);

 box.innerHTML="";

 rows.forEach(row=>{
   const parts=row.match(/(".*?"|[^,]+)/g);
   if(!parts) return;

   const y=parts[0];
   const paper=parts[1];
   const question=parts[2].replace(/^"|"$/g,"");

   if(
      paper==="GS1" &&
      (year.value==="all"||year.value===y) &&
      question.toLowerCase().includes(search.value.toLowerCase())
   ){
      box.innerHTML+=`
      <div class="card">
        <b>${y}</b>
        <p>${question}</p>
      </div>`;
   }
 });

}

year.onchange=load;
search.oninput=load;
load();
</script>

</body>
</html>
