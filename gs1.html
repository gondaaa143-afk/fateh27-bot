[...new Set(data.map(x => x.year))]
  .sort((a,b) => Number(b)-Number(a))
  .forEach(y => {
    year.innerHTML += `<option value="${y}">${y}</option>`;
  });

function render(){
  box.innerHTML = "";

  const term = search.value.toLowerCase().trim();

  const filtered = data.filter(q =>
    (year.value === "all" || q.year === year.value) &&
    (
      q.question.toLowerCase().includes(term) ||
      q.topic.toLowerCase().includes(term)
    )
  );

  count.textContent = `${filtered.length} Questions`;

  filtered.forEach(q => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="cardTop">
        <span class="year">${q.year}</span>
        <span class="meta">${q.marks} Marks</span>
      </div>
      <div class="question">${escapeHtml(q.question)}</div>
      <span class="topic">${escapeHtml(q.topic)}</span>
    `;

    card.onclick = () => openQuestion(q);
    box.appendChild(card);
  });

  if(!filtered.length){
    box.innerHTML = `
      <div class="card" style="text-align:center;color:#777;cursor:default">
        No question found
      </div>`;
  }
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function openQuestion(q){
  clearInterval(interval);

  currentQuestion = q.question;
  dYear.textContent = q.year;
  dMarks.textContent = `${q.marks} Marks`;
  dTopic.textContent = q.topic;
  dQuestion.textContent = q.question;
  timer.textContent = "00:00";

  try{
    if(window.Progress && typeof Progress.addSolved === "function"){
      Progress.addSolved("GS1", q.year + "_" + q.question);
    }
  }catch(e){}

  listView.style.display = "none";
  detail.style.display = "block";
  window.scrollTo(0,0);
}

document.getElementById("backBtn").onclick = () => {
  clearInterval(interval);
  timer.textContent = "00:00";
  detail.style.display = "none";
  listView.style.display = "block";
  window.scrollTo(0,0);
};

document.getElementById("copyBtn").onclick = async () => {
  try{
    await navigator.clipboard.writeText(currentQuestion);
    if(tg) tg.showAlert("Question Copied");
    else alert("Question Copied");
  }catch(e){
    if(tg) tg.showAlert("Copy Failed");
    else alert("Copy Failed");
  }
};

function startTimer(min){
  clearInterval(interval);

  let sec = min * 60;
  timer.textContent = `${min}:00`;

  interval = setInterval(() => {
    sec--;

    timer.textContent =
      Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0");

    if(sec <= 0){
      clearInterval(interval);

      try{
        if(window.Progress && typeof Progress.timerCompleted === "function"){
          Progress.timerCompleted();
        }
      }catch(e){}

      if(tg) tg.showAlert("Time Up (+10 XP)");
      else alert("Time Up (+10 XP)");

      timer.textContent = "00:00";
    }
  },1000);
}

document.getElementById("btn7").onclick = () => startTimer(7);
document.getElementById("btn11").onclick = () => startTimer(11);

document.getElementById("homeBtn").onclick = () => {
  window.location.href = "index.html";
};

year.onchange = render;
search.oninput = render;

render();
</script>
