<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GS1 PYQs</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#07152d;color:white;font-family:Arial;padding:20px}
.card{background:#0f2348;padding:18px;border-radius:16px;margin:12px 0}
select{width:100%;padding:12px;border-radius:10px;margin:10px 0;background:#0f2348;color:white;border:none}
</style>
</head>
<body>

<h1>📘 GS1 PYQs</h1>

<select id="year">
<option value="all">All Years</option>
<option value="2026">2026</option>
<option value="2025">2025</option>
</select>

<div class="card" id="q1">
<b>2026</b>
<p>Discuss the role of Mission Mausam in climate resilience.</p>
</div>

<div class="card" id="q2">
<b>2025</b>
<p>How does urbanisation affect disaster management?</p>
</div>

<script>
const year=document.getElementById("year");

year.onchange=()=>{
document.getElementById("q1").style.display=
(year.value=="all"||year.value=="2026")?"block":"none";

document.getElementById("q2").style.display=
(year.value=="all"||year.value=="2025")?"block":"none";
}
</script>

</body>
</html>
