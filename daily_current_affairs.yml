name: FATEH27 Daily Current Affairs

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-current-affairs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build daily UPSC current affairs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python scripts/build_current_affairs.py

      - name: Commit updated current affairs
        run: |
          git config user.name "FATEH27 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/current.md
          git diff --cached --quiet && exit 0
          git commit -m "Update daily UPSC current affairs"
          git push
