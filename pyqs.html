<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PYQs</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#07152d;color:white;font-family:Arial;padding:20px}
.card{background:#0f2348;padding:18px;border-radius:16px;margin:12px 0}
</style>
</head>
<body>

<h1>📚 UPSC PYQs</h1>

<div class="card" onclick="location.href='/gs1.html'">GS1 (2013–2026)</div>
<div class="card" onclick="location.href='/gs2.html'">GS2 (2013–2026)</div>
<div class="card" onclick="location.href='/gs3.html'">GS3 (2013–2026)</div>
<div class="card" onclick="location.href='/gs4.html'">GS4 (2013–2026)</div>
<script>
fetch("/api/pyqs")
.then(r=>r.json())
.then(list=>{
  const box=document.createElement("div");

  list.forEach(q=>{
    box.innerHTML+=`
      <div class="card">
        <b>${q.paper} • ${q.year}</b>
        <p>${q.question}</p>
      </div>`;
  });

  document.body.appendChild(box);
});
</script>
</body>
</html>
</body>
</html>
