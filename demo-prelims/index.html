<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAMBHAV UPSC • Prelims Test Series</title><style>
:root{--p:#f5f2eb;--c:#fffdf9;--c2:#f8f4eb;--t:#111;--m:#716e67;--b:#e3ded2;--g:#dfc477;--gt:#17130b;--s:#f0ece3}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--t);font:14px Inter,system-ui,sans-serif}button,select{font:inherit}.hd{height:76px;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--b);position:sticky;top:0;background:#f5f2ebee;z-index:3}.brand{border:0;background:none;text-align:left;cursor:pointer}.brand b{font-size:20px}.brand b span{color:var(--g)}.sub,.muted{color:var(--m)}.sub{font-size:11px}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:22px 0 70px;display:grid;gap:14px}.card{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:18px;box-shadow:0 12px 36px #1010100f}.hero{display:flex;justify-content:space-between;align-items:center;background:var(--c2)}.ey{font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--m);text-transform:uppercase}.hero h1{font-size:38px;letter-spacing:-.045em;margin:7px 0}.hero p{color:var(--m);font-size:12px}.badge{border:1px solid var(--b);border-radius:15px;background:var(--c);padding:12px;display:grid;text-align:center}.choice{width:100%;min-height:70px;margin-top:8px;padding:10px 12px;border:1px solid var(--b);border-radius:15px;background:var(--c);color:var(--t);display:flex;align-items:center;gap:11px;text-align:left;cursor:pointer}.choice.active{border-color:var(--g);box-shadow:inset 0 0 0 1px var(--g)}.num{width:32px;height:32px;border-radius:10px;background:var(--s);display:grid;place-items:center;font-weight:900;font-size:10px;flex:none}.arrow{color:var(--g);font-size:22px}.primary{width:100%;min-height:48px;border:1px solid var(--g);border-radius:12px;background:var(--g);color:var(--gt);font-weight:900;cursor:pointer;margin-top:12px}.secondary{min-height:42px;padding:0 14px;border:1px solid var(--b);border-radius:12px;background:var(--c);color:var(--t);font-weight:800;cursor:pointer}.summary{display:flex;justify-content:space-between;color:var(--m);font-size:10px;border-top:1px solid var(--b);margin-top:13px;padding-top:12px}.counts{display:flex;gap:5px;margin-top:8px}.count{flex:1;min-height:38px;border:1px solid var(--b);background:var(--c);border-radius:9px;cursor:pointer}.count.active{background:var(--g)}.testhead{height:68px;padding:10px 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid var(--b);position:sticky;top:0;background:#f5f2ebf2;z-index:3}.timer{justify-self:end;font-weight:900;font-variant-numeric:tabular-nums}.layout{width:min(1280px,calc(100% - 28px));margin:20px auto;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}.qcard{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:28px}.meta{display:flex;gap:10px;color:var(--m);font-size:12px;margin-bottom:20px}.qno{display:inline-grid;place-items:center;background:var(--g);padding:7px 12px;border-radius:9px;font-weight:900}.question{font-size:26px;line-height:1.5;margin:16px 0 24px}.option{width:100%;min-height:58px;margin-top:10px;padding:10px 13px;display:flex;gap:12px;align-items:center;border:1px solid var(--b);border-radius:14px;background:var(--c);color:var(--t);cursor:pointer;text-align:left}.option.sel{background:var(--g);color:var(--gt);border-color:var(--g)}.letter{width:32px;height:32px;border-radius:50%;background:var(--s);display:grid;place-items:center;font-weight:900;flex:none}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:22px}.spacer{flex:1}.side{display:grid;gap:14px;align-content:start}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{border:1px solid var(--b);border-radius:11px;padding:10px;text-align:center;display:grid;gap:3px}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.pal{height:36px;border:1px solid var(--b);border-radius:8px;background:var(--c);cursor:pointer}.pal.a{background:var(--g)}.resultscore{font-size:55px;font-weight:950;letter-spacing:-.06em}.resultgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.review{width:100%;display:flex;align-items:center;gap:10px;padding:9px;border:1px solid var(--b);border-radius:12px;background:var(--c);text-align:left;margin-top:7px}.toggle{width:40px;height:40px;border:1px solid var(--b);border-radius:12px;background:var(--c);cursor:pointer}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:none}.testhead{grid-template-columns:auto 1fr auto}}@media(max-width:520px){.hero h1{font-size:29px}.qcard{padding:18px}.question{font-size:20px}.resultgrid{grid-template-columns:repeat(2,1fr)}}body.dark{--p:#0b0b0b;--c:#151515;--c2:#1b1b1b;--t:#f5f2eb;--m:#aaa49a;--b:#2b2b2b;--s:#222}body.dark .hd,body.dark .testhead{background:#0b0b0bee}
</style></head><body><header class="hd"><button class="brand" onclick="center()"><b>SAMBHAV <span>UPSC</span></b><div class="sub">Intelligence • Preparation • Performance</div></button><button class="toggle" onclick="document.body.classList.toggle('dark')">☾</button></header><main id="app"></main><script>
var qs=[{y:2024,s:'Environment',q:'Consider the following statements regarding biodiversity hotspots:',o:['They must have at least 1,500 endemic vascular plant species.','They must have lost at least 70% of original vegetation.','Both A and B are correct.','Neither A nor B is correct.'],a:2},{y:2023,s:'Polity',q:'Which of the following best describes constitutional morality?',o:['Strict adherence to every convention','Respect for constitutional values and institutions','Supremacy of executive discretion','Judicial control over all policy'],a:1},{y:2022,s:'Economy',q:'Which inflation measure is primarily used by the RBI for monetary policy decisions?',o:['CPI Combined','WPI','GDP Deflator','IIP'],a:0},{y:2021,s:'Geography',q:'Seasonal reversal of winds over the Indian subcontinent is primarily associated with:',o:['Ocean currents','Differential heating of land and sea','Earthquakes','Polar winds'],a:1}];while(qs.length<20)qs.push(qs[qs.length%4]);
var st={type:'full',count:20,i:0,ans:{},mark:{},time:7200};var timer;
function center(){clearInterval(timer);document.getElementById('app').innerHTML='<div class="wrap"><section class="card hero"><div><div class="ey">SAMBHAV UPSC • PRELIMS</div><h1>Prelims Test Series</h1><p>UPSC-style simulation, original PYQ papers and focused practice.</p></div><div class="badge"><b>+2</b><span>−0.66</span></div></section><section class="card"><div class="ey">TEST SERIES</div><h2>Choose a test</h2>'+choice('full','01','Full UPSC Simulator','100 questions • 2 hours • complete exam simulation')+choice('paper','02','Original PYQ Paper','Complete paper year-wise from the existing PYQ bank')+choice('custom','03','Custom Test','Year • Subject • Topic • question count')+(st.type==='custom'?'<div class="counts">'+[20,30,50,75,100].map(function(n){return '<button class="count '+(st.count===n?'active':'')+'" onclick="st.count='+n+';center()">'+n+'</button>'}).join('')+'</div>':'')+'<div class="summary"><span>'+(st.type==='custom'?st.count+' questions • 120 minutes':st.type==='paper'?'2015 paper • 100 questions':'100 questions • 120 minutes')+'</span><span>+2 / −0.66</span></div><button class="primary" onclick="start()">Start '+(st.type==='paper'?'Original Paper':st.type==='custom'?'Custom Test':'Full Simulator')+' →</button></section><section class="card" style="background:var(--c2)"><div class="ey">QUICK PRACTICE</div><h2>Keep your daily practice moving</h2><button class="choice" onclick="st.count=20;start()"><span class="num">20</span><span><b>Daily 20 PYQ</b><small class="muted" style="display:block">Evening quick practice</small></span><span class="arrow">›</span></button><button class="choice" onclick="alert(\'No previous tests in this demo yet.\')"><span class="num">↺</span><span><b>Previous Tests</b><small class="muted" style="display:block">Score, accuracy and attempts</small></span><span class="arrow">›</span></button></section></div>'}
function choice(t,n,title,sub){return '<button class="choice '+(st.type===t?'active':'')+'" onclick="st.type=\''+t+'\';center()"><span class="num">'+n+'</span><span style="flex:1"><b>'+title+'</b><small class="muted" style="display:block;margin-top:3px">'+sub+'</small></span><span class="arrow">›</span></button>'}
function start(){st.i=0;st.ans={};st.mark={};st.time=st.type==='daily'?1800:7200;renderTest();timer=setInterval(function(){st.time--;if(st.time<=0){clearInterval(timer);result(true)}else{var e=document.getElementById('timer');if(e)e.textContent=fmt(st.time)}},1000)}
function fmt(n){var h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return [h,m,s].map(function(x){return String(x).padStart(2,'0')}).join(':')}
function renderTest(){var q=qs[st.i];var h='<div class="testhead"><button class="secondary" onclick="if(confirm(\'Leave this test?\'))center()">← Test Center</button><div style="text-align:center"><div class="ey">PRELIMS PRACTICE</div><b>Question '+(st.i+1)+' / '+st.count+'</b></div><div class="timer" id="timer">'+fmt(st.time)+'</div></div><div class="layout"><section class="qcard"><div class="meta"><span>'+q.y+'</span><span>'+q.s+'</span><span>+2 / -0.66</span></div><span class="qno">Q'+(st.i+1)+'</span><h1 class="question">'+q.q+'</h1>';q.o.forEach(function(o,i){h+='<button class="option '+(st.ans[st.i]===i?'sel':'')+'" onclick="st.ans['+st.i+']='+i+';renderTest()"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></button>'});h+='<div class="actions"><button class="secondary" onclick="delete st.ans[st.i];renderTest()">Clear Response</button><button class="secondary" onclick="st.mark[st.i]=!st.mark[st.i];renderTest()">'+(st.mark[st.i]?'★ Marked':'☆ Mark for Review')+'</button><span class="spacer"></span><button class="secondary" onclick="st.i=Math.max(0,st.i-1);renderTest()">Previous</button><button class="primary" style="width:auto;padding:0 18px" onclick="'+(st.i===st.count-1?'result(false)':'st.i++;renderTest()')+'">'+(st.i===st.count-1?'Submit Test':'Next')+'</button></div></section><aside class="side"><section class="card"><div class="ey">TEST SUMMARY</div><div class="stats"><div class="stat"><b>'+Object.keys(st.ans).length+'</b><span>Answered</span></div><div class="stat"><b>'+(st.count-Object.keys(st.ans).length)+'</b><span>Unanswered</span></div><div class="stat"><b>'+Object.values(st.mark).filter(Boolean).length+'</b><span>Review</span></div></div></section><section class="card"><div class="ey">QUESTION PALETTE</div><div class="palette">'+Array.from({length:st.count},function(_,i){return '<button class="pal '+(st.ans[i]!==undefined?'a':'')+'" onclick="st.i='+i+';renderTest()">'+(i+1)+'</button>'}).join('')+'</div></section><section class="card"><div class="ey">LANGUAGE</div><p class="muted">Translate the current UPSC question and options into exam-standard Hindi.</p><button class="primary" onclick="alert(\'Hindi translation API is mocked for this live demo.\')">Translate to Hindi</button></section></aside></div>';document.getElementById('app').innerHTML=h}
function result(auto){clearInterval(timer);var c=0,w=0;for(var i=0;i<st.count;i++){if(st.ans[i]===undefined)continue;if(st.ans[i]===qs[i].a)c++;else w++}var score=c*2-w*2/3,acc=(c+w)?c/(c+w)*100:0;document.getElementById('app').innerHTML='<div class="wrap"><section class="card"><div class="ey">TEST COMPLETED</div><h1>'+(auto?'Time Up':'Test Result')+'</h1><p class="muted">'+st.count+' questions • '+fmt(7200-st.time)+' used</p><div style="display:flex;gap:55px;margin:26px 0"><div><div class="resultscore">'+score.toFixed(2)+'</div><span class="muted">Score</span></div><div><div class="resultscore" style="font-size:36px">'+acc.toFixed(1)+'%</div><span class="muted">Accuracy</span></div></div><div class="resultgrid"><div class="stat"><b>'+c+'</b><span>Correct</span></div><div class="stat"><b>'+w+'</b><span>Wrong</span></div><div class="stat"><b>'+(st.count-c-w)+'</b><span>Unanswered</span></div><div class="stat"><b>-'+(w*2/3).toFixed(2)+'</b><span>Negative Marks</span></div></div><div class="actions"><button class="secondary" onclick="center()">Test Center</button><button class="primary" style="width:auto;padding:0 18px" onclick="start()">Retake Test</button></div></section><section class="card"><div class="ey">QUESTION-WISE REVIEW</div>'+Array.from({length:st.count},function(_,i){var a=st.ans[i],ok=a!==undefined&&a===qs[i].a;return '<div class="review"><span class="num">'+(i+1)+'</span><span style="flex:1"><b>'+(a===undefined?'Unanswered':ok?'Correct':'Wrong')+'</b><small class="muted" style="display:block">'+qs[i].s+' • '+qs[i].y+'</small></span><span>'+(a===undefined?'—':ok?'✓':'×')+'</span></div>'}).join('')+'</section></div>'}
center();
</script></body></html>
