<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FATEH27 — Commander Map</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Poppins,sans-serif;
  background:#f4f4f4;
  color:#111;
  min-height:100vh;
}

.app{
  max-width:1200px;
  margin:auto;
  padding:18px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.brand{
  font-size:24px;
  font-weight:800;
  letter-spacing:-.5px;
}

.brand span{
  color:#666;
}

.homeBtn{
  border:none;
  background:#111;
  color:#fff;
  padding:10px 17px;
  border-radius:14px;
  font-weight:700;
  cursor:pointer;
}

.hero{
  background:#111;
  color:#fff;
  border-radius:26px;
  padding:24px;
  margin-bottom:16px;
  box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.hero h1{
  font-size:28px;
  margin-bottom:6px;
}

.hero p{
  color:#bdbdbd;
  font-size:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:18px;
}

.stat{
  background:#1c1c1c;
  border:1px solid #333;
  border-radius:17px;
  padding:13px;
}

.stat small{
  color:#aaa;
  display:block;
  margin-bottom:5px;
}

.stat strong{
  font-size:20px;
}

.controls{
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.8);
  border-radius:24px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.tab{
  border:none;
  padding:12px;
  border-radius:14px;
  background:#e5e5e5;
  font-weight:700;
  cursor:pointer;
}

.tab.active{
  background:#111;
  color:#fff;
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

select,
input{
  width:100%;
  border:none;
  outline:none;
  background:#e7e7e7;
  color:#111;
  padding:12px 14px;
  border-radius:14px;
  font-size:14px;
  font-weight:600;
}

#map{
  height:540px;
  width:100%;
  border-radius:26px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.10);
  border:1px solid #ddd;
}

.mission{
  margin-top:16px;
  background:rgba(255,255,255,.8);
  backdrop-filter:blur(16px);
  border-radius:24px;
  padding:20px;
  border:1px solid #fff;
  box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.missionLabel{
  color:#777;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:7px;
}

.mission h2{
  font-size:21px;
  margin-bottom:6px;
}

.mission p{
  color:#555;
  line-height:1.5;
  font-size:14px;
}

.missionBtns{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.primary,
.secondary{
  flex:1;
  border:none;
  padding:13px;
  border-radius:15px;
  font-weight:800;
  cursor:pointer;
}

.primary{
  background:#111;
  color:#fff;
}

.secondary{
  background:#e5e5e5;
  color:#111;
}

.leaflet-popup-content-wrapper{
  border-radius:15px;
}

.leaflet-popup-content{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

@media(max-width:700px){
  .app{
    padding:12px;
  }

  .hero h1{
    font-size:24px;
  }

  .stats{
    grid-template-columns:repeat(3,1fr);
  }

  .filters{
    grid-template-columns:1fr;
  }

  #map{
    height:440px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="brand">FATEH<span>27</span></div>

    <button class="homeBtn" onclick="location.href='../index.html'">
      Home
    </button>
  </div>

  <section class="hero">
    <h1>Commander Map</h1>
    <p>India • World • UPSC Mapping Intelligence</p>

    <div class="stats">
      <div class="stat">
        <small>XP</small>
        <strong id="xp">0</strong>
      </div>

      <div class="stat">
        <small>Solved</small>
        <strong id="solved">0</strong>
      </div>

      <div class="stat">
        <small>Accuracy</small>
        <strong id="accuracy">0%</strong>
      </div>
    </div>
  </section>

  <section class="controls">

    <div class="tabs">
      <button class="tab active" id="indiaTab" onclick="setRegion('india')">
        India
      </button>

      <button class="tab" id="worldTab" onclick="setRegion('world')">
        World
      </button>
    </div>

    <div class="filters">

      <select id="category" onchange="applyFilters()">
        <option value="all">All Categories</option>
        <option value="river">Rivers</option>
        <option value="mountain">Mountains & Passes</option>
        <option value="lake">Lakes</option>
        <option value="park">National Parks</option>
        <option value="port">Ports & Coasts</option>
        <option value="city">Important Cities</option>
        <option value="current">Current Affairs Locations</option>
      </select>

      <input
        id="search"
        type="text"
        placeholder="Search location..."
        oninput="applyFilters()"
      >

    </div>

  </section>

  <div id="map"></div>

  <section class="mission">

    <div class="missionLabel">Current Mission</div>

    <h2 id="missionTitle">Loading mission...</h2>

    <p id="missionText">
      Select a location on the map and answer the mission.
    </p>

    <div class="missionBtns">

      <button class="primary" onclick="missionCorrect()">
        Correct
      </button>

      <button class="secondary" onclick="nextMission()">
        Next Mission
      </button>

    </div>

  </section>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

let region="india";
let filtered=[];
let markers=[];
let currentMission=null;
let xp=0;
let solved=0;
let correct=0;
let attempts=0;

const map=L.map("map").setView([22.5,78.9],5);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap"
  }
).addTo(map);

function setRegion(r){

  region=r;

  document.getElementById("indiaTab")
    .classList.toggle("active",r==="india");

  document.getElementById("worldTab")
    .classList.toggle("active",r==="world");

  if(r==="india"){
    map.setView([22.5,78.9],5);
  }else{
    map.setView([20,10],2);
  }

  applyFilters();
}

function applyFilters(){

  const category=
    document.getElementById("category").value;

  const search=
    document.getElementById("search").value
    .toLowerCase()
    .trim();

  filtered=locations.filter(x=>{

    const regionMatch=x.region===region;

    const categoryMatch=
      category==="all" || x.category===category;

    const searchMatch=
      !search ||
      x.name.toLowerCase().includes(search) ||
      x.info.toLowerCase().includes(search);

    return regionMatch && categoryMatch && searchMatch;

  });

  renderMarkers();

  if(filtered.length){
    selectMission(filtered[0]);
  }else{
    document.getElementById("missionTitle").textContent=
      "No location found";

    document.getElementById("missionText").textContent=
      "Try another category or search term.";

    currentMission=null;
  }
}

function renderMarkers(){

  markers.forEach(m=>map.removeLayer(m));
  markers=[];

  filtered.forEach(location=>{

    const marker=L.marker([
      location.lat,
      location.lng
    ]).addTo(map);

    marker.bindPopup(`
      <strong>${location.name}</strong>
      <br>
      <span>${location.info}</span>
    `);

    marker.on("click",()=>{
      selectMission(location);
    });

    markers.push(marker);

  });
}

function selectMission(location){

  currentMission=location;

  document.getElementById("missionTitle").textContent=
    location.name;

  document.getElementById("missionText").textContent=
    location.info;

}

function missionCorrect(){

  if(!currentMission) return;

  attempts++;
  correct++;
  xp+=20;
  solved++;

  updateStats();

  alert(
    "Mission Complete!\n+20 XP"
  );

  nextMission();
}

function nextMission(){

  if(!filtered.length) return;

  const index=
    Math.floor(Math.random()*filtered.length);

  selectMission(filtered[index]);

  map.flyTo(
    [filtered[index].lat,filtered[index].lng],
    region==="india"?6:3,
    {duration:1}
  );

}

function updateStats(){

  document.getElementById("xp").textContent=xp;

  document.getElementById("solved").textContent=solved;

  const acc=
    attempts===0
    ?0
    :Math.round((correct/attempts)*100);

  document.getElementById("accuracy").textContent=
    acc+"%";

  try{

    if(window.Progress){

      Progress.addSolved(
        "MAP",
        currentMission?.name || "Commander Map"
      );

    }

  }catch(e){}

}

applyFilters();
