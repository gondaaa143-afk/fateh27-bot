name: FATEH27 Daily Current Affairs

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get Current Affairs
        run: |
          curl -L "https://fateh27-bot.onrender.com/api/current" -o current.txt

      - name: Post to Telegram Split
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/telegram-post.mjs
