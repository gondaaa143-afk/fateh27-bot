name: FATEH27 Daily Current Affairs

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Get Current Affairs
        run: |
          mkdir -p data
          node scripts/current-affairs.mjs

      - name: Post to Telegram Split
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/telegram-post.mjs
