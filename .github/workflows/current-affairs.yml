name: FATEH27 Current Affairs

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Axios
        run: npm install axios

      - name: Generate Current Affairs
        run: node scripts/update-current.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit Changes
        run: |
          git config user.name "FATEH27 Bot"
          git config user.email "bot@fateh27.ai"
          git add data/current-affairs.json
          git diff --cached --quiet || git commit -m "Daily Current Affairs"
          git push
