name: FATEH27 Daily Current Affairs

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

 - name: Get Current Affairs
  run: |
    mkdir -p data
    node scripts/current-affairs.mjs

- name: Commit updated current affairs
  run: |
    git config --global user.name "github-actions[bot]"
    git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
    git add data/current.md
    git diff --cached --quiet || git commit -m "Auto update current affairs"
    git push

- name: Post to Telegram Split
  env:
    TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  run: |
    node scripts/telegram-post.mjs
