name: FATEH27 Current Affairs

on:
  schedule:
    - cron: "30 13 * * *"   # 7:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install axios fast-xml-parser

      - name: Update Current Affairs
        run: node scripts/update-current.js

      - name: Commit & Push
        run: |
          git config user.name "FATEH27 Bot"
          git config user.email "bot@fateh27.ai"
          git add data/current-affairs.json
          git diff --cached --quiet || git commit -m "Daily Current Affairs"
          git push
