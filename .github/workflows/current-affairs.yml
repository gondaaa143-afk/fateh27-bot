name: FATEH27 Current Affairs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install axios

      - run: node scripts/update-current.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - run: |
          git config user.name "FATEH27 Bot"
          git config user.email "bot@fateh27.ai"
          git add data/current-affairs.json
          git diff --cached --quiet || git commit -m "Daily Current Affairs"
          git push
